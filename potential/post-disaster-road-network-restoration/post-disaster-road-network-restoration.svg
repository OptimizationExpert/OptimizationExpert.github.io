<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- River -->
  <path d="M 0,340 C 150,300 250,380 400,330 C 550,280 650,360 800,320 L 800,400 C 650,440 550,360 400,410 C 250,460 150,380 0,420 Z" fill="#bfe3f5" opacity="0.7"/>

  <!-- Intact roads (gray) -->
  <path d="M 40,120 L 240,150" stroke="#94a3b8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 240,150 L 240,300" stroke="#94a3b8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 560,150 L 760,120" stroke="#94a3b8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 560,150 L 560,300" stroke="#94a3b8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 240,150 L 560,150" stroke="#94a3b8" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Damaged road segment (red dashed, cracked) -->
  <path d="M 240,300 L 320,335" stroke="#ef4444" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="4 10"/>
  <path d="M 480,335 L 560,300" stroke="#ef4444" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="4 10"/>

  <!-- Broken bridge over river -->
  <g>
    <rect x="320" y="322" width="70" height="24" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="3" transform="rotate(-6 355 334)"/>
    <rect x="410" y="322" width="70" height="24" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="3" transform="rotate(6 445 334)"/>
    <!-- gap crack marks -->
    <path d="M 388,320 L 396,336 L 386,344 L 402,352" stroke="#ef4444" stroke-width="3" fill="none"/>
  </g>

  <!-- Repair crew truck near bridge -->
  <g transform="translate(300,380)">
    <rect x="0" y="10" width="55" height="30" rx="4" fill="#f97316"/>
    <rect x="45" y="0" width="28" height="40" rx="4" fill="#fb923c"/>
    <circle cx="14" cy="44" r="9" fill="#334155"/>
    <circle cx="55" cy="44" r="9" fill="#334155"/>
    <!-- small crane arm -->
    <line x1="20" y1="10" x2="45" y2="-25" stroke="#7c2d12" stroke-width="5" stroke-linecap="round"/>
    <circle cx="45" cy="-25" r="5" fill="#7c2d12"/>
    <text x="27" y="70" font-size="15" fill="#7c2d12" text-anchor="middle">تیم تعمیر</text>
  </g>

  <!-- Hospital -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="90" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <rect x="35" y="20" width="20" height="20" fill="#ef4444"/>
    <rect x="40" y="12" width="10" height="36" fill="#ef4444"/>
    <rect x="15" y="28" width="10" height="20" fill="#ef4444"/>
    <text x="45" y="85" font-size="16" fill="#334155" text-anchor="middle" font-weight="bold">بیمارستان</text>
  </g>

  <!-- Relief camp -->
  <g transform="translate(660,50)">
    <polygon points="0,55 25,10 50,55" fill="#fdba74" stroke="#c2410c" stroke-width="3"/>
    <polygon points="35,55 60,10 85,55" fill="#fdba74" stroke="#c2410c" stroke-width="3"/>
    <text x="42" y="80" font-size="16" fill="#c2410c" text-anchor="middle" font-weight="bold">اردوگاه امدادی</text>
  </g>

  <!-- Central relief depot node -->
  <g transform="translate(370,60)">
    <circle cx="20" cy="20" r="22" fill="#1d4ed8"/>
    <text x="20" y="26" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">D</text>
    <text x="20" y="60" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold">انبار امداد</text>
  </g>

  <!-- Connector lines from depot to hospital/camp (intact network) -->
  <path d="M 370,80 L 120,120" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-dasharray="2 6"/>
  <path d="M 410,80 L 700,110" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-dasharray="2 6"/>

  <!-- Damaged road labels -->
  <text x="270" y="325" font-size="14" fill="#ef4444" font-weight="bold">آسیب‌دیده</text>
  <text x="450" y="325" font-size="14" fill="#ef4444" font-weight="bold">آسیب‌دیده</text>

  <!-- Title-like caption at bottom -->
  <text x="400" y="470" font-size="20" fill="#334155" text-anchor="middle" font-weight="bold">توالی‌بندی تعمیر شبکه جاده‌ای پس از بلایا</text>
</svg>
