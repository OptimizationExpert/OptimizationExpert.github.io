<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">تأمین مجدد مشترک چند کالا (Joint Replenishment)</text>

  <!-- Axis -->
  <line x1="90" y1="420" x2="750" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <text x="750" y="445" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="end">زمان</text>

  <!-- Joint order highlight bands -->
  <rect x="150" y="70" width="20" height="360" fill="#f97316" opacity="0.15"/>
  <rect x="430" y="70" width="20" height="360" fill="#f97316" opacity="0.15"/>
  <rect x="690" y="70" width="20" height="360" fill="#f97316" opacity="0.15"/>

  <text x="160" y="62" font-family="Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">سفارش مشترک</text>
  <text x="440" y="62" font-family="Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">سفارش مشترک</text>
  <text x="700" y="62" font-family="Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">سفارش مشترک</text>

  <!-- Item A row: sawtooth inventory, cycle = every joint order -->
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="end" font-weight="bold">کالای A</text>
  <polyline points="160,90 160,150 440,90 440,150 700,90 700,150" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="160" cy="90" r="6" fill="#1d4ed8"/>
  <circle cx="440" cy="90" r="6" fill="#1d4ed8"/>
  <circle cx="700" cy="90" r="6" fill="#1d4ed8"/>

  <!-- Item B row: cycle = every joint order too, but different slope -->
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="13" fill="#0d9488" text-anchor="end" font-weight="bold">کالای B</text>
  <polyline points="160,200 160,260 440,200 440,260 700,200 700,260" fill="none" stroke="#0d9488" stroke-width="3"/>
  <circle cx="160" cy="200" r="6" fill="#0d9488"/>
  <circle cx="440" cy="200" r="6" fill="#0d9488"/>
  <circle cx="700" cy="200" r="6" fill="#0d9488"/>

  <!-- Item C row: cycle = every OTHER joint order (k_i = 2), plus minor order between -->
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="end" font-weight="bold">کالای C</text>
  <polyline points="160,310 160,370 440,310 440,370 700,310 700,370" fill="none" stroke="#b45309" stroke-width="3"/>
  <circle cx="160" cy="310" r="6" fill="#b45309"/>
  <circle cx="440" cy="310" r="6" fill="#b45309" stroke="#b45309" stroke-width="1"/>
  <circle cx="700" cy="310" r="6" fill="#b45309"/>

  <!-- Legend / annotation -->
  <text x="160" y="405" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">t=0</text>
  <text x="440" y="405" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">t=T</text>
  <text x="700" y="405" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">t=2T</text>

  <text x="400" y="470" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">هر سه کالا در یک لحظه سفارش داده می‌شوند تا هزینه سفارش مشترک فقط یک‌بار پرداخت شود</text>
</svg>
