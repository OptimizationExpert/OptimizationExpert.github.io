<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" fill="#0f172a"/>

  <!-- Central opened warehouse -->
  <rect x="82" y="82" width="36" height="36" rx="5" fill="#f97316"/>
  <text x="100" y="106" font-family="Arial" font-size="18" fill="#0f172a" text-anchor="middle">&#9733;</text>

  <!-- Customers around -->
  <g fill="#38bdf8">
    <circle cx="45" cy="45" r="8"/>
    <circle cx="155" cy="45" r="8"/>
    <circle cx="45" cy="155" r="8"/>
    <circle cx="155" cy="155" r="8"/>
  </g>

  <!-- Connections -->
  <g stroke="#f97316" stroke-width="2.5" opacity="0.8">
    <line x1="100" y1="100" x2="45" y2="45"/>
    <line x1="100" y1="100" x2="155" y2="45"/>
    <line x1="100" y1="100" x2="45" y2="155"/>
    <line x1="100" y1="100" x2="155" y2="155"/>
  </g>
</svg>
