<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="480" fill="#0f172a"/>

  <!-- Title bar -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f97316" text-anchor="middle">شبکه مکان‌یابی تسهیلات</text>

  <!-- Candidate warehouse (not opened) -->
  <g>
    <rect x="120" y="120" width="46" height="46" rx="6" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="143" y="148" font-family="Arial" font-size="20" fill="#64748b" text-anchor="middle">?</text>
    <text x="143" y="188" font-family="Arial" font-size="13" fill="#94a3b8" text-anchor="middle">اصفهان</text>
  </g>

  <!-- Opened warehouse 1 -->
  <g>
    <rect x="360" y="90" width="52" height="52" rx="6" fill="#f97316"/>
    <text x="386" y="122" font-family="Arial" font-size="24" fill="#0f172a" text-anchor="middle">&#9733;</text>
    <text x="386" y="164" font-family="Arial" font-size="13" fill="#fdba74" text-anchor="middle">تهران (باز)</text>
  </g>

  <!-- Opened warehouse 2 -->
  <g>
    <rect x="600" y="260" width="52" height="52" rx="6" fill="#f97316"/>
    <text x="626" y="292" font-family="Arial" font-size="24" fill="#0f172a" text-anchor="middle">&#9733;</text>
    <text x="626" y="334" font-family="Arial" font-size="13" fill="#fdba74" text-anchor="middle">مشهد (باز)</text>
  </g>

  <!-- Candidate warehouse 3 (not opened) -->
  <g>
    <rect x="600" y="70" width="46" height="46" rx="6" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="623" y="98" font-family="Arial" font-size="20" fill="#64748b" text-anchor="middle">?</text>
  </g>

  <!-- Customers -->
  <g fill="#38bdf8">
    <circle cx="230" cy="230" r="10"/>
    <circle cx="300" cy="330" r="10"/>
    <circle cx="480" cy="200" r="10"/>
    <circle cx="500" cy="380" r="10"/>
    <circle cx="700" cy="380" r="10"/>
  </g>
  <g font-family="Arial" font-size="12" fill="#bae6fd" text-anchor="middle">
    <text x="230" y="252">کرج</text>
    <text x="300" y="352">قم</text>
    <text x="480" y="222">یزد</text>
    <text x="500" y="402">نیشابور</text>
    <text x="700" y="402">بیرجند</text>
  </g>

  <!-- Assignment lines from opened facilities -->
  <g stroke="#f97316" stroke-width="2" opacity="0.75">
    <line x1="386" y1="142" x2="230" y2="230"/>
    <line x1="386" y1="142" x2="300" y2="330"/>
    <line x1="386" y1="142" x2="480" y2="200"/>
    <line x1="626" y1="286" x2="500" y2="380"/>
    <line x1="626" y1="286" x2="700" y2="380"/>
  </g>

  <!-- Legend -->
  <g font-family="Arial" font-size="13" fill="#e2e8f0">
    <rect x="40" y="410" width="18" height="18" fill="#f97316"/>
    <text x="66" y="424">انبار باز شده</text>
    <rect x="180" y="410" width="18" height="18" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="206" y="424">مکان کاندید (بسته)</text>
    <circle cx="400" cy="419" r="8" fill="#38bdf8"/>
    <text x="418" y="424">مشتری</text>
  </g>
</svg>
