<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="80" y1="400" x2="740" y2="400" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="60" stroke="#1e293b" stroke-width="2"/>
  <text x="410" y="440" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">افق برنامه‌ریزی (سال)</text>
  <text x="40" y="230" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle" transform="rotate(-90 40 230)">ظرفیت / تقاضا (مگاوات)</text>

  <!-- Year gridlines and labels -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="150" y1="60" x2="150" y2="400"/>
    <line x1="270" y1="60" x2="270" y2="400"/>
    <line x1="390" y1="60" x2="390" y2="400"/>
    <line x1="510" y1="60" x2="510" y2="400"/>
    <line x1="630" y1="60" x2="630" y2="400"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="150" y="418">سال ۱</text>
    <text x="270" y="418">سال ۳</text>
    <text x="390" y="418">سال ۵</text>
    <text x="510" y="418">سال ۷</text>
    <text x="630" y="418">سال ۹</text>
  </g>

  <!-- Cumulative capacity as stacked step bars (existing + new builds), blue tones -->
  <!-- Year 1 -->
  <rect x="120" y="300" width="60" height="100" fill="#93c5fd"/>
  <!-- Year 3 -->
  <rect x="240" y="270" width="60" height="130" fill="#93c5fd"/>
  <rect x="240" y="240" width="60" height="30" fill="#3b82f6"/>
  <!-- Year 5 -->
  <rect x="360" y="270" width="60" height="130" fill="#93c5fd"/>
  <rect x="360" y="200" width="60" height="70" fill="#3b82f6"/>
  <rect x="360" y="170" width="60" height="30" fill="#1d4ed8"/>
  <!-- Year 7 -->
  <rect x="480" y="270" width="60" height="130" fill="#93c5fd"/>
  <rect x="480" y="200" width="60" height="70" fill="#3b82f6"/>
  <rect x="480" y="140" width="60" height="60" fill="#1d4ed8"/>
  <rect x="480" y="115" width="60" height="25" fill="#16a34a"/>
  <!-- Year 9 -->
  <rect x="600" y="270" width="60" height="130" fill="#93c5fd"/>
  <rect x="600" y="200" width="60" height="70" fill="#3b82f6"/>
  <rect x="600" y="140" width="60" height="60" fill="#1d4ed8"/>
  <rect x="600" y="90" width="60" height="50" fill="#16a34a"/>

  <!-- Demand growth line -->
  <polyline points="150,340 270,300 390,255 510,205 630,150" fill="none" stroke="#dc2626" stroke-width="3"/>
  <g fill="#dc2626">
    <circle cx="150" cy="340" r="4"/>
    <circle cx="270" cy="300" r="4"/>
    <circle cx="390" cy="255" r="4"/>
    <circle cx="510" cy="205" r="4"/>
    <circle cx="630" cy="150" r="4"/>
  </g>

  <!-- Reserve margin dashed line above demand -->
  <polyline points="150,310 270,268 390,220 510,168 630,112" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <rect x="600" y="30" width="14" height="14" fill="#93c5fd"/>
    <text x="620" y="41">ظرفیت موجود</text>

    <rect x="600" y="50" width="14" height="14" fill="#3b82f6"/>
    <text x="620" y="61">نیروگاه جدید نوع ۱</text>

    <rect x="470" y="50" width="14" height="14" fill="#1d4ed8"/>
    <text x="490" y="61">نیروگاه جدید نوع ۲</text>

    <rect x="470" y="30" width="14" height="14" fill="#16a34a"/>
    <text x="490" y="41">تجدیدپذیر جدید</text>

    <line x1="150" y1="20" x2="180" y2="20" stroke="#dc2626" stroke-width="3"/>
    <text x="190" y="24">تقاضا</text>

    <line x1="260" y1="20" x2="290" y2="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="300" y="24">تقاضا + حاشیه اطمینان</text>
  </g>
</svg>
