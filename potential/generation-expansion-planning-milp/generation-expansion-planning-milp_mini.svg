<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="30" y1="160" x2="180" y2="160" stroke="#1e293b" stroke-width="2"/>
  <line x1="30" y1="160" x2="30" y2="30" stroke="#1e293b" stroke-width="2"/>

  <!-- Stepped growing capacity bars -->
  <rect x="45" y="120" width="20" height="40" fill="#93c5fd"/>

  <rect x="80" y="100" width="20" height="60" fill="#93c5fd"/>
  <rect x="80" y="85" width="20" height="15" fill="#3b82f6"/>

  <rect x="115" y="80" width="20" height="80" fill="#93c5fd"/>
  <rect x="115" y="60" width="20" height="20" fill="#3b82f6"/>
  <rect x="115" y="48" width="20" height="12" fill="#1d4ed8"/>

  <rect x="150" y="55" width="20" height="105" fill="#93c5fd"/>
  <rect x="150" y="40" width="20" height="15" fill="#3b82f6"/>
  <rect x="150" y="28" width="20" height="12" fill="#16a34a"/>

  <!-- Demand line -->
  <polyline points="55,140 90,120 125,95 160,65" fill="none" stroke="#dc2626" stroke-width="3"/>
  <g fill="#dc2626">
    <circle cx="55" cy="140" r="3.5"/>
    <circle cx="90" cy="120" r="3.5"/>
    <circle cx="125" cy="95" r="3.5"/>
    <circle cx="160" cy="65" r="3.5"/>
  </g>
</svg>
