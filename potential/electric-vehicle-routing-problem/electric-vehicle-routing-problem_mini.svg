<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="300" height="200" fill="#ffffff"/>

  <!-- simple route -->
  <path d="M 40 150 L 120 60 L 200 90 L 260 140" fill="none" stroke="#16a34a" stroke-width="5"/>

  <!-- depot -->
  <rect x="22" y="132" width="36" height="36" fill="#1e293b" rx="4"/>
  <text x="40" y="155" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D</text>

  <!-- customer -->
  <circle cx="120" cy="60" r="14" fill="#2563eb"/>

  <!-- charging station -->
  <g transform="translate(200,90)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#16a34a"/>
    <path d="M -5,-9 L 5,-3 L -1,-3 L 6,9 L -6,1 L 0,1 Z" fill="#ffffff"/>
  </g>

  <!-- last customer -->
  <circle cx="260" cy="140" r="14" fill="#2563eb"/>

  <!-- small EV icon -->
  <g transform="translate(150,150)">
    <rect x="0" y="6" width="40" height="16" rx="4" fill="#0ea5e9"/>
    <rect x="5" y="0" width="16" height="10" rx="2" fill="#0ea5e9"/>
    <circle cx="10" cy="24" r="4" fill="#1e293b"/>
    <circle cx="32" cy="24" r="4" fill="#1e293b"/>
  </g>
</svg>
