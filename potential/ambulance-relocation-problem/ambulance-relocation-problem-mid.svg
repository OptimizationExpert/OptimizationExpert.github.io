<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- simple city grid roads -->
  <g stroke="#E2E8F0" stroke-width="6">
    <line x1="0" y1="220" x2="1600" y2="220"/>
    <line x1="0" y1="470" x2="1600" y2="470"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="380" y1="0" x2="380" y2="900"/>
    <line x1="820" y1="0" x2="820" y2="900"/>
    <line x1="1220" y1="0" x2="1220" y2="900"/>
  </g>

  <!-- simple buildings -->
  <g fill="#CBD5E1">
    <rect x="90" y="90" width="120" height="90" rx="6"/>
    <rect x="500" y="560" width="140" height="100" rx="6"/>
    <rect x="1330" y="560" width="130" height="90" rx="6"/>
    <rect x="940" y="90" width="130" height="90" rx="6"/>
  </g>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1E293B">جابه‌جایی پویای پایگاه‌های آمبولانس</text>

  <!-- Base A (current base, before) -->
  <g>
    <circle cx="300" cy="330" r="60" fill="#FEE2E2" stroke="#DC2626" stroke-width="4"/>
    <!-- ambulance icon -->
    <g transform="translate(255,300)">
      <rect x="0" y="20" width="90" height="45" rx="8" fill="#ffffff" stroke="#475569" stroke-width="4"/>
      <rect x="60" y="0" width="30" height="45" rx="6" fill="#ffffff" stroke="#475569" stroke-width="4"/>
      <circle cx="20" cy="68" r="10" fill="#334155"/>
      <circle cx="75" cy="68" r="10" fill="#334155"/>
      <rect x="28" y="32" width="24" height="8" fill="#DC2626"/>
      <rect x="36" y="24" width="8" height="24" fill="#DC2626"/>
    </g>
    <text x="300" y="420" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="30" font-weight="bold" fill="#334155">پایگاه فعلی</text>
    <text x="300" y="460" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#DC2626">قبل</text>
  </g>

  <!-- Base B (new base, after) -->
  <g>
    <circle cx="880" cy="600" r="60" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
    <g transform="translate(835,570)">
      <rect x="0" y="20" width="90" height="45" rx="8" fill="#ffffff" stroke="#475569" stroke-width="4"/>
      <rect x="60" y="0" width="30" height="45" rx="6" fill="#ffffff" stroke="#475569" stroke-width="4"/>
      <circle cx="20" cy="68" r="10" fill="#334155"/>
      <circle cx="75" cy="68" r="10" fill="#334155"/>
      <rect x="28" y="32" width="24" height="8" fill="#DC2626"/>
      <rect x="36" y="24" width="8" height="24" fill="#DC2626"/>
    </g>
    <text x="880" y="690" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="30" font-weight="bold" fill="#334155">پایگاه جدید</text>
    <text x="880" y="730" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#2563EB">بعد</text>
  </g>

  <!-- Base C (unaffected base) -->
  <g>
    <circle cx="1330" cy="330" r="55" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
    <g transform="translate(1288,302)">
      <rect x="0" y="18" width="80" height="40" rx="7" fill="#ffffff" stroke="#64748B" stroke-width="3"/>
      <rect x="54" y="0" width="26" height="40" rx="5" fill="#ffffff" stroke="#64748B" stroke-width="3"/>
      <circle cx="18" cy="60" r="9" fill="#475569"/>
      <circle cx="66" cy="60" r="9" fill="#475569"/>
      <rect x="24" y="28" width="20" height="7" fill="#DC2626"/>
      <rect x="31" y="21" width="7" height="20" fill="#DC2626"/>
    </g>
    <text x="1330" y="410" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#64748B">پایگاه دیگر</text>
  </g>

  <!-- dashed relocation arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <path d="M 360 380 Q 620 480 815 570" fill="none" stroke="#2563EB" stroke-width="6" stroke-dasharray="14,12" marker-end="url(#arrowhead)"/>

  <!-- clock icon near arrow midpoint -->
  <g transform="translate(560,430)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="6" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="560" y="500" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="28" font-weight="bold" fill="#2563EB">جابه‌جایی پویا</text>

  <!-- legend -->
  <text x="800" y="850" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#64748B">با هر اعزام آمبولانس، پایگاه‌های خالی برای حفظ پوشش شهر جابه‌جا می‌شوند</text>
</svg>
