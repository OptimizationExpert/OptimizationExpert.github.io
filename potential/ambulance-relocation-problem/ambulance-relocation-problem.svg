<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- City streets grid -->
  <g stroke="#e5e7eb" stroke-width="3">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="360" y1="0" x2="360" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
  </g>

  <!-- Coverage circle station 1 (active, blue) -->
  <circle cx="230" cy="180" r="120" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Coverage circle station 2 (active, blue) -->
  <circle cx="560" cy="330" r="120" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Gap in coverage highlighted (red) around empty station -->
  <circle cx="560" cy="120" r="90" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Station 1: occupied station with ambulance -->
  <g transform="translate(230,180)">
    <rect x="-28" y="-22" width="56" height="44" rx="6" fill="#1e3a8a"/>
    <rect x="-20" y="-6" width="40" height="18" rx="3" fill="#ffffff"/>
    <rect x="-4" y="-14" width="8" height="8" fill="#ffffff"/>
    <text x="0" y="45" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="bold">ایستگاه ۱</text>
  </g>

  <!-- Station 2: occupied -->
  <g transform="translate(560,330)">
    <rect x="-28" y="-22" width="56" height="44" rx="6" fill="#1e3a8a"/>
    <rect x="-20" y="-6" width="40" height="18" rx="3" fill="#ffffff"/>
    <rect x="-4" y="-14" width="8" height="8" fill="#ffffff"/>
    <text x="0" y="45" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="bold">ایستگاه ۲</text>
  </g>

  <!-- Station 3: empty (dispatched), highlighted red as coverage gap -->
  <g transform="translate(560,120)">
    <rect x="-28" y="-22" width="56" height="44" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,3"/>
    <text x="0" y="45" text-anchor="middle" font-size="15" fill="#ef4444" font-weight="bold">ایستگاه ۳ (خالی)</text>
  </g>

  <!-- Emergency call marker in the coverage gap -->
  <g transform="translate(650,60)">
    <circle r="14" fill="#ef4444"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">!</text>
    <text x="0" y="-24" text-anchor="middle" font-size="14" fill="#ef4444" font-weight="bold">تماس اورژانس</text>
  </g>

  <!-- Ambulance moving from station 1 towards empty station 3 (relocation arrow) -->
  <g>
    <path d="M 260 165 Q 420 60 530 115" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow)"/>
    <text x="400" y="70" text-anchor="middle" font-size="15" fill="#16a34a" font-weight="bold">جابه‌جایی پویا</text>
  </g>

  <!-- ambulance icon travelling -->
  <g transform="translate(400,95) rotate(-15)">
    <rect x="-22" y="-14" width="44" height="28" rx="5" fill="#16a34a"/>
    <rect x="-14" y="-4" width="30" height="12" rx="2" fill="#ffffff"/>
    <rect x="-4" y="-9" width="8" height="8" fill="#ffffff"/>
    <circle cx="-12" cy="14" r="5" fill="#111827"/>
    <circle cx="12" cy="14" r="5" fill="#111827"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="400" y="470" text-anchor="middle" font-size="20" fill="#111827" font-weight="bold">مکان‌یابی و جابه‌جایی پویای آمبولانس در شهر</text>
</svg>
