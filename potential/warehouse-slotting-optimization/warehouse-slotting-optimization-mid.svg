<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="130" font-family="Vazirmatn" font-size="34" font-weight="bold" fill="#0f172a" text-anchor="middle">تخصیص کالا به قفسه بر اساس فرکانس برداشت</text>

  <!-- exit door -->
  <g transform="translate(720,190)">
    <rect x="0" y="0" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
    <text x="80" y="33" font-family="Vazirmatn" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">درب خروجی</text>
  </g>

  <!-- shelf row 1 -->
  <g transform="translate(280,300)">
    <rect x="0" y="0" width="1040" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1000" y="48" font-family="Vazirmatn" font-size="22" font-weight="bold" fill="#166534" text-anchor="end">کالاهای پرتقاضا — نزدیک درب</text>
  </g>

  <!-- shelf row 2 -->
  <g transform="translate(280,420)">
    <rect x="0" y="0" width="1040" height="80" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
    <text x="1000" y="48" font-family="Vazirmatn" font-size="22" font-weight="bold" fill="#854d0e" text-anchor="end">کالاهای متوسط</text>
  </g>

  <!-- shelf row 3 -->
  <g transform="translate(280,540)">
    <rect x="0" y="0" width="1040" height="80" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="1000" y="48" font-family="Vazirmatn" font-size="22" font-weight="bold" fill="#991b1b" text-anchor="end">کالاهای کم‌تقاضا — دورترین ردیف</text>
  </g>

  <path d="M800,240 L800,300" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowMid2)"/>

  <text x="800" y="700" font-family="Vazirmatn" font-size="24" fill="#334155" text-anchor="middle">هدف: کمینه‌کردن مجموع فرکانس در فاصله برای همه‌ی کالاها</text>

  <defs>
    <marker id="arrowMid2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
