<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7c2d12" text-anchor="middle">توزیع امداد پس از بلایا</text>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <rect x="30" y="55" width="14" height="14" fill="#16a34a"/>
    <text x="50" y="66">انبار امدادی برپاشده</text>
    <rect x="180" y="55" width="14" height="14" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="200" y="66">انبار کاندید (بسته)</text>
    <circle cx="365" cy="62" r="7" fill="#f97316"/>
    <text x="380" y="66">منطقه آسیب‌دیده (اندازه = تقاضا)</text>
  </g>

  <!-- Closed candidate depot -->
  <g>
    <rect x="480" y="90" width="60" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,3" rx="4"/>
    <text x="510" y="115" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">انبار ۲</text>
    <text x="510" y="145" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">(بسته)</text>
  </g>

  <!-- Open depot -->
  <g>
    <rect x="90" y="130" width="70" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="3" rx="5"/>
    <text x="125" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">انبار</text>
    <text x="125" y="166" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">امدادی</text>
    <path d="M 148 118 l 6 6 l 10 -12" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Zone A: severely damaged, large demand, close -->
  <circle cx="330" cy="150" r="42" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="330" y="146" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">منطقه A</text>
  <text x="330" y="163" font-family="Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle">تقاضا: ۶۰ تن</text>

  <!-- Zone B: medium -->
  <circle cx="440" cy="260" r="33" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="440" y="256" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">منطقه B</text>
  <text x="440" y="272" font-family="Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle">تقاضا: ۴۰ تن</text>

  <!-- Zone C: far, small demand, partial shortage -->
  <circle cx="190" cy="330" r="28" fill="#fed7aa" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="190" y="326" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">منطقه C</text>
  <text x="190" y="341" font-family="Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="middle">تقاضا: ۳۰ تن</text>

  <!-- Routes from open depot to zones -->
  <line x1="160" y1="155" x2="292" y2="152" stroke="#166534" stroke-width="3"/>
  <line x1="150" y1="178" x2="410" y2="255" stroke="#166534" stroke-width="2.5"/>
  <line x1="130" y1="180" x2="195" y2="303" stroke="#166534" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Shortage flag on Zone C -->
  <g>
    <circle cx="220" cy="360" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="220" y="364" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">!</text>
  </g>
  <text x="230" y="400" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start">حداقل ۷۰٪ پوشش تضمین‌شده حتی برای دورترین منطقه</text>

  <!-- Bottom note -->
  <text x="350" y="435" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">مکان‌یابی انبار موقت + توزیع منصفانه کالای امدادی</text>
</svg>
