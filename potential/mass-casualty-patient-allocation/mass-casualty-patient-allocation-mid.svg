<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Incident / triage area -->
  <g>
    <rect x="80" y="380" width="220" height="140" rx="12" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
    <text x="190" y="365" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#1f2937">تریاژ</text>

    <!-- triage tags: red, yellow, green -->
    <circle cx="140" cy="430" r="18" fill="#dc2626"/>
    <circle cx="190" cy="430" r="18" fill="#f59e0b"/>
    <circle cx="240" cy="430" r="18" fill="#16a34a"/>

    <circle cx="140" cy="480" r="18" fill="#f59e0b"/>
    <circle cx="190" cy="480" r="18" fill="#dc2626"/>
    <circle cx="240" cy="480" r="18" fill="#16a34a"/>
  </g>

  <!-- Ambulance -->
  <g>
    <rect x="420" y="410" width="140" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="430" y="420" width="60" height="34" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="450" cy="482" r="12" fill="#1f2937"/>
    <circle cx="530" cy="482" r="12" fill="#1f2937"/>
    <text x="490" y="365" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#1f2937">آمبولانس</text>
    <text x="460" y="443" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="22" fill="#2563eb">+</text>
  </g>

  <!-- Hospital 1 -->
  <g>
    <rect x="900" y="130" width="220" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="990" y="150" width="40" height="40" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <line x1="1010" y1="158" x2="1010" y2="182" stroke="#16a34a" stroke-width="4"/>
    <line x1="998" y1="170" x2="1022" y2="170" stroke="#16a34a" stroke-width="4"/>
    <text x="1010" y="235" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#1f2937">بیمارستان ۱</text>
    <text x="1010" y="270" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" fill="#16a34a">ظرفیت: بالا</text>
  </g>

  <!-- Hospital 2 -->
  <g>
    <rect x="900" y="380" width="220" height="170" rx="10" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
    <rect x="990" y="400" width="40" height="40" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <line x1="1010" y1="408" x2="1010" y2="432" stroke="#f59e0b" stroke-width="4"/>
    <line x1="998" y1="420" x2="1022" y2="420" stroke="#f59e0b" stroke-width="4"/>
    <text x="1010" y="485" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#1f2937">بیمارستان ۲</text>
    <text x="1010" y="520" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" fill="#f59e0b">ظرفیت: متوسط</text>
  </g>

  <!-- Hospital 3 -->
  <g>
    <rect x="900" y="630" width="220" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="990" y="650" width="40" height="40" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <line x1="1010" y1="658" x2="1010" y2="682" stroke="#dc2626" stroke-width="4"/>
    <line x1="998" y1="670" x2="1022" y2="670" stroke="#dc2626" stroke-width="4"/>
    <text x="1010" y="735" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#1f2937">بیمارستان ۳</text>
    <text x="1010" y="770" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" fill="#dc2626">ظرفیت: کم</text>
  </g>

  <!-- Allocation lines from ambulance to hospitals -->
  <line x1="565" y1="440" x2="895" y2="215" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,6"/>
  <line x1="565" y1="450" x2="895" y2="465" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,6"/>
  <line x1="565" y1="460" x2="895" y2="715" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,6"/>

  <!-- Line from triage to ambulance -->
  <line x1="305" y1="450" x2="415" y2="445" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,6"/>

  <!-- Title label -->
  <text x="800" y="70" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="30" fill="#1f2937">تخصیص مصدومان بر اساس تریاژ و ظرفیت بیمارستان</text>
</svg>
