<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- candidate hub (not chosen) -->
  <g opacity="0.35">
    <circle cx="520" cy="100" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="508" y="90" width="24" height="18" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="520" y="135" text-anchor="middle" font-size="12" fill="#64748b">هاب کاندید (رد شده)</text>
  </g>

  <!-- spoke lines to central hub -->
  <line x1="350" y1="210" x2="120" y2="90" stroke="#2563eb" stroke-width="3"/>
  <line x1="350" y1="210" x2="120" y2="320" stroke="#2563eb" stroke-width="3"/>
  <line x1="350" y1="210" x2="330" y2="360" stroke="#2563eb" stroke-width="3"/>
  <line x1="350" y1="210" x2="600" y2="330" stroke="#f97316" stroke-width="4"/>

  <!-- truck icons on spokes -->
  <g transform="translate(220,145)">
    <rect x="-14" y="-8" width="28" height="16" rx="2" fill="#2563eb"/>
    <circle cx="-7" cy="9" r="4" fill="#1e293b"/>
    <circle cx="7" cy="9" r="4" fill="#1e293b"/>
  </g>
  <g transform="translate(220,270)">
    <rect x="-14" y="-8" width="28" height="16" rx="2" fill="#2563eb"/>
    <circle cx="-7" cy="9" r="4" fill="#1e293b"/>
    <circle cx="7" cy="9" r="4" fill="#1e293b"/>
  </g>

  <!-- second hub (chosen) -->
  <circle cx="600" cy="330" r="26" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <rect x="586" y="318" width="28" height="20" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <line x1="600" y1="318" x2="600" y2="308" stroke="#f97316" stroke-width="2.5"/>
  <line x1="586" y1="308" x2="614" y2="308" stroke="#f97316" stroke-width="2.5"/>
  <text x="600" y="365" text-anchor="middle" font-size="13" fill="#7c2d12" font-weight="bold">هاب B</text>

  <!-- central hub (chosen) -->
  <circle cx="350" cy="210" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="3.5"/>
  <rect x="332" y="196" width="36" height="26" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="350" y1="196" x2="350" y2="184" stroke="#2563eb" stroke-width="3"/>
  <line x1="332" y1="184" x2="368" y2="184" stroke="#2563eb" stroke-width="3"/>
  <text x="350" y="255" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="bold">هاب مرکزی A</text>

  <!-- spoke cities -->
  <circle cx="120" cy="90" r="16" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="120" y="65" text-anchor="middle" font-size="12" fill="#334155">شهر ۱</text>

  <circle cx="120" cy="320" r="16" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="120" y="350" text-anchor="middle" font-size="12" fill="#334155">شهر ۲</text>

  <circle cx="330" cy="360" r="16" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="330" y="385" text-anchor="middle" font-size="12" fill="#334155">شهر ۳</text>

  <circle cx="660" cy="270" r="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="660" y="250" text-anchor="middle" font-size="11" fill="#334155">شهر ۴</text>
  <line x1="600" y1="330" x2="660" y2="270" stroke="#f97316" stroke-width="2.5"/>

  <circle cx="640" cy="390" r="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="640" y="372" text-anchor="middle" font-size="11" fill="#334155">شهر ۵</text>
  <line x1="600" y1="330" x2="640" y2="390" stroke="#f97316" stroke-width="2.5"/>

  <!-- hub to hub connection -->
  <line x1="384" y1="220" x2="574" y2="325" stroke="#16a34a" stroke-width="4"/>
  <text x="470" y="255" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">مسیر پرحجم هاب-به-هاب (تخفیف مقیاس)</text>

  <text x="350" y="30" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="bold">مکان‌یابی هاب در شبکه توزیع</text>
</svg>
