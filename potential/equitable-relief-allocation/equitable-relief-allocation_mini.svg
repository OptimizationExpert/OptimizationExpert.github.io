<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- small centered balance scale with two houses, generous white margin -->
  <g transform="translate(800,450)">
    <!-- fulcrum -->
    <polygon points="0,-10 -16,22 16,22" fill="#334155"/>
    <rect x="-150" y="-16" width="300" height="10" rx="5" fill="#475569"/>
    <circle cx="-150" cy="-11" r="5" fill="#1e293b"/>
    <circle cx="150" cy="-11" r="5" fill="#1e293b"/>

    <!-- left aid boxes -->
    <g transform="translate(-162,-55)">
      <rect width="18" height="18" fill="#f59e0b" stroke="#92400e" stroke-width="1.2"/>
    </g>
    <g transform="translate(-140,-55)">
      <rect width="18" height="18" fill="#f59e0b" stroke="#92400e" stroke-width="1.2"/>
    </g>

    <!-- right aid boxes -->
    <g transform="translate(130,-55)">
      <rect width="18" height="18" fill="#f59e0b" stroke="#92400e" stroke-width="1.2"/>
    </g>
    <g transform="translate(152,-55)">
      <rect width="18" height="18" fill="#f59e0b" stroke="#92400e" stroke-width="1.2"/>
    </g>

    <!-- left house -->
    <g transform="translate(-150,40)">
      <polygon points="-22,-8 0,-28 22,-8" fill="#059669"/>
      <rect x="-20" y="-8" width="40" height="30" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    </g>

    <!-- right house -->
    <g transform="translate(150,40)">
      <polygon points="-22,-8 0,-28 22,-8" fill="#2563eb"/>
      <rect x="-20" y="-8" width="40" height="30" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    </g>
  </g>
</svg>
