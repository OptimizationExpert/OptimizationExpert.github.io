<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- Title label -->
  <text x="1170" y="32" font-family="Vazirmatn" font-size="26" font-weight="700" fill="#1e293b" text-anchor="end">تخصیص عادلانه کمک‌های امدادی</text>

  <!-- Central relief warehouse -->
  <g transform="translate(600,78)">
    <rect x="-70" y="0" width="140" height="85" fill="#fef3c7" stroke="#d97706" stroke-width="3" rx="6"/>
    <polygon points="-80,0 0,-42 80,0" fill="#d97706"/>
    <rect x="-18" y="38" width="36" height="47" fill="#92400e"/>
    <text x="0" y="118" font-family="Vazirmatn" font-size="24" font-weight="700" fill="#92400e" text-anchor="middle">انبار امدادی مرکزی</text>
    <text x="0" y="146" font-family="Vazirmatn" font-size="20" fill="#78350f" text-anchor="middle">موجودی: S = ۷۰۰ واحد</text>
  </g>

  <!-- connecting lines from warehouse to zones -->
  <path d="M 540 133 Q 380 220 260 320" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,6"/>
  <path d="M 600 163 L 600 300" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,6"/>
  <path d="M 660 133 Q 820 220 940 320" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8,6"/>

  <!-- Balance beam (fulcrum) -->
  <g transform="translate(600,250)">
    <polygon points="0,0 -22,36 22,36" fill="#334155"/>
    <rect x="-280" y="-6" width="560" height="12" rx="6" fill="#475569"/>
    <circle cx="-280" cy="0" r="7" fill="#1e293b"/>
    <circle cx="0" cy="0" r="7" fill="#1e293b"/>
    <circle cx="280" cy="0" r="7" fill="#1e293b"/>
  </g>

  <!-- Zone A: small village, far -->
  <g transform="translate(260,400)">
    <text x="0" y="-95" font-family="Vazirmatn" font-size="18" fill="#92400e" text-anchor="middle">نسبت تأمین: ۷۰٪</text>
    <g transform="translate(-24,-78)"><rect width="22" height="22" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/></g>
    <g transform="translate(2,-78)"><rect width="22" height="22" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/></g>
    <polygon points="-30,-10 -45,10 -15,10" fill="#059669"/>
    <rect x="-40" y="10" width="50" height="35" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    <polygon points="20,0 5,16 35,16" fill="#059669"/>
    <rect x="8" y="16" width="26" height="28" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    <text x="0" y="85" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#065f46" text-anchor="middle">روستای الف</text>
    <text x="0" y="112" font-family="Vazirmatn" font-size="18" fill="#047857" text-anchor="middle">نیاز: ۳۰۰ واحد</text>
  </g>

  <!-- Zone B: mid town -->
  <g transform="translate(600,420)">
    <text x="0" y="-85" font-family="Vazirmatn" font-size="18" fill="#92400e" text-anchor="middle">نسبت تأمین: ۷۰٪</text>
    <g transform="translate(-40,-68)"><rect width="22" height="22" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/></g>
    <g transform="translate(-14,-68)"><rect width="22" height="22" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/></g>
    <g transform="translate(12,-68)"><rect width="22" height="22" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/></g>
    <rect x="-35" y="0" width="70" height="55" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <polygon points="-40,0 0,-28 40,0" fill="#2563eb"/>
    <rect x="-10" y="20" width="20" height="35" fill="#1d4ed8"/>
    <text x="0" y="95" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">شهر ب</text>
    <text x="0" y="122" font-family="Vazirmatn" font-size="18" fill="#1d4ed8" text-anchor="middle">نیاز: ۴۵۰ واحد</text>
  </g>

  <!-- Zone C: another town -->
  <g transform="translate(940,400)">
    <text x="0" y="-95" font-family="Vazirmatn" font-size="18" fill="#92400e" text-anchor="middle">نسبت تأمین: ۷۰٪</text>
    <g transform="translate(-24,-78)"><rect width="22" height="22" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/></g>
    <g transform="translate(2,-78)"><rect width="22" height="22" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/></g>
    <rect x="-32" y="0" width="64" height="50" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <polygon points="-37,0 0,-26 37,0" fill="#dc2626"/>
    <rect x="-9" y="18" width="18" height="32" fill="#991b1b"/>
    <text x="0" y="90" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#7f1d1d" text-anchor="middle">منطقه ج</text>
    <text x="0" y="117" font-family="Vazirmatn" font-size="18" fill="#b91c1c" text-anchor="middle">نیاز: ۲۵۰ واحد</text>
  </g>

  <!-- equal ratio callout -->
  <g transform="translate(600,590)">
    <rect x="-280" y="-35" width="560" height="70" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="0" y="8" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#3730a3" text-anchor="middle">هر سه منطقه، صرف‌نظر از فاصله، نسبت تأمین برابر می‌گیرند</text>
  </g>

  <text x="1150" y="730" font-family="Vazirmatn" font-size="18" fill="#64748b" text-anchor="end">مدل بیشینه-کمینه عدالت در تخصیص کمک امدادی</text>
</svg>
