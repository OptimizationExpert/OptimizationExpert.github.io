<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- divider -->
  <line x1="800" y1="100" x2="800" y2="800" stroke="#e2e8f0" stroke-width="3"/>

  <!-- LEFT PANEL: cost minimization -->
  <g>
    <text x="400" y="110" font-family="Vazirmatn" font-size="34" font-weight="700" fill="#b91c1c" text-anchor="middle">کمینه‌سازی هزینه</text>

    <!-- warehouse -->
    <g transform="translate(400,180)">
      <polygon points="-45,0 0,-28 45,0" fill="#d97706"/>
      <rect x="-40" y="0" width="80" height="55" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    </g>

    <!-- near city: gets almost everything -->
    <g transform="translate(230,430)">
      <rect x="-28" y="0" width="56" height="44" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <polygon points="-32,0 0,-24 32,0" fill="#2563eb"/>
      <text x="0" y="75" font-family="Vazirmatn" font-size="22" fill="#1e3a8a" text-anchor="middle">شهر نزدیک</text>
      <g transform="translate(-55,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <g transform="translate(-30,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <g transform="translate(-5,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <g transform="translate(20,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <text x="0" y="105" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">تأمین: ۹۵٪</text>
    </g>

    <!-- far village: almost nothing -->
    <g transform="translate(600,430)">
      <polygon points="-24,-8 0,-26 24,-8" fill="#059669"/>
      <rect x="-22" y="-8" width="44" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
      <text x="0" y="75" font-family="Vazirmatn" font-size="22" fill="#065f46" text-anchor="middle">روستای دور</text>
      <g transform="translate(-10,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <text x="0" y="105" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle">تأمین: ۱۵٪</text>
    </g>

    <path d="M 370 220 L 240 390" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,5"/>
    <path d="M 420 225 L 595 390" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,5"/>

    <rect x="140" y="640" width="520" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="400" y="680" font-family="Vazirmatn" font-size="22" fill="#7f1d1d" text-anchor="middle">نزدیک‌ترین منطقه بیشترین کمک را می‌گیرد</text>
    <text x="400" y="712" font-family="Vazirmatn" font-size="22" fill="#7f1d1d" text-anchor="middle">منطقه دور تقریباً بی‌نصیب می‌ماند</text>
  </g>

  <!-- RIGHT PANEL: fairness maximization -->
  <g>
    <text x="1200" y="110" font-family="Vazirmatn" font-size="34" font-weight="700" fill="#1d4ed8" text-anchor="middle">بیشینه‌سازی انصاف</text>

    <!-- warehouse -->
    <g transform="translate(1200,180)">
      <polygon points="-45,0 0,-28 45,0" fill="#d97706"/>
      <rect x="-40" y="0" width="80" height="55" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    </g>

    <!-- near city: fair share -->
    <g transform="translate(1030,430)">
      <rect x="-28" y="0" width="56" height="44" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <polygon points="-32,0 0,-24 32,0" fill="#2563eb"/>
      <text x="0" y="75" font-family="Vazirmatn" font-size="22" fill="#1e3a8a" text-anchor="middle">شهر نزدیک</text>
      <g transform="translate(-22,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <g transform="translate(3,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <text x="0" y="105" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">تأمین: ۷۰٪</text>
    </g>

    <!-- far village: same fair share -->
    <g transform="translate(1370,430)">
      <polygon points="-24,-8 0,-26 24,-8" fill="#059669"/>
      <rect x="-22" y="-8" width="44" height="32" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
      <text x="0" y="75" font-family="Vazirmatn" font-size="22" fill="#065f46" text-anchor="middle">روستای دور</text>
      <g transform="translate(-22,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <g transform="translate(3,-55)"><rect width="20" height="20" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/></g>
      <text x="0" y="105" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">تأمین: ۷۰٪</text>
    </g>

    <path d="M 1170 220 L 1040 390" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,5"/>
    <path d="M 1230 220 L 1365 390" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,5"/>

    <rect x="940" y="640" width="520" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="1200" y="680" font-family="Vazirmatn" font-size="22" fill="#1e3a8a" text-anchor="middle">هر دو منطقه نسبت تأمین برابر می‌گیرند</text>
    <text x="1200" y="712" font-family="Vazirmatn" font-size="22" fill="#1e3a8a" text-anchor="middle">صرف‌نظر از فاصله تا انبار</text>
  </g>
</svg>
