<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">انتخاب تأمین‌کننده تحت ریسک اختلال</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#6b7280">تقسیم سفارش بین چند تأمین‌کننده به‌جای تمرکز روی یکی</text>

  <!-- Factory (center-right) -->
  <g transform="translate(560,200)">
    <rect x="0" y="0" width="130" height="90" fill="#e5e7eb" stroke="#374151" stroke-width="2" rx="6"/>
    <polygon points="10,0 30,-25 30,0" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <polygon points="45,0 65,-30 65,0" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <polygon points="80,0 100,-22 100,0" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
    <text x="65" y="55" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold">کارخانه</text>
    <text x="65" y="75" text-anchor="middle" font-size="11" fill="#4b5563">تقاضا: ۱۰۰۰ واحد</text>
  </g>

  <!-- Supplier 1: disrupted -->
  <g transform="translate(70,60)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold">تأمین‌کننده ۱</text>
    <text x="65" y="50" text-anchor="middle" font-size="11" fill="#991b1b">ارزان‌ترین ولی متمرکز</text>
  </g>
  <!-- broken line to factory -->
  <line x1="200" y1="95" x2="420" y2="180" stroke="#dc2626" stroke-width="3" stroke-dasharray="10,8"/>
  <g transform="translate(300,128)">
    <circle r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#b91c1c" stroke-width="3"/>
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#b91c1c" stroke-width="3"/>
  </g>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#b91c1c">اختلال ناگهانی</text>

  <!-- Supplier 2: active backup -->
  <g transform="translate(70,175)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" font-size="13" fill="#14532d" font-weight="bold">تأمین‌کننده ۲</text>
    <text x="65" y="50" text-anchor="middle" font-size="11" fill="#166534">سهم پشتیبان فعال</text>
  </g>
  <line x1="200" y1="210" x2="560" y2="235" stroke="#16a34a" stroke-width="3"/>

  <!-- Supplier 3: active backup -->
  <g transform="translate(70,290)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" font-size="13" fill="#14532d" font-weight="bold">تأمین‌کننده ۳</text>
    <text x="65" y="50" text-anchor="middle" font-size="11" fill="#166534">سهم پشتیبان فعال</text>
  </g>
  <line x1="200" y1="325" x2="560" y2="270" stroke="#16a34a" stroke-width="3"/>

  <!-- Legend -->
  <rect x="90" y="410" width="18" height="6" fill="#dc2626"/>
  <text x="115" y="418" font-size="12" fill="#374151">مسیر متمرکز و پرریسک (قطع‌شده)</text>
  <rect x="420" y="410" width="18" height="6" fill="#16a34a"/>
  <text x="445" y="418" font-size="12" fill="#374151">تخصیص متنوع و تاب‌آور</text>
</svg>
