<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" rx="16" fill="#0f172a"/>

  <!-- Simple power plant silhouette -->
  <rect x="55" y="110" width="90" height="55" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="70" y="80" width="16" height="35" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="114" y="80" width="16" height="35" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="92" y="60" width="16" height="55" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- On/off toggle switches on 3 units -->
  <circle cx="78" cy="72" r="7" fill="#22c55e"/>
  <circle cx="100" cy="52" r="7" fill="#22c55e"/>
  <circle cx="122" cy="72" r="7" fill="#334155" stroke="#64748b" stroke-width="1.5"/>

  <!-- Base -->
  <rect x="45" y="165" width="110" height="10" rx="3" fill="#334155"/>

  <!-- Small bar chart hint at bottom representing schedule -->
  <rect x="55" y="182" width="18" height="8" fill="#22c55e"/>
  <rect x="78" y="182" width="18" height="8" fill="#22c55e"/>
  <rect x="101" y="182" width="18" height="8" fill="#334155"/>
  <rect x="124" y="182" width="18" height="8" fill="#f59e0b"/>
</svg>
