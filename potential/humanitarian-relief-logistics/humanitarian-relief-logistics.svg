<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Title labels -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7c2d12" text-anchor="middle">شبکه امداد پس از بلایا</text>

  <!-- Candidate warehouse locations (unopened) -->
  <circle cx="150" cy="150" r="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="150" y="130" font-family="Arial" font-size="11" fill="#64748b" text-anchor="middle">کاندید</text>

  <circle cx="650" cy="120" r="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="650" y="100" font-family="Arial" font-size="11" fill="#64748b" text-anchor="middle">کاندید</text>

  <!-- Opened emergency warehouse (main hub) -->
  <rect x="365" y="215" width="70" height="50" rx="6" fill="#ea580c"/>
  <text x="400" y="245" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">انبار</text>
  <text x="400" y="258" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">اضطراری</text>
  <text x="400" y="200" font-family="Arial" font-size="12" fill="#7c2d12" text-anchor="middle">انبار فعال‌شده (y=1)</text>

  <!-- Damaged zones -->
  <g>
    <circle cx="130" cy="380" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M130,368 L136,382 L124,382 Z" fill="#dc2626"/>
    <text x="130" y="420" font-family="Arial" font-size="11" fill="#7f1d1d" text-anchor="middle">منطقه ۱</text>
    <text x="130" y="434" font-family="Arial" font-size="10" fill="#7f1d1d" text-anchor="middle">d1 = 400</text>
  </g>

  <g>
    <circle cx="280" cy="430" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M280,418 L286,432 L274,432 Z" fill="#dc2626"/>
    <text x="280" y="470" font-family="Arial" font-size="11" fill="#7f1d1d" text-anchor="middle">منطقه ۲</text>
    <text x="280" y="484" font-family="Arial" font-size="10" fill="#7f1d1d" text-anchor="middle">d2 = 250</text>
  </g>

  <g>
    <circle cx="520" cy="420" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M520,408 L526,422 L514,422 Z" fill="#dc2626"/>
    <text x="520" y="460" font-family="Arial" font-size="11" fill="#7f1d1d" text-anchor="middle">منطقه ۳</text>
    <text x="520" y="474" font-family="Arial" font-size="10" fill="#7f1d1d" text-anchor="middle">d3 = 300</text>
  </g>

  <g>
    <circle cx="660" cy="360" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M660,348 L666,362 L654,362 Z" fill="#dc2626"/>
    <text x="660" y="400" font-family="Arial" font-size="11" fill="#7f1d1d" text-anchor="middle">منطقه ۴</text>
    <text x="660" y="414" font-family="Arial" font-size="10" fill="#7f1d1d" text-anchor="middle">d4 = 180</text>
  </g>

  <!-- Routes from warehouse to zones -->
  <path d="M368,255 L156,376" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <path d="M380,265 L282,404" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <path d="M425,265 L515,394" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <path d="M435,250 L640,346" fill="none" stroke="#ea580c" stroke-width="2.5"/>

  <!-- x_ij labels on routes -->
  <text x="250" y="305" font-family="Arial" font-size="10" fill="#9a3412">x11</text>
  <text x="330" y="345" font-family="Arial" font-size="10" fill="#9a3412">x12</text>
  <text x="470" y="335" font-family="Arial" font-size="10" fill="#9a3412">x13</text>
  <text x="540" y="290" font-family="Arial" font-size="10" fill="#9a3412">x14</text>

  <!-- Legend -->
  <rect x="30" y="30" width="14" height="14" fill="#ea580c"/>
  <text x="50" y="41" font-family="Arial" font-size="11" fill="#1e293b">انبار فعال</text>

  <circle cx="37" cy="65" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="50" y="69" font-family="Arial" font-size="11" fill="#1e293b">منطقه آسیب‌دیده</text>

  <!-- Legend candidate -->
  <circle cx="37" cy="95" r="7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="50" y="99" font-family="Arial" font-size="11" fill="#1e293b">مکان کاندید (فعال‌نشده)</text>
</svg>
