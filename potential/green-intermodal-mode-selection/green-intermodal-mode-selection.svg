<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="780" fill="#ffffff"/>

  <text x="1170" y="40" font-family="Vazirmatn" font-size="26" font-weight="700" fill="#1e293b" text-anchor="end">انتخاب حالت حمل‌ونقل سبز</text>

  <!-- Origin warehouse (right side, since RTL flow goes right-to-left visually but we keep LTR geography for clarity: origin right, destination left) -->
  <g transform="translate(1040,400)">
    <polygon points="-70,-10 0,-55 70,-10" fill="#d97706"/>
    <rect x="-70" y="-10" width="140" height="95" fill="#fef3c7" stroke="#d97706" stroke-width="3" rx="4"/>
    <rect x="-18" y="35" width="36" height="50" fill="#92400e"/>
    <text x="0" y="118" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#92400e" text-anchor="middle">انبار مبدأ</text>
  </g>

  <!-- Destination warehouse (left side) -->
  <g transform="translate(160,400)">
    <polygon points="-70,-10 0,-55 70,-10" fill="#2563eb"/>
    <rect x="-70" y="-10" width="140" height="95" fill="#dbeafe" stroke="#2563eb" stroke-width="3" rx="4"/>
    <rect x="-18" y="35" width="36" height="50" fill="#1d4ed8"/>
    <text x="0" y="118" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">انبار مقصد</text>
  </g>

  <!-- Lane 1: Road (top) -->
  <g>
    <path d="M 965 230 L 235 230" fill="none" stroke="#d97706" stroke-width="5" stroke-dasharray="14,8"/>
    <!-- truck icon -->
    <g transform="translate(600,230)">
      <rect x="-15" y="-34" width="80" height="34" fill="#f59e0b" stroke="#92400e" stroke-width="2" rx="3"/>
      <rect x="65" y="-24" width="30" height="24" fill="#fbbf24" stroke="#92400e" stroke-width="2" rx="2"/>
      <circle cx="-2" cy="2" r="9" fill="#334155"/>
      <circle cx="55" cy="2" r="9" fill="#334155"/>
      <circle cx="85" cy="2" r="9" fill="#334155"/>
    </g>
    <text x="600" y="190" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#92400e" text-anchor="middle">جاده</text>
    <text x="600" y="282" font-family="Vazirmatn" font-size="19" fill="#92400e" text-anchor="middle">هزینه زیاد، کربن زیاد، زمان کم</text>
  </g>

  <!-- Lane 2: Rail (middle) -->
  <g>
    <path d="M 965 400 L 235 400" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="14,8"/>
    <!-- train icon -->
    <g transform="translate(600,400)">
      <rect x="-70" y="-26" width="50" height="26" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2" rx="2"/>
      <rect x="-15" y="-26" width="50" height="26" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2" rx="2"/>
      <rect x="40" y="-30" width="35" height="30" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2" rx="2"/>
      <circle cx="-55" cy="4" r="8" fill="#1e293b"/>
      <circle cx="-30" cy="4" r="8" fill="#1e293b"/>
      <circle cx="0" cy="4" r="8" fill="#1e293b"/>
      <circle cx="25" cy="4" r="8" fill="#1e293b"/>
      <circle cx="55" cy="4" r="8" fill="#1e293b"/>
    </g>
    <text x="600" y="358" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">ریل</text>
    <text x="600" y="452" font-family="Vazirmatn" font-size="19" fill="#1e3a8a" text-anchor="middle">هزینه متوسط، کربن کم، زمان متوسط</text>
  </g>

  <!-- Lane 3: Sea (bottom) -->
  <g>
    <path d="M 965 570 L 235 570" fill="none" stroke="#059669" stroke-width="5" stroke-dasharray="14,8"/>
    <!-- ship icon -->
    <g transform="translate(600,570)">
      <polygon points="-60,0 60,0 45,26 -45,26" fill="#34d399" stroke="#065f46" stroke-width="2"/>
      <rect x="-35" y="-22" width="20" height="22" fill="#a7f3d0" stroke="#065f46" stroke-width="1.5"/>
      <rect x="-8" y="-22" width="20" height="22" fill="#a7f3d0" stroke="#065f46" stroke-width="1.5"/>
      <rect x="19" y="-22" width="20" height="22" fill="#a7f3d0" stroke="#065f46" stroke-width="1.5"/>
      <rect x="-6" y="-34" width="16" height="12" fill="#065f46"/>
    </g>
    <text x="600" y="518" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#065f46" text-anchor="middle">دریا</text>
    <text x="600" y="624" font-family="Vazirmatn" font-size="19" fill="#065f46" text-anchor="middle">هزینه کم، کربن خیلی کم، زمان زیاد</text>
  </g>

  <!-- callout -->
  <g transform="translate(600,710)">
    <rect x="-320" y="-30" width="640" height="60" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="0" y="8" font-family="Vazirmatn" font-size="21" font-weight="700" fill="#3730a3" text-anchor="middle">انتخاب بهینه، کمینه‌سازی هم‌زمان هزینه و انتشار کربن</text>
  </g>
</svg>
