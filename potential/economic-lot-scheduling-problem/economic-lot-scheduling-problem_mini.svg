  <text x="120" y="160" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">T</text>

  <text x="100" y="45" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">ELSP</text>
