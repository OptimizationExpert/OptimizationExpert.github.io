<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Title labels -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#14532d">شبکه زنجیره تأمین حلقه‌بسته سبز</text>

  <!-- Factory -->
  <g>
    <rect x="40" y="220" width="110" height="70" rx="8" fill="#166534"/>
    <text x="95" y="260" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">کارخانه</text>
  </g>

  <!-- Facility nodes (candidate: Karaj open, Isfahan closed) -->
  <g>
    <circle cx="300" cy="150" r="34" fill="#16a34a"/>
    <text x="300" y="155" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">کرج</text>
  </g>
  <g>
    <circle cx="300" cy="370" r="34" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="300" y="375" text-anchor="middle" font-size="13" fill="#94a3b8">اصفهان</text>
  </g>

  <!-- Customers -->
  <g>
    <rect x="560" y="70" width="100" height="60" rx="8" fill="#2563eb"/>
    <text x="610" y="105" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">تهران</text>
  </g>
  <g>
    <rect x="560" y="240" width="100" height="60" rx="8" fill="#2563eb"/>
    <text x="610" y="275" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">قم</text>
  </g>
  <g>
    <rect x="560" y="410" width="100" height="60" rx="8" fill="#2563eb"/>
    <text x="610" y="445" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">یزد</text>
  </g>

  <!-- Recycling center -->
  <g>
    <rect x="770" y="220" width="100" height="70" rx="8" fill="#ea580c"/>
    <text x="820" y="250" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">مرکز</text>
    <text x="820" y="270" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">بازیافت</text>
  </g>

  <!-- Forward flow arrows: factory -> Karaj -->
  <defs>
    <marker id="arrowFwd" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRev" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <line x1="150" y1="245" x2="270" y2="175" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowFwd)"/>

  <!-- Forward: Karaj -> customers -->
  <line x1="330" y1="140" x2="555" y2="100" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowFwd)"/>
  <line x1="330" y1="155" x2="555" y2="260" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowFwd)"/>
  <line x1="320" y1="182" x2="555" y2="420" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowFwd)"/>

  <!-- Reverse: customers -> Karaj -->
  <line x1="590" y1="128" x2="325" y2="130" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRev)"/>
  <line x1="590" y1="300" x2="325" y2="175" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRev)"/>
  <line x1="590" y1="440" x2="320" y2="200" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRev)"/>

  <!-- Reverse: Karaj -> recycling -->
  <line x1="334" y1="160" x2="765" y2="240" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRev)"/>

  <!-- Legend -->
  <g>
    <line x1="60" y1="480" x2="110" y2="480" stroke="#16a34a" stroke-width="3"/>
    <text x="120" y="485" font-size="13" fill="#166534">جریان رفت (تحویل کالا)</text>
    <line x1="60" y1="505" x2="110" y2="505" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="120" y="510" font-size="13" fill="#9a3412">جریان برگشت (جمع‌آوری/بازیافت)</text>
  </g>
</svg>
