<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- Existing lines -->
  <line x1="70" y1="80" x2="220" y2="70" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="70" y1="80" x2="80" y2="220" stroke="#1d4ed8" stroke-width="5"/>
  <line x1="220" y1="70" x2="230" y2="220" stroke="#1d4ed8" stroke-width="5"/>

  <!-- Candidate new line (dashed orange) -->
  <line x1="80" y1="220" x2="230" y2="220" stroke="#f97316" stroke-width="6" stroke-dasharray="14,10"/>

  <!-- Buses -->
  <circle cx="70" cy="80" r="18" fill="#1e3a8a"/>
  <circle cx="220" cy="70" r="18" fill="#1e3a8a"/>
  <circle cx="80" cy="220" r="18" fill="#1e3a8a"/>
  <circle cx="230" cy="220" r="18" fill="#1e3a8a"/>
</svg>
