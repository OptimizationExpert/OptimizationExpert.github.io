<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>

  <!-- Transmission lines -->
  <line x1="120" y1="90" x2="300" y2="80" stroke="#2563eb" stroke-width="3"/>
  <line x1="300" y1="80" x2="480" y2="100" stroke="#2563eb" stroke-width="3"/>
  <line x1="120" y1="90" x2="150" y2="260" stroke="#2563eb" stroke-width="3"/>
  <line x1="300" y1="80" x2="300" y2="230" stroke="#dc2626" stroke-width="5"/>
  <line x1="480" y1="100" x2="450" y2="260" stroke="#2563eb" stroke-width="3"/>
  <line x1="150" y1="260" x2="300" y2="230" stroke="#2563eb" stroke-width="3"/>
  <line x1="300" y1="230" x2="450" y2="260" stroke="#2563eb" stroke-width="3"/>

  <!-- power flow arrows -->
  <polygon points="210,84 218,79 218,89" fill="#2563eb"/>
  <polygon points="390,90 398,95 388,99" fill="#2563eb"/>
  <polygon points="130,175 138,180 128,184" fill="#2563eb"/>
  <polygon points="465,180 473,175 473,185" fill="#2563eb"/>
  <polygon points="220,248 228,244 224,253" fill="#2563eb"/>
  <polygon points="380,243 388,247 380,252" fill="#2563eb"/>

  <!-- congested line label -->
  <rect x="308" y="145" width="86" height="24" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="351" y="161" font-size="11" fill="#dc2626" text-anchor="middle" font-family="Tahoma, sans-serif">خط پرباری‌شده</text>

  <!-- Bus nodes -->
  <circle cx="120" cy="90" r="26" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="120" y="95" font-size="13" fill="#1d4ed8" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">G1</text>

  <circle cx="300" cy="80" r="26" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="300" y="85" font-size="13" fill="#1d4ed8" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">G2</text>

  <circle cx="480" cy="100" r="26" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="480" y="105" font-size="13" fill="#1d4ed8" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">G3</text>

  <circle cx="150" cy="260" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="150" y="265" font-size="12" fill="#15803d" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">D1</text>

  <circle cx="300" cy="230" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="300" y="235" font-size="12" fill="#15803d" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">D2</text>

  <circle cx="450" cy="260" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="450" y="265" font-size="12" fill="#15803d" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">D3</text>

  <!-- Legend -->
  <circle cx="60" cy="345" r="9" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="349" font-size="13" fill="#1e293b" font-family="Tahoma, sans-serif">گره ژنراتور (نیروگاه)</text>

  <circle cx="60" cy="375" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="379" font-size="13" fill="#1e293b" font-family="Tahoma, sans-serif">گره بار (مصرف‌کننده)</text>

  <line x1="330" y1="345" x2="365" y2="345" stroke="#dc2626" stroke-width="4"/>
  <text x="375" y="349" font-size="13" fill="#1e293b" font-family="Tahoma, sans-serif">خط در حد ظرفیت حرارتی</text>

  <text x="300" y="30" font-size="17" fill="#0f172a" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">DC-OPF: تخصیص بهینه توان روی شبکه</text>
</svg>
