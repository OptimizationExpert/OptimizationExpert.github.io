<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- Warehouse A -->
  <rect x="25" y="150" width="80" height="70" rx="8" fill="#f97316"/>
  <circle cx="55" cy="190" r="12" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="55" cy="190" r="4" fill="#ffffff"/>

  <!-- Warehouse B -->
  <rect x="195" y="150" width="80" height="70" rx="8" fill="#16a34a"/>
  <circle cx="245" cy="190" r="12" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="245" cy="190" r="4" fill="#ffffff"/>

  <!-- Central supplier -->
  <rect x="115" y="30" width="70" height="55" rx="8" fill="#1d4ed8"/>

  <!-- lateral arrow -->
  <path d="M105 165 C 150 120, 170 120, 195 165" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow2)"/>

  <!-- truck -->
  <g transform="translate(130,140)">
    <rect x="0" y="0" width="26" height="15" rx="2" fill="#5b21b6"/>
    <rect x="26" y="4" width="10" height="11" rx="1" fill="#5b21b6"/>
    <circle cx="7" cy="17" r="3.5" fill="#111827"/>
    <circle cx="29" cy="17" r="3.5" fill="#111827"/>
  </g>

  <!-- dashed to supplier -->
  <line x1="65" y1="150" x2="130" y2="85" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
