<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Central supplier -->
  <g>
    <rect x="380" y="40" width="140" height="90" rx="10" fill="#1d4ed8"/>
    <text x="450" y="75" text-anchor="middle" font-size="16" fill="#ffffff" font-family="Vazirmatn, Tahoma, Arial, sans-serif">تأمین‌کننده</text>
    <text x="450" y="98" text-anchor="middle" font-size="16" fill="#ffffff" font-family="Vazirmatn, Tahoma, Arial, sans-serif">مرکزی</text>
    <!-- factory icon -->
    <path d="M395 40 l0 -18 l14 12 l0 -12 l14 12 l0 -12 l14 18 z" fill="#93c5fd"/>
  </g>

  <!-- Warehouse A -->
  <g>
    <rect x="90" y="280" width="170" height="120" rx="10" fill="#f97316"/>
    <text x="175" y="320" text-anchor="middle" font-size="17" fill="#ffffff" font-family="Vazirmatn, Tahoma, Arial, sans-serif">انبار الف (تهران)</text>
    <!-- gear icon -->
    <circle cx="140" cy="365" r="22" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="140" cy="365" r="8" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="5">
      <line x1="140" y1="337" x2="140" y2="347"/>
      <line x1="140" y1="383" x2="140" y2="393"/>
      <line x1="112" y1="365" x2="122" y2="365"/>
      <line x1="158" y1="365" x2="168" y2="365"/>
    </g>
    <!-- box icon -->
    <rect x="185" y="345" width="50" height="40" fill="#ffffff"/>
    <line x1="185" y1="365" x2="235" y2="365" stroke="#f97316" stroke-width="3"/>
    <line x1="210" y1="345" x2="210" y2="385" stroke="#f97316" stroke-width="3"/>
    <text x="175" y="385" text-anchor="middle" font-size="13" fill="#ffffe0" font-family="Vazirmatn, Tahoma, Arial, sans-serif"></text>
    <text x="175" y="415" text-anchor="middle" font-size="14" fill="#7c2d12" font-family="Vazirmatn, Tahoma, Arial, sans-serif">موجودی: ۰ عدد قطعه</text>
  </g>

  <!-- Warehouse B -->
  <g>
    <rect x="640" y="280" width="170" height="120" rx="10" fill="#16a34a"/>
    <text x="725" y="320" text-anchor="middle" font-size="17" fill="#ffffff" font-family="Vazirmatn, Tahoma, Arial, sans-serif">انبار ب (اصفهان)</text>
    <circle cx="690" cy="365" r="22" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="690" cy="365" r="8" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="5">
      <line x1="690" y1="337" x2="690" y2="347"/>
      <line x1="690" y1="383" x2="690" y2="393"/>
      <line x1="662" y1="365" x2="672" y2="365"/>
      <line x1="708" y1="365" x2="718" y2="365"/>
    </g>
    <rect x="735" y="345" width="50" height="40" fill="#ffffff"/>
    <line x1="735" y1="365" x2="785" y2="365" stroke="#16a34a" stroke-width="3"/>
    <line x1="760" y1="345" x2="760" y2="385" stroke="#16a34a" stroke-width="3"/>
    <text x="725" y="415" text-anchor="middle" font-size="14" fill="#14532d" font-family="Vazirmatn, Tahoma, Arial, sans-serif">موجودی: ۳ عدد قطعه</text>
  </g>

  <!-- Lateral transshipment arrow between A and B -->
  <path d="M270 340 C 400 260, 500 260, 630 340" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="450" y="255" text-anchor="middle" font-size="16" fill="#5b21b6" font-family="Vazirmatn, Tahoma, Arial, sans-serif">انتقال جانبی: ۳ عدد قطعه</text>

  <!-- truck icon on the lateral path -->
  <g transform="translate(430,300)">
    <rect x="0" y="0" width="46" height="26" rx="3" fill="#5b21b6"/>
    <rect x="46" y="8" width="18" height="18" rx="2" fill="#5b21b6"/>
    <circle cx="12" cy="30" r="6" fill="#111827"/>
    <circle cx="50" cy="30" r="6" fill="#111827"/>
  </g>

  <!-- dashed lines to central supplier (expensive emergency order, unused) -->
  <line x1="175" y1="280" x2="400" y2="130" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowgray)"/>
  <text x="255" y="195" text-anchor="middle" font-size="13" fill="#64748b" font-family="Vazirmatn, Tahoma, Arial, sans-serif">سفارش اضطراری (پرهزینه)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="450" y="500" text-anchor="middle" font-size="18" fill="#111827" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-weight="bold">انتقال جانبی موجودی بین انبارهای قطعات یدکی</text>
</svg>
