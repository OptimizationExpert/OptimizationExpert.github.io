<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="34" font-family="Vazirmatn" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">زمان‌بندی جرثقیل اسکله</text>

  <!-- water -->
  <rect x="0" y="330" width="800" height="120" fill="#e0f2fe"/>

  <!-- ship hull divided into bays -->
  <g transform="translate(100,250)">
    <path d="M0,40 L600,40 L580,90 L20,90 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <!-- bay divisions -->
    <line x1="120" y1="40" x2="112" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="40" x2="234" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="360" y1="40" x2="356" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="480" y1="40" x2="478" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- containers -->
    <rect x="35" y="10" width="70" height="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
    <rect x="140" y="10" width="70" height="26" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="260" y="10" width="70" height="26" fill="#fde68a" stroke="#ca8a04" stroke-width="1.5"/>
    <rect x="380" y="10" width="70" height="26" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="495" y="10" width="70" height="26" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="60" y="115" font-family="Vazirmatn" font-size="12" fill="#334155" text-anchor="middle">بخش ۱</text>
    <text x="180" y="115" font-family="Vazirmatn" font-size="12" fill="#334155" text-anchor="middle">بخش ۲</text>
    <text x="300" y="115" font-family="Vazirmatn" font-size="12" fill="#334155" text-anchor="middle">بخش ۳</text>
    <text x="420" y="115" font-family="Vazirmatn" font-size="12" fill="#334155" text-anchor="middle">بخش ۴</text>
    <text x="530" y="115" font-family="Vazirmatn" font-size="12" fill="#334155" text-anchor="middle">بخش ۵</text>
  </g>

  <!-- rail -->
  <rect x="60" y="230" width="680" height="6" fill="#475569"/>

  <!-- crane 1 -->
  <g transform="translate(140,110)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#1d4ed8" stroke-width="5"/>
    <line x1="-55" y1="10" x2="55" y2="10" stroke="#1d4ed8" stroke-width="5"/>
    <line x1="-40" y1="10" x2="-40" y2="45" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="-52" y="45" width="24" height="14" fill="#1d4ed8"/>
    <text x="0" y="-10" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">جرثقیل ۱</text>
  </g>

  <!-- crane 2 -->
  <g transform="translate(380,110)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#16a34a" stroke-width="5"/>
    <line x1="-55" y1="10" x2="55" y2="10" stroke="#16a34a" stroke-width="5"/>
    <line x1="30" y1="10" x2="30" y2="45" stroke="#16a34a" stroke-width="3"/>
    <rect x="18" y="45" width="24" height="14" fill="#16a34a"/>
    <text x="0" y="-10" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">جرثقیل ۲</text>
  </g>

  <!-- conflict marker between cranes if they tried to cross -->
  <g transform="translate(260,150)">
    <circle cx="0" cy="0" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="0" y="6" font-family="Vazirmatn" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">✕</text>
  </g>
  <text x="260" y="190" font-family="Vazirmatn" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">عبور از هم ممنوع</text>

  <rect x="180" y="360" width="440" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="388" font-family="Vazirmatn" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">کدام جرثقیل، کدام بخش کشتی را تخلیه کند؟</text>
</svg>
