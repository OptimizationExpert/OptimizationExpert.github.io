<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="320" height="180" fill="#ffffff"/>

  <!-- water -->
  <rect x="0" y="130" width="320" height="50" fill="#e0f2fe"/>

  <!-- ship hull -->
  <g transform="translate(95,95)">
    <path d="M0,15 L130,15 L124,32 L6,32 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- rail -->
  <rect x="90" y="90" width="140" height="3" fill="#475569"/>

  <!-- crane 1 -->
  <g transform="translate(120,55)">
    <line x1="0" y1="0" x2="0" y2="36" stroke="#1d4ed8" stroke-width="3.5"/>
    <line x1="-18" y1="4" x2="18" y2="4" stroke="#1d4ed8" stroke-width="3.5"/>
  </g>

  <!-- crane 2 -->
  <g transform="translate(190,55)">
    <line x1="0" y1="0" x2="0" y2="36" stroke="#16a34a" stroke-width="3.5"/>
    <line x1="-18" y1="4" x2="18" y2="4" stroke="#16a34a" stroke-width="3.5"/>
  </g>

  <text x="160" y="150" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">جرثقیل اسکله</text>
</svg>
