<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#FFFFFF"/>

  <text x="30" y="50" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="19" fill="#1E293B" font-weight="bold">Relief Logistics</text>

  <!-- damaged road -->
  <line x1="200" y1="110" x2="200" y2="185" stroke="#EF4444" stroke-width="3" stroke-dasharray="7,5"/>
  <g transform="translate(200,150)">
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#EF4444" stroke-width="2.5"/>
  </g>

  <!-- open roads -->
  <line x1="175" y1="105" x2="100" y2="165" stroke="#2563EB" stroke-width="3"/>
  <line x1="225" y1="105" x2="300" y2="165" stroke="#2563EB" stroke-width="3"/>

  <!-- routes to villages -->
  <line x1="100" y1="180" x2="60" y2="270" stroke="#F97316" stroke-width="2.5"/>
  <line x1="100" y1="180" x2="130" y2="290" stroke="#F97316" stroke-width="2.5"/>
  <line x1="300" y1="180" x2="270" y2="290" stroke="#F97316" stroke-width="2.5"/>
  <line x1="300" y1="180" x2="340" y2="270" stroke="#F97316" stroke-width="2.5"/>

  <!-- hub -->
  <rect x="165" y="65" width="70" height="42" rx="6" fill="#1D4ED8"/>
  <text x="200" y="91" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">HUB</text>

  <!-- opened depots -->
  <circle cx="100" cy="170" r="20" fill="#F97316"/>
  <circle cx="300" cy="170" r="20" fill="#F97316"/>

  <!-- rejected depot -->
  <circle cx="200" cy="200" r="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4,3"/>

  <!-- villages -->
  <circle cx="60" cy="275" r="8" fill="#DC2626"/>
  <circle cx="130" cy="295" r="8" fill="#DC2626"/>
  <circle cx="270" cy="295" r="8" fill="#DC2626"/>
  <circle cx="340" cy="275" r="8" fill="#DC2626"/>

  <text x="30" y="345" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#64748B">Facility location + routing</text>
  <text x="30" y="368" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#64748B">OR-Tools · PuLP</text>
</svg>
