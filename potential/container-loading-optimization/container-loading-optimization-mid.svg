<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Crane -->
  <line x1="200" y1="120" x2="200" y2="700" stroke="#334155" stroke-width="10"/>
  <line x1="200" y1="140" x2="520" y2="140" stroke="#334155" stroke-width="10"/>
  <line x1="380" y1="140" x2="380" y2="330" stroke="#64748b" stroke-width="4"/>
  <rect x="350" y="330" width="60" height="16" fill="#64748b"/>

  <!-- Container outline -->
  <rect x="330" y="380" width="960" height="380" rx="8" fill="none" stroke="#1e293b" stroke-width="8"/>
  <text x="810" y="360" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="30" fill="#1e293b">کانتینر باربری</text>

  <!-- Boxes packed inside container, varying sizes -->
  <rect x="350" y="560" width="180" height="180" fill="#2563EB" opacity="0.85"/>
  <rect x="540" y="620" width="140" height="120" fill="#f59e0b" opacity="0.9"/>
  <rect x="690" y="500" width="160" height="240" fill="#10b981" opacity="0.85"/>
  <rect x="860" y="600" width="130" height="140" fill="#2563EB" opacity="0.7"/>
  <rect x="1000" y="560" width="150" height="180" fill="#f59e0b" opacity="0.7"/>
  <rect x="1160" y="600" width="110" height="140" fill="#10b981" opacity="0.7"/>

  <text x="440" y="655" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="22" fill="#ffffff">جعبه</text>
  <text x="765" y="625" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="22" fill="#ffffff">جعبه</text>

  <!-- Empty space marker -->
  <rect x="1120" y="560" width="30" height="180" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,6"/>
  <text x="1135" y="530" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="22" fill="#ef4444">فضای خالی</text>

  <!-- Truck under container -->
  <rect x="330" y="760" width="960" height="20" fill="#94a3b8"/>
  <circle cx="450" cy="800" r="26" fill="#334155"/>
  <circle cx="600" cy="800" r="26" fill="#334155"/>
  <circle cx="1150" cy="800" r="26" fill="#334155"/>
  <circle cx="1250" cy="800" r="26" fill="#334155"/>

  <text x="810" y="850" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#334155">چیدمان بهینه‌ی جعبه‌ها برای کمینه کردن فضای خالی</text>
</svg>
