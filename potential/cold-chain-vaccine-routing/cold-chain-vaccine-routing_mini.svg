<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- route -->
  <path d="M 60 220 C 120 150, 160 120, 220 90" fill="none" stroke="#2fa3a3" stroke-width="4" stroke-dasharray="8,7"/>

  <!-- Truck -->
  <g transform="translate(85,175)">
    <rect x="0" y="0" width="70" height="35" rx="4" fill="#ffffff" stroke="#1e6fbf" stroke-width="3"/>
    <rect x="70" y="8" width="24" height="27" rx="3" fill="#1e6fbf"/>
    <circle cx="18" cy="38" r="7" fill="#1e3a5f"/>
    <circle cx="60" cy="38" r="7" fill="#1e3a5f"/>
    <circle cx="80" cy="38" r="7" fill="#1e3a5f"/>
    <g stroke="#2fa3a3" stroke-width="2" transform="translate(35,16)">
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="6" y1="-6" x2="-6" y2="6"/>
    </g>
  </g>

  <!-- Clinic -->
  <g transform="translate(210,55)">
    <rect x="0" y="0" width="55" height="45" rx="5" fill="#fdeeee" stroke="#c0392b" stroke-width="3"/>
    <rect x="14" y="20" width="27" height="6" fill="#c0392b"/>
    <rect x="24" y="10" width="7" height="26" fill="#c0392b"/>
  </g>

  <!-- vaccine box -->
  <g transform="translate(30,230)">
    <rect x="0" y="0" width="38" height="30" rx="3" fill="#ffffff" stroke="#2fa3a3" stroke-width="3"/>
    <line x1="0" y1="15" x2="38" y2="15" stroke="#2fa3a3" stroke-width="2"/>
    <line x1="19" y1="0" x2="19" y2="30" stroke="#2fa3a3" stroke-width="2"/>
  </g>

  <text x="150" y="270" font-size="16" font-family="Arial" fill="#1e3a5f" text-anchor="middle" font-weight="bold">زنجیره سرد واکسن</text>
</svg>
