<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title labels -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#b91c1c">مدیریت موجودی خون بر اساس سن واحد</text>

  <!-- Flow: Donation -> Inventory by age -> Hospital use / Waste -->
  <!-- Donation icon -->
  <g transform="translate(60,90)">
    <circle cx="30" cy="30" r="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <path d="M30 12 C 40 26, 46 34, 30 48 C 14 34, 20 26, 30 12 Z" fill="#dc2626"/>
    <text x="30" y="80" text-anchor="middle" font-size="13" fill="#7f1d1d">اهدای خون</text>
  </g>

  <!-- Arrow to inventory -->
  <line x1="130" y1="120" x2="185" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Inventory bars by age -->
  <g transform="translate(190,60)">
    <text x="90" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">موجودی بر اساس رده سنی</text>

    <!-- age 0 fresh -->
    <rect x="0" y="20" width="55" height="120" fill="#22c55e" opacity="0.85" rx="4"/>
    <text x="27" y="155" text-anchor="middle" font-size="12" fill="#065f46">تازه (روز ۰)</text>

    <!-- age mid -->
    <rect x="70" y="55" width="55" height="85" fill="#f59e0b" opacity="0.85" rx="4"/>
    <text x="97" y="155" text-anchor="middle" font-size="12" fill="#92400e">میان‌سال</text>

    <!-- age near expiry -->
    <rect x="140" y="95" width="55" height="45" fill="#ef4444" opacity="0.85" rx="4"/>
    <text x="167" y="155" text-anchor="middle" font-size="12" fill="#7f1d1d">نزدیک انقضا</text>

    <line x1="0" y1="140" x2="195" y2="140" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Arrows to outcomes -->
  <line x1="410" y1="150" x2="470" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="150" x2="470" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hospital use -->
  <g transform="translate(480,70)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="50" y="15" width="20" height="40" fill="#2563eb"/>
    <rect x="35" y="30" width="50" height="10" fill="#2563eb"/>
    <text x="60" y="95" text-anchor="middle" font-size="13" fill="#1e3a8a">مصرف در بیمارستان</text>
  </g>

  <!-- Waste -->
  <g transform="translate(480,200)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <line x1="30" y1="20" x2="90" y2="50" stroke="#b91c1c" stroke-width="4"/>
    <line x1="90" y1="20" x2="30" y2="50" stroke="#b91c1c" stroke-width="4"/>
    <text x="60" y="95" text-anchor="middle" font-size="13" fill="#7f1d1d">دورریز (انقضا)</text>
  </g>

  <!-- Chart of inventory level over time -->
  <g transform="translate(60,300)">
    <text x="280" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">سطح موجودی و تقاضای روزانه در طول زمان</text>
    <line x1="0" y1="150" x2="560" y2="150" stroke="#374151" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="0" y2="150" stroke="#374151" stroke-width="1.5"/>

    <!-- inventory polyline -->
    <polyline points="0,90 80,60 160,100 240,70 320,110 400,50 480,95 560,80" fill="none" stroke="#2563eb" stroke-width="3"/>
    <!-- demand polyline -->
    <polyline points="0,110 80,95 160,120 240,90 320,130 400,80 480,115 560,100" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>

    <circle cx="240" cy="70" r="5" fill="#2563eb"/>
    <text x="240" y="55" text-anchor="middle" font-size="11" fill="#2563eb">موجودی</text>

    <circle cx="400" cy="80" r="5" fill="#f59e0b"/>
    <text x="400" y="185" text-anchor="middle" font-size="11" fill="#92400e">تقاضا</text>

    <text x="0" y="170" font-size="12" fill="#374151">روز ۱</text>
    <text x="540" y="170" font-size="12" fill="#374151">روز ۷</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
