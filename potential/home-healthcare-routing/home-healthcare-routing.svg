<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title label -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f766e" text-anchor="middle">مسیریابی و زمان‌بندی مراقبت در منزل</text>

  <!-- Depot / clinic hub -->
  <g>
    <rect x="370" y="230" width="60" height="50" rx="6" fill="#0f766e"/>
    <polygon points="365,230 400,205 435,230" fill="#0f766e"/>
    <rect x="392" y="250" width="16" height="30" fill="#ffffff"/>
    <text x="400" y="300" font-family="Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle">مرکز درمانی</text>
  </g>

  <!-- Patient homes -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
    <!-- Patient 1 -->
    <g transform="translate(120,110)">
      <polygon points="0,25 25,0 50,25" fill="#f97316"/>
      <rect x="8" y="25" width="34" height="30" fill="#fdba74"/>
      <text x="25" y="72" text-anchor="middle">بیمار ۱ (۸-۹ صبح)</text>
    </g>
    <!-- Patient 2 -->
    <g transform="translate(600,100)">
      <polygon points="0,25 25,0 50,25" fill="#f97316"/>
      <rect x="8" y="25" width="34" height="30" fill="#fdba74"/>
      <text x="25" y="72" text-anchor="middle">بیمار ۲ (۹-۱۰ صبح)</text>
    </g>
    <!-- Patient 3 -->
    <g transform="translate(650,300)">
      <polygon points="0,25 25,0 50,25" fill="#2563eb"/>
      <rect x="8" y="25" width="34" height="30" fill="#93c5fd"/>
      <text x="25" y="72" text-anchor="middle">بیمار ۳ (۱۰-۱۱)</text>
    </g>
    <!-- Patient 4 -->
    <g transform="translate(500,400)">
      <polygon points="0,25 25,0 50,25" fill="#2563eb"/>
      <rect x="8" y="25" width="34" height="30" fill="#93c5fd"/>
      <text x="25" y="72" text-anchor="middle">بیمار ۴ (۱۱-۱۲)</text>
    </g>
    <!-- Patient 5 -->
    <g transform="translate(130,380)">
      <polygon points="0,25 25,0 50,25" fill="#f97316"/>
      <rect x="8" y="25" width="34" height="30" fill="#fdba74"/>
      <text x="25" y="72" text-anchor="middle">بیمار ۵ (۹:۳۰-۱۰:۳۰)</text>
    </g>
  </g>

  <!-- Route for nurse A (orange) -->
  <polyline points="400,255 145,150 145,410 400,255" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="0" />
  <!-- Route for nurse B (blue) -->
  <polyline points="400,255 625,135 675,330 525,430 400,255" fill="none" stroke="#2563eb" stroke-width="3" />

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <rect x="40" y="440" width="18" height="4" fill="#f97316"/>
    <text x="65" y="446">مسیر پرستار الف</text>
    <rect x="200" y="440" width="18" height="4" fill="#2563eb"/>
    <text x="225" y="446">مسیر پرستار ب</text>
    <rect x="360" y="436" width="14" height="12" fill="#0f766e"/>
    <text x="385" y="446">مرکز درمانی</text>
  </g>
</svg>
