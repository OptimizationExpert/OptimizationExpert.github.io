<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <line x1="20" y1="240" x2="280" y2="240" stroke="#0f172a" stroke-width="2" stroke-dasharray="2 5"/>

  <!-- sun -->
  <circle cx="60" cy="55" r="18" fill="#fbbf24"/>

  <!-- solar panel -->
  <g>
    <rect x="30" y="130" width="70" height="45" fill="#1d4ed8" opacity="0.15" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="30" y1="152" x2="100" y2="152" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="65" y1="130" x2="65" y2="175" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="35" y1="175" x2="65" y2="215" stroke="#475569" stroke-width="3"/>
    <line x1="95" y1="175" x2="65" y2="215" stroke="#475569" stroke-width="3"/>
  </g>

  <!-- wind turbine -->
  <g>
    <line x1="150" y1="240" x2="150" y2="95" stroke="#64748b" stroke-width="4"/>
    <g stroke="#0ea5e9" stroke-width="4" stroke-linecap="round">
      <line x1="150" y1="95" x2="150" y2="60"/>
      <line x1="150" y1="95" x2="178" y2="112"/>
      <line x1="150" y1="95" x2="122" y2="112"/>
    </g>
  </g>

  <!-- battery -->
  <g>
    <rect x="190" y="150" width="55" height="80" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
    <rect x="208" y="140" width="20" height="10" rx="2" fill="#16a34a"/>
    <rect x="198" y="168" width="39" height="14" fill="#16a34a" opacity="0.6"/>
    <rect x="198" y="190" width="39" height="14" fill="#16a34a" opacity="0.6"/>
  </g>

  <!-- house -->
  <g>
    <rect x="255" y="195" width="35" height="40" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <polygon points="252,195 272,175 292,195" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  </g>

  <text x="150" y="270" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="bold">اندازه‌دهی ریزشبکه</text>
</svg>
