<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <!-- ground line -->
  <line x1="40" y1="420" x2="860" y2="420" stroke="#94a3b8" stroke-width="3"/>

  <!-- Sun -->
  <circle cx="120" cy="80" r="34" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="4">
    <line x1="120" y1="20" x2="120" y2="34"/>
    <line x1="120" y1="126" x2="120" y2="140"/>
    <line x1="60" y1="80" x2="74" y2="80"/>
    <line x1="166" y1="80" x2="180" y2="80"/>
    <line x1="78" y1="38" x2="88" y2="48"/>
    <line x1="152" y1="112" x2="162" y2="122"/>
    <line x1="162" y1="38" x2="152" y2="48"/>
    <line x1="88" y1="112" x2="78" y2="122"/>
  </g>

  <!-- Solar panel array -->
  <g>
    <rect x="60" y="230" width="160" height="90" fill="#1d4ed8" opacity="0.12" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="60" y1="252" x2="220" y2="252" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="60" y1="274" x2="220" y2="274" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="60" y1="296" x2="220" y2="296" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="100" y1="230" x2="100" y2="320" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="140" y1="230" x2="140" y2="320" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="180" y1="230" x2="180" y2="320" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="60" y1="320" x2="140" y2="400" stroke="#475569" stroke-width="4"/>
    <line x1="220" y1="320" x2="140" y2="400" stroke="#475569" stroke-width="4"/>
    <text x="140" y="345" text-anchor="middle" font-size="18" fill="#1e3a8a">پنل خورشیدی</text>
  </g>

  <!-- Wind turbine -->
  <g>
    <line x1="330" y1="420" x2="330" y2="150" stroke="#64748b" stroke-width="6"/>
    <circle cx="330" cy="150" r="8" fill="#334155"/>
    <g stroke="#0ea5e9" stroke-width="6" stroke-linecap="round">
      <line x1="330" y1="150" x2="330" y2="90"/>
      <line x1="330" y1="150" x2="378" y2="178"/>
      <line x1="330" y1="150" x2="282" y2="178"/>
    </g>
    <text x="330" y="345" text-anchor="middle" font-size="18" fill="#0c4a6e">توربین بادی</text>
  </g>

  <!-- Battery -->
  <g>
    <rect x="430" y="270" width="110" height="150" rx="10" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="465" y="255" width="40" height="16" rx="3" fill="#16a34a"/>
    <rect x="445" y="300" width="80" height="24" fill="#16a34a" opacity="0.6"/>
    <rect x="445" y="332" width="80" height="24" fill="#16a34a" opacity="0.6"/>
    <rect x="445" y="364" width="80" height="24" fill="#16a34a" opacity="0.35"/>
    <text x="485" y="400" text-anchor="middle" font-size="18" fill="#14532d">باتری</text>
  </g>

  <!-- Diesel generator (backup) -->
  <g>
    <rect x="590" y="330" width="100" height="70" rx="8" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="615" cy="365" r="14" fill="none" stroke="#f97316" stroke-width="3"/>
    <circle cx="655" cy="365" r="14" fill="none" stroke="#f97316" stroke-width="3"/>
    <text x="640" y="418" text-anchor="middle" font-size="17" fill="#9a3412">ژنراتور پشتیبان</text>
  </g>

  <!-- Building / load -->
  <g>
    <rect x="740" y="290" width="110" height="110" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <polygon points="735,290 795,250 855,290" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
    <rect x="765" y="330" width="24" height="24" fill="#475569"/>
    <rect x="805" y="330" width="24" height="24" fill="#475569"/>
    <rect x="780" y="365" width="30" height="35" fill="#334155"/>
    <text x="795" y="425" text-anchor="middle" font-size="18" fill="#1e293b">بار مصرفی</text>
  </g>

  <!-- connecting bus line -->
  <line x1="140" y1="420" x2="795" y2="420" stroke="#0f172a" stroke-width="3" stroke-dasharray="2 6"/>
  <circle cx="140" cy="420" r="5" fill="#0f172a"/>
  <circle cx="330" cy="420" r="5" fill="#0f172a"/>
  <circle cx="485" cy="420" r="5" fill="#0f172a"/>
  <circle cx="640" cy="420" r="5" fill="#0f172a"/>
  <circle cx="795" cy="420" r="5" fill="#0f172a"/>

  <text x="450" y="470" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="bold">اندازه‌دهی بهینه ریزشبکه: چقدر خورشید، باد و باتری کافی است؟</text>
</svg>
