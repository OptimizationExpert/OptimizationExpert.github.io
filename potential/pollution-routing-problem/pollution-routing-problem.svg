<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Road -->
  <rect x="0" y="400" width="900" height="70" fill="#e5e7eb"/>
  <line x1="0" y1="435" x2="900" y2="435" stroke="#ffffff" stroke-width="4" stroke-dasharray="24,18"/>

  <!-- Route path (dashed, showing route with waypoints) -->
  <path d="M 90 340 C 250 260, 350 300, 460 250 C 570 200, 650 260, 780 210" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- Depot -->
  <rect x="55" y="330" width="60" height="45" fill="#166534" rx="4"/>
  <polygon points="50,330 85,305 120,330" fill="#166534"/>
  <text x="85" y="392" font-size="14" fill="#166534" text-anchor="middle" font-weight="bold">انبار مبدأ</text>

  <!-- Customer nodes along route -->
  <circle cx="460" cy="250" r="9" fill="#22c55e"/>
  <text x="460" y="232" font-size="13" fill="#166534" text-anchor="middle">مشتری ۱</text>

  <circle cx="780" cy="210" r="9" fill="#22c55e"/>
  <text x="780" y="192" font-size="13" fill="#166534" text-anchor="middle">مشتری ۲</text>

  <!-- Truck 1 (fast, empty load, larger exhaust cloud) -->
  <g transform="translate(230,392)">
    <rect x="0" y="0" width="70" height="34" rx="5" fill="#15803d"/>
    <rect x="55" y="-18" width="30" height="26" rx="4" fill="#166534"/>
    <rect x="60" y="-13" width="10" height="10" fill="#bbf7d0"/>
    <circle cx="14" cy="36" r="9" fill="#111827"/>
    <circle cx="55" cy="36" r="9" fill="#111827"/>
    <!-- exhaust cloud (larger = more pollution) -->
    <circle cx="-14" cy="-4" r="9" fill="#9ca3af" opacity="0.85"/>
    <circle cx="-28" cy="-14" r="12" fill="#9ca3af" opacity="0.7"/>
    <circle cx="-46" cy="-22" r="15" fill="#9ca3af" opacity="0.55"/>
    <text x="35" y="-32" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">۹۰ km/h</text>
    <text x="35" y="58" font-size="12" fill="#374151" text-anchor="middle">بار کامل</text>
  </g>

  <!-- Truck 2 (optimal speed, smaller exhaust cloud) -->
  <g transform="translate(560,352)">
    <rect x="0" y="0" width="70" height="34" rx="5" fill="#15803d"/>
    <rect x="55" y="-18" width="30" height="26" rx="4" fill="#166534"/>
    <rect x="60" y="-13" width="10" height="10" fill="#bbf7d0"/>
    <circle cx="14" cy="36" r="9" fill="#111827"/>
    <circle cx="55" cy="36" r="9" fill="#111827"/>
    <!-- small exhaust cloud -->
    <circle cx="-10" cy="-2" r="6" fill="#9ca3af" opacity="0.6"/>
    <circle cx="-20" cy="-8" r="7" fill="#9ca3af" opacity="0.4"/>
    <text x="35" y="-32" font-size="13" fill="#166534" text-anchor="middle" font-weight="bold">۶۵ km/h</text>
    <text x="35" y="58" font-size="12" fill="#374151" text-anchor="middle">سرعت اقتصادی</text>
  </g>

  <!-- Speed gauge -->
  <g transform="translate(720,60)">
    <circle cx="60" cy="60" r="55" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <path d="M 20 90 A 55 55 0 0 1 100 90" fill="none" stroke="#f59e0b" stroke-width="8"/>
    <path d="M 20 90 A 55 55 0 0 1 60 5" fill="none" stroke="#22c55e" stroke-width="8"/>
    <line x1="60" y1="60" x2="42" y2="25" stroke="#111827" stroke-width="4"/>
    <circle cx="60" cy="60" r="5" fill="#111827"/>
    <text x="60" y="130" font-size="14" fill="#166534" text-anchor="middle" font-weight="bold">سرعت بهینه</text>
  </g>

  <!-- Title label -->
  <text x="450" y="45" font-size="26" fill="#166534" text-anchor="middle" font-weight="bold">مسیریابی سبز (Pollution Routing)</text>
  <text x="450" y="75" font-size="15" fill="#374151" text-anchor="middle">سرعت و بار، همراه با مسیر، برای کمینه‌کردن سوخت و کربن انتخاب می‌شوند</text>

  <!-- CO2 label near big cloud -->
  <text x="150" y="330" font-size="13" fill="#6b7280" text-anchor="middle">آلودگی بیشتر</text>
  <text x="580" y="300" font-size="13" fill="#16a34a" text-anchor="middle">آلودگی کمتر</text>
</svg>
