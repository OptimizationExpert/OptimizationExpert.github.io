<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">مکان‌یابی آمبولانس با پوشش زمان پاسخ</text>

  <!-- Coverage circles (opened stations) -->
  <circle cx="260" cy="260" r="130" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="560" cy="290" r="120" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Candidate station not selected (dimmed) -->
  <circle cx="400" cy="130" r="90" fill="#94a3b8" fill-opacity="0.04" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="650" cy="120" r="80" fill="#94a3b8" fill-opacity="0.04" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Opened ambulance stations -->
  <g>
    <circle cx="260" cy="260" r="14" fill="#dc2626"/>
    <text x="260" y="266" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
    <text x="260" y="300" font-family="Arial" font-size="13" fill="#334155" text-anchor="middle">ایستگاه باز (مرکز)</text>
  </g>
  <g>
    <circle cx="560" cy="290" r="14" fill="#dc2626"/>
    <text x="560" y="296" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
    <text x="560" y="330" font-family="Arial" font-size="13" fill="#334155" text-anchor="middle">ایستگاه باز (شرق)</text>
  </g>

  <!-- Candidate stations not opened -->
  <g>
    <circle cx="400" cy="130" r="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="400" y="112" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">کاندید غیرفعال</text>
  </g>
  <g>
    <circle cx="650" cy="120" r="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="650" y="102" font-family="Arial" font-size="12" fill="#64748b" text-anchor="middle">کاندید غیرفعال</text>
  </g>

  <!-- Demand zones (covered = filled, uncovered = outline only) -->
  <g>
    <rect x="200" y="215" width="26" height="26" rx="4" fill="#f59e0b"/>
    <text x="213" y="260" font-family="Arial" font-size="11" fill="#334155" text-anchor="middle">Zone1</text>
  </g>
  <g>
    <rect x="470" y="240" width="26" height="26" rx="4" fill="#f59e0b"/>
    <text x="483" y="285" font-family="Arial" font-size="11" fill="#334155" text-anchor="middle">Zone2</text>
  </g>
  <g>
    <rect x="300" y="330" width="26" height="26" rx="4" fill="#f59e0b"/>
    <text x="313" y="375" font-family="Arial" font-size="11" fill="#334155" text-anchor="middle">Zone3</text>
  </g>
  <g>
    <rect x="580" y="380" width="26" height="26" rx="4" fill="#f59e0b"/>
    <text x="593" y="425" font-family="Arial" font-size="11" fill="#334155" text-anchor="middle">Zone4</text>
  </g>
  <g>
    <rect x="700" y="260" width="26" height="26" rx="4" fill="#f59e0b"/>
    <text x="713" y="305" font-family="Arial" font-size="11" fill="#334155" text-anchor="middle">Zone5</text>
  </g>

  <!-- Legend -->
  <g font-family="Arial" font-size="12" fill="#334155">
    <rect x="40" y="440" width="16" height="16" fill="#dc2626"/>
    <text x="62" y="453">ایستگاه آمبولانس باز</text>

    <circle cx="230" cy="448" r="8" fill="#cbd5e1" stroke="#94a3b8"/>
    <text x="250" y="453">مکان کاندید بدون انتخاب</text>

    <rect x="420" y="440" width="16" height="16" rx="3" fill="#f59e0b"/>
    <text x="442" y="453">منطقه تقاضا (پوشش‌داده‌شده)</text>

    <circle cx="640" cy="448" r="16" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="662" y="453">شعاع پاسخ استاندارد</text>
  </g>
</svg>
