<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">زنجیره تأمین خون: از اهدا تا بیمار</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#6b7280">تخصیص موجودی بر اساس سن، پیش از رسیدن به تاریخ انقضا</text>

  <!-- Donor centers (left) -->
  <circle cx="90" cy="150" r="30" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <path d="M90,138 C97,148 104,156 90,166 C76,156 83,148 90,138 Z" fill="#b91c1c"/>
  <text x="90" y="200" text-anchor="middle" font-size="12" fill="#7f1d1d">مرکز اهدا ۱</text>

  <circle cx="90" cy="300" r="30" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <path d="M90,288 C97,298 104,306 90,316 C76,306 83,298 90,288 Z" fill="#b91c1c"/>
  <text x="90" y="350" text-anchor="middle" font-size="12" fill="#7f1d1d">مرکز اهدا ۲</text>

  <!-- Arrows donor -> bank -->
  <line x1="122" y1="160" x2="255" y2="200" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="122" y1="290" x2="255" y2="240" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Blood bank: inventory bins by age -->
  <rect x="260" y="140" width="200" height="180" rx="10" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
  <text x="360" y="130" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="bold">بانک خون (موجودی بر اساس سن)</text>

  <!-- Age bins: fresh to near-expiry gradient -->
  <rect x="280" y="165" width="30" height="120" rx="4" fill="#b91c1c"/>
  <text x="295" y="300" text-anchor="middle" font-size="10" fill="#7f1d1d">تازه</text>

  <rect x="320" y="180" width="30" height="90" rx="4" fill="#ef4444"/>
  <text x="335" y="300" text-anchor="middle" font-size="10" fill="#7f1d1d">سن ۱۵</text>

  <rect x="360" y="195" width="30" height="60" rx="4" fill="#fca5a5"/>
  <text x="375" y="300" text-anchor="middle" font-size="10" fill="#7f1d1d">سن ۳۰</text>

  <rect x="400" y="210" width="30" height="30" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="415" y="300" text-anchor="middle" font-size="10" fill="#374151">نزدیک انقضا</text>

  <!-- Arrow bank -> waste -->
  <line x1="415" y1="325" x2="415" y2="380" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrowgray)"/>
  <g transform="translate(395,385)">
    <path d="M2,0 L38,0 L34,32 L6,32 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
    <line x1="4" y1="8" x2="36" y2="8" stroke="#4b5563" stroke-width="1.5"/>
  </g>
  <text x="415" y="432" text-anchor="middle" font-size="11" fill="#4b5563">ضایعات (انقضا)</text>

  <!-- Arrows bank -> hospitals -->
  <line x1="462" y1="200" x2="600" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowgreen)"/>
  <line x1="462" y1="230" x2="600" y2="250" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowgreen)"/>
  <line x1="462" y1="270" x2="600" y2="360" stroke="#f59e0b" stroke-width="3" marker-end="url(#arroworange)"/>

  <!-- Hospitals -->
  <rect x="605" y="95" width="70" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="640" y="130" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="bold">بیمارستان ۱</text>

  <rect x="605" y="220" width="70" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="640" y="255" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="bold">بیمارستان ۲</text>

  <rect x="605" y="330" width="70" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="640" y="365" text-anchor="middle" font-size="11" fill="#78350f" font-weight="bold">اورژانس (کمبود؟)</text>

  <!-- Legend -->
  <rect x="60" y="415" width="18" height="6" fill="#b91c1c"/>
  <text x="85" y="423" font-size="11" fill="#374151">تازه</text>
  <rect x="140" y="415" width="18" height="6" fill="#e5e7eb"/>
  <text x="165" y="423" font-size="11" fill="#374151">نزدیک انقضا</text>
  <rect x="260" y="415" width="18" height="6" fill="#16a34a"/>
  <text x="285" y="423" font-size="11" fill="#374151">تخصیص به‌موقع</text>
  <rect x="410" y="415" width="18" height="6" fill="#f59e0b"/>
  <text x="435" y="423" font-size="11" fill="#374151">تقاضای فوری</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/></marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arroworange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
