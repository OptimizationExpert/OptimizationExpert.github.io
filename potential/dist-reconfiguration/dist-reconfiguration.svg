<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e3a5f">بازآرایی شبکه توزیع برق</text>

  <!-- Substation -->
  <g>
    <rect x="55" y="230" width="70" height="90" fill="#dbeafe" stroke="#1e3a5f" stroke-width="3"/>
    <line x1="70" y1="230" x2="90" y2="260" stroke="#1e3a5f" stroke-width="3"/>
    <line x1="110" y1="230" x2="90" y2="260" stroke="#1e3a5f" stroke-width="3"/>
    <line x1="70" y1="290" x2="90" y2="260" stroke="#1e3a5f" stroke-width="3"/>
    <line x1="110" y1="290" x2="90" y2="260" stroke="#1e3a5f" stroke-width="3"/>
    <text x="90" y="345" text-anchor="middle" font-size="15" fill="#1e3a5f" font-weight="bold">پست فوق توزیع</text>
  </g>

  <!-- Feeder A (top) -->
  <line x1="125" y1="255" x2="260" y2="180" stroke="#2563eb" stroke-width="4"/>
  <line x1="260" y1="180" x2="400" y2="150" stroke="#2563eb" stroke-width="4"/>
  <line x1="400" y1="150" x2="540" y2="140" stroke="#2563eb" stroke-width="4"/>

  <!-- Feeder B (bottom) -->
  <line x1="125" y1="300" x2="260" y2="380" stroke="#16a34a" stroke-width="4"/>
  <line x1="260" y1="380" x2="400" y2="420" stroke="#16a34a" stroke-width="4"/>
  <line x1="400" y1="420" x2="540" y2="440" stroke="#16a34a" stroke-width="4"/>

  <!-- Sectionalizing switches (closed, small green squares) on Feeder A -->
  <g>
    <rect x="252" y="172" width="16" height="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <rect x="392" y="142" width="16" height="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  </g>
  <!-- Sectionalizing switches on Feeder B -->
  <g>
    <rect x="252" y="372" width="16" height="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <rect x="392" y="412" width="16" height="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  </g>

  <!-- Load nodes (houses) along Feeder A -->
  <g fill="#1e3a5f">
    <rect x="255" y="160" width="14" height="12"/>
    <rect x="395" y="130" width="14" height="12"/>
    <circle cx="540" cy="140" r="9" fill="#ef4444"/>
  </g>
  <!-- Load nodes along Feeder B -->
  <g fill="#1e3a5f">
    <rect x="255" y="392" width="14" height="12"/>
    <rect x="395" y="432" width="14" height="12"/>
    <circle cx="540" cy="440" r="9" fill="#94a3b8"/>
  </g>

  <text x="330" y="120" font-size="14" fill="#2563eb" font-weight="bold">فیدر A (پربار)</text>
  <text x="330" y="470" font-size="14" fill="#16a34a" font-weight="bold">فیدر B (کم‌بار)</text>

  <!-- Tie switch between end of feeder A and feeder B, currently open -->
  <line x1="540" y1="140" x2="540" y2="440" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10,8"/>
  <rect x="522" y="270" width="36" height="20" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
  <text x="540" y="264" text-anchor="middle" font-size="13" fill="#ef4444" font-weight="bold">کلید تای (باز)</text>

  <!-- Arrow showing reconfiguration -->
  <path d="M 610 290 L 690 290" stroke="#1e3a5f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="650" y="270" text-anchor="middle" font-size="14" fill="#1e3a5f" font-weight="bold">بازآرایی</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="#1e3a5f"/>
    </marker>
  </defs>

  <!-- After reconfiguration panel -->
  <g>
    <rect x="710" y="60" width="170" height="440" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="795" y="90" text-anchor="middle" font-size="15" fill="#1e3a5f" font-weight="bold">بعد از بازآرایی</text>

    <rect x="720" y="230" width="40" height="60" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
    <text x="740" y="305" text-anchor="middle" font-size="11" fill="#1e3a5f">پست</text>

    <line x1="760" y1="255" x2="820" y2="170" stroke="#2563eb" stroke-width="3"/>
    <line x1="820" y1="170" x2="850" y2="130" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,5"/>
    <rect x="812" y="163" width="12" height="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="850" y="120" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="bold">باز</text>

    <line x1="760" y1="270" x2="820" y2="340" stroke="#16a34a" stroke-width="3"/>
    <line x1="820" y1="340" x2="850" y2="430" stroke="#16a34a" stroke-width="3"/>
    <rect x="812" y="333" width="12" height="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="855" y="450" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="bold">بسته</text>
    <circle cx="850" cy="130" r="6" fill="#ef4444"/>
    <circle cx="850" cy="430" r="6" fill="#94a3b8"/>

    <text x="795" y="480" text-anchor="middle" font-size="11" fill="#1e3a5f">تلفات کمتر، ولتاژ بهتر</text>
  </g>
</svg>
