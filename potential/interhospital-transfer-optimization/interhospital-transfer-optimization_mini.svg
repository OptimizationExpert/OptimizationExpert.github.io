<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="320" height="180" fill="#ffffff"/>

  <!-- small source hospital -->
  <g transform="translate(70,62)">
    <rect x="0" y="14" width="42" height="36" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <rect x="14" y="0" width="14" height="14" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <rect x="18" y="4" width="6" height="6" fill="#b91c1c"/>
    <rect x="16" y="6" width="10" height="2.5" fill="#b91c1c"/>
  </g>

  <!-- small destination hospital -->
  <g transform="translate(205,62)">
    <rect x="0" y="14" width="42" height="36" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect x="14" y="0" width="14" height="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect x="18" y="4" width="6" height="6" fill="#0d9488"/>
    <rect x="16" y="6" width="10" height="2.5" fill="#0d9488"/>
  </g>

  <!-- connecting dashed road -->
  <path d="M120,98 L200,98" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7,6"/>

  <!-- small ambulance -->
  <g transform="translate(136,80)">
    <rect x="0" y="10" width="40" height="18" rx="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="27" y="3" width="13" height="15" rx="2" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="9" cy="30" r="4.5" fill="#0f172a"/>
    <circle cx="31" cy="30" r="4.5" fill="#0f172a"/>
    <rect x="13" y="15" width="9" height="3" fill="#dc2626"/>
    <rect x="16" y="12" width="3" height="9" fill="#dc2626"/>
  </g>

  <text x="160" y="150" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">انتقال بین‌بیمارستانی</text>
</svg>
