<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- ICU frame -->
  <rect x="30" y="70" width="240" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>

  <!-- Bed 1 -->
  <g transform="translate(50,110)">
    <rect x="0" y="20" width="55" height="32" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <circle cx="16" cy="34" r="8" fill="#f59e0b"/>
    <rect x="26" y="30" width="24" height="12" rx="4" fill="#fcd34d"/>
  </g>

  <!-- Bed 2 -->
  <g transform="translate(120,110)">
    <rect x="0" y="20" width="55" height="32" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <circle cx="16" cy="34" r="8" fill="#38bdf8"/>
    <rect x="26" y="30" width="24" height="12" rx="4" fill="#bae6fd"/>
  </g>

  <!-- Bed 3: empty, dashed -->
  <g transform="translate(190,110)">
    <rect x="0" y="20" width="55" height="32" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,4"/>
    <text x="27" y="40" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">؟</text>
  </g>

  <!-- ambulance mini icon bottom-left -->
  <g transform="translate(40,225)">
    <rect x="0" y="8" width="34" height="16" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="22" y="0" width="12" height="14" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="10" y="12" width="8" height="3" fill="#dc2626"/>
    <rect x="13" y="9" width="3" height="8" fill="#dc2626"/>
  </g>

  <!-- clock icon bottom-right for elective patient -->
  <g transform="translate(220,225)">
    <circle cx="14" cy="14" r="14" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="14" y1="14" x2="14" y2="5" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="14" y1="14" x2="20" y2="17" stroke="#1d4ed8" stroke-width="2"/>
  </g>

  <text x="150" y="52" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">ICU</text>
</svg>
