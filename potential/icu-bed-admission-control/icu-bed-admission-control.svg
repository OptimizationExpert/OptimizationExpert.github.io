<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">بخش مراقبت‌های ویژه (ICU)</text>

  <!-- ICU room outline -->
  <rect x="150" y="60" width="500" height="290" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="400" y="86" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" fill="#0d9488" text-anchor="middle">تخت‌های ICU</text>

  <!-- Bed 1 (occupied) -->
  <g transform="translate(180,110)">
    <rect x="0" y="30" width="90" height="46" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="20" width="18" height="20" rx="4" fill="#0f766e"/>
    <circle cx="26" cy="48" r="11" fill="#f59e0b"/>
    <rect x="38" y="42" width="46" height="20" rx="6" fill="#fcd34d"/>
    <!-- monitor -->
    <rect x="5" y="-38" width="60" height="40" rx="4" fill="#0f172a"/>
    <polyline points="10,-18 20,-28 30,-8 40,-30 50,-14 60,-20" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="45" y="92" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle">اشغال</text>
  </g>

  <!-- Bed 2 (occupied) -->
  <g transform="translate(300,110)">
    <rect x="0" y="30" width="90" height="46" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="20" width="18" height="20" rx="4" fill="#0f766e"/>
    <circle cx="26" cy="48" r="11" fill="#38bdf8"/>
    <rect x="38" y="42" width="46" height="20" rx="6" fill="#bae6fd"/>
    <rect x="5" y="-38" width="60" height="40" rx="4" fill="#0f172a"/>
    <polyline points="10,-16 20,-30 30,-10 40,-26 50,-16 60,-22" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="45" y="92" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle">اشغال</text>
  </g>

  <!-- Bed 3 (occupied, critical incoming will connect via arrow) -->
  <g transform="translate(420,110)">
    <rect x="0" y="30" width="90" height="46" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="20" width="18" height="20" rx="4" fill="#0f766e"/>
    <circle cx="26" cy="48" r="11" fill="#a78bfa"/>
    <rect x="38" y="42" width="46" height="20" rx="6" fill="#ddd6fe"/>
    <rect x="5" y="-38" width="60" height="40" rx="4" fill="#0f172a"/>
    <polyline points="10,-20 20,-26 30,-12 40,-30 50,-18 60,-24" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="45" y="92" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle">اشغال</text>
  </g>

  <!-- Bed 4 (empty / reserved, dashed) -->
  <g transform="translate(540,110)">
    <rect x="0" y="30" width="90" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,4"/>
    <rect x="0" y="20" width="18" height="20" rx="4" fill="#ea580c" opacity="0.5"/>
    <rect x="5" y="-38" width="60" height="40" rx="4" fill="#fef3c7" stroke="#ea580c" stroke-width="1.5"/>
    <text x="35" y="-15" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle">؟</text>
    <text x="45" y="92" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">تخت خالی</text>
  </g>

  <!-- capacity gauge -->
  <text x="400" y="250" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle">ظرفیت اشغال‌شده: ۳ از ۴ تخت</text>
  <rect x="220" y="262" width="360" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="220" y="262" width="270" height="18" rx="9" fill="#0d9488"/>

  <!-- decision box -->
  <rect x="230" y="300" width="340" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="323" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">این آخرین تخت را به کدام بیمار بدهیم؟</text>

  <!-- Ambulance (left, incoming emergency) -->
  <g transform="translate(20,240)">
    <rect x="0" y="20" width="90" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="60" y="6" width="30" height="34" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="20" cy="64" r="9" fill="#0f172a"/>
    <circle cx="70" cy="64" r="9" fill="#0f172a"/>
    <rect x="30" y="30" width="20" height="6" fill="#dc2626"/>
    <rect x="37" y="23" width="6" height="20" fill="#dc2626"/>
    <text x="45" y="-6" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">بیمار اورژانسی</text>
  </g>
  <path d="M120,270 L150,270" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>

  <!-- Elective patient (right, waiting) -->
  <g transform="translate(690,235)">
    <circle cx="20" cy="20" r="13" fill="#1d4ed8"/>
    <rect x="6" y="34" width="28" height="34" rx="8" fill="#3b82f6"/>
    <circle cx="60" cy="55" r="14" fill="none" stroke="#334155" stroke-width="2.5"/>
    <line x1="60" y1="55" x2="60" y2="46" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="55" x2="66" y2="58" stroke="#334155" stroke-width="2"/>
    <text x="40" y="-6" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">جراحی انتخابی</text>
    <text x="40" y="92" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">در انتظار پذیرش</text>
  </g>
  <path d="M680,270 L650,270" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
