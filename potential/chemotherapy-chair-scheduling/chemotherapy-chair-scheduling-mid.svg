<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="90" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="34" fill="#0f172a" font-weight="bold">زمان‌بندی صندلی‌های شیمی‌درمانی</text>

  <!-- Timeline / schedule bar -->
  <g>
    <rect x="140" y="150" width="1320" height="70" rx="10" fill="#e6f5f7" stroke="#0891b2" stroke-width="2"/>
    <!-- clock icon -->
    <circle cx="190" cy="185" r="22" fill="#ffffff" stroke="#0e7490" stroke-width="4"/>
    <line x1="190" y1="185" x2="190" y2="170" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="185" x2="201" y2="191" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>

    <!-- time slot ticks -->
    <line x1="320" y1="150" x2="320" y2="220" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="620" y1="150" x2="620" y2="220" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="920" y1="150" x2="920" y2="220" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="1220" y1="150" x2="1220" y2="220" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,4"/>

    <text x="470" y="192" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#155e63">نوبت ۱</text>
    <text x="770" y="192" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#155e63">نوبت ۲</text>
    <text x="1070" y="192" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#155e63">نوبت ۳</text>
    <text x="1350" y="192" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#155e63">نوبت ۴</text>

    <text x="1460" y="192" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="22" fill="#0e7490" font-weight="bold">زمان‌بندی</text>
  </g>

  <!-- Row of chair + IV stand units -->
  <g>
    <!-- Unit template repeated at 4 x positions -->
    <!-- Unit 1 -->
    <g transform="translate(220,420)">
      <!-- IV stand -->
      <line x1="-90" y1="-160" x2="-90" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-130" y1="120" x2="-50" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-90" y1="-160" x2="-55" y2="-175" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <path d="M -95 -175 q 5 -20 20 0 q 5 20 -20 0 z" fill="#7dd3e0" stroke="#0e7490" stroke-width="3"/>
      <line x1="-88" y1="-160" x2="-40" y2="-40" stroke="#7dd3e0" stroke-width="3"/>
      <!-- Chair -->
      <rect x="-10" y="10" width="150" height="30" rx="8" fill="#0891b2"/>
      <rect x="-10" y="-70" width="30" height="100" rx="8" fill="#0891b2"/>
      <rect x="110" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="-4" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="10" y="-60" width="120" height="24" rx="8" fill="#67e8f9"/>
      <text x="65" y="150" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="22" fill="#0f172a">صندلی شیمی‌درمانی</text>
      <text x="-90" y="150" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" fill="#0f172a">سرم</text>
    </g>

    <!-- Unit 2 -->
    <g transform="translate(600,420)">
      <line x1="-90" y1="-160" x2="-90" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-130" y1="120" x2="-50" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-90" y1="-160" x2="-55" y2="-175" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <path d="M -95 -175 q 5 -20 20 0 q 5 20 -20 0 z" fill="#7dd3e0" stroke="#0e7490" stroke-width="3"/>
      <line x1="-88" y1="-160" x2="-40" y2="-40" stroke="#7dd3e0" stroke-width="3"/>
      <rect x="-10" y="10" width="150" height="30" rx="8" fill="#0891b2"/>
      <rect x="-10" y="-70" width="30" height="100" rx="8" fill="#0891b2"/>
      <rect x="110" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="-4" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="10" y="-60" width="120" height="24" rx="8" fill="#67e8f9"/>
    </g>

    <!-- Unit 3 -->
    <g transform="translate(980,420)">
      <line x1="-90" y1="-160" x2="-90" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-130" y1="120" x2="-50" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-90" y1="-160" x2="-55" y2="-175" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <path d="M -95 -175 q 5 -20 20 0 q 5 20 -20 0 z" fill="#7dd3e0" stroke="#0e7490" stroke-width="3"/>
      <line x1="-88" y1="-160" x2="-40" y2="-40" stroke="#7dd3e0" stroke-width="3"/>
      <rect x="-10" y="10" width="150" height="30" rx="8" fill="#0891b2"/>
      <rect x="-10" y="-70" width="30" height="100" rx="8" fill="#0891b2"/>
      <rect x="110" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="-4" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="10" y="-60" width="120" height="24" rx="8" fill="#67e8f9"/>
    </g>

    <!-- Unit 4 -->
    <g transform="translate(1360,420)">
      <line x1="-90" y1="-160" x2="-90" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-130" y1="120" x2="-50" y2="120" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <line x1="-90" y1="-160" x2="-55" y2="-175" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
      <path d="M -95 -175 q 5 -20 20 0 q 5 20 -20 0 z" fill="#7dd3e0" stroke="#0e7490" stroke-width="3"/>
      <line x1="-88" y1="-160" x2="-40" y2="-40" stroke="#7dd3e0" stroke-width="3"/>
      <rect x="-10" y="10" width="150" height="30" rx="8" fill="#0891b2"/>
      <rect x="-10" y="-70" width="30" height="100" rx="8" fill="#0891b2"/>
      <rect x="110" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="-4" y="40" width="16" height="60" fill="#155e63"/>
      <rect x="10" y="-60" width="120" height="24" rx="8" fill="#67e8f9"/>
      <text x="-90" y="150" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" fill="#0f172a">سرم</text>
    </g>
  </g>

  <!-- Bottom caption -->
  <text x="800" y="800" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" fill="#0e7490">هر صندلی، یک سرم و یک نوبت زمان‌بندی‌شده</text>
</svg>
