<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- ground -->
  <path d="M0 330 Q 120 300 250 325 T 500 320 T 700 330 L700 400 L0 400 Z" fill="#eafaf0"/>
  <path d="M0 345 Q 150 320 320 345 T 700 345 L700 400 L0 400 Z" fill="#d7f3e3"/>

  <!-- flight range circle -->
  <circle cx="150" cy="230" r="180" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,6" opacity="0.5"/>
  <text x="150" y="60" text-anchor="middle" font-size="14" fill="#16a34a">شعاع پرواز مجاز</text>

  <!-- drone base tower -->
  <rect x="120" y="230" width="60" height="90" fill="#0f172a"/>
  <rect x="105" y="215" width="90" height="18" fill="#1e293b"/>
  <rect x="140" y="190" width="20" height="30" fill="#1e293b"/>
  <circle cx="150" cy="180" r="10" fill="#f97316"/>
  <text x="150" y="335" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="bold">پایگاه پهپاد</text>

  <!-- flight path -->
  <path d="M180 235 Q 320 150 470 200" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- drone icon mid-flight -->
  <g transform="translate(330,175)">
    <rect x="-28" y="-4" width="56" height="10" rx="5" fill="#334155"/>
    <circle cx="-28" cy="-4" r="12" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="28" cy="-4" r="12" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="-28" cy="6" r="12" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="28" cy="6" r="12" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="-10" y="6" width="20" height="16" rx="3" fill="#ef4444"/>
    <line x1="-4" y1="10" x2="4" y2="18" stroke="#ffffff" stroke-width="2"/>
    <line x1="4" y1="10" x2="-4" y2="18" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="330" y="140" text-anchor="middle" font-size="13" fill="#334155">پهپاد حامل واکسن</text>

  <!-- rural clinic in range -->
  <g transform="translate(460,240)">
    <rect x="0" y="0" width="70" height="55" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="-6,0 76,0 35,-28" fill="#0f172a"/>
    <rect x="28" y="20" width="14" height="14" fill="#ef4444"/>
    <rect x="31" y="15" width="8" height="24" fill="#ef4444"/>
    <rect x="10" y="28" width="14" height="27" fill="#93c5fd"/>
  </g>
  <text x="495" y="315" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">درمانگاه روستایی</text>

  <!-- far clinic out of range -->
  <g transform="translate(615,110)" opacity="0.55">
    <rect x="0" y="0" width="50" height="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="-5,0 55,0 25,-20" fill="#94a3b8"/>
    <rect x="18" y="14" width="10" height="10" fill="#94a3b8"/>
  </g>
  <path d="M470 200 L615 128" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,5" opacity="0.6"/>
  <text x="640" y="165" text-anchor="middle" font-size="12" fill="#94a3b8">خارج از برد پرواز</text>

  <!-- title label -->
  <text x="350" y="385" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="bold">مکان‌یابی پایگاه و مسیریابی پهپاد پزشکی</text>
</svg>
