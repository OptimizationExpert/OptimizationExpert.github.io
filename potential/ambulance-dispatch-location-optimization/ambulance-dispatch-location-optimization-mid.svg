<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- City map grid (streets) -->
  <g stroke="#cbd5e1" stroke-width="4">
    <line x1="150" y1="120" x2="150" y2="820"/>
    <line x1="420" y1="120" x2="420" y2="820"/>
    <line x1="690" y1="120" x2="690" y2="820"/>
    <line x1="960" y1="120" x2="960" y2="820"/>
    <line x1="1230" y1="120" x2="1230" y2="820"/>
    <line x1="1450" y1="120" x2="1450" y2="820"/>

    <line x1="120" y1="220" x2="1480" y2="220"/>
    <line x1="120" y1="400" x2="1480" y2="400"/>
    <line x1="120" y1="580" x2="1480" y2="580"/>
    <line x1="120" y1="740" x2="1480" y2="740"/>
  </g>

  <!-- Some simple city blocks -->
  <g fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2">
    <rect x="200" y="150" width="180" height="130"/>
    <rect x="480" y="440" width="160" height="110"/>
    <rect x="1010" y="160" width="170" height="120"/>
    <rect x="1050" y="600" width="150" height="100"/>
  </g>

  <!-- Coverage radius circle around a candidate base -->
  <circle cx="750" cy="430" r="230" fill="#dbeafe" fill-opacity="0.5" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,8"/>
  <text x="960" y="270" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="30" fill="#1d4ed8" text-anchor="middle">شعاع پوشش</text>

  <!-- Candidate ambulance base pins -->
  <g>
    <!-- Base 1 (center, inside coverage circle) -->
    <g transform="translate(750,430)">
      <path d="M0,-46 C25,-46 42,-27 42,-5 C42,20 0,46 0,46 C0,46 -42,20 -42,-5 C-42,-27 -25,-46 0,-46 Z" fill="#dc2626"/>
      <circle cx="0" cy="-5" r="20" fill="#ffffff"/>
      <rect x="-13" y="-11" width="26" height="12" fill="#dc2626"/>
      <rect x="-6" y="-18" width="12" height="26" fill="#dc2626"/>
    </g>
    <text x="750" y="500" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="28" fill="#111827" text-anchor="middle">پایگاه آمبولانس</text>

    <!-- Base 2 (candidate, top-left area) -->
    <g transform="translate(290,300)">
      <path d="M0,-40 C22,-40 36,-23 36,-4 C36,17 0,40 0,40 C0,40 -36,17 -36,-4 C-36,-23 -22,-40 0,-40 Z" fill="#dc2626" fill-opacity="0.85"/>
      <circle cx="0" cy="-4" r="17" fill="#ffffff"/>
      <rect x="-11" y="-9" width="22" height="10" fill="#dc2626"/>
      <rect x="-5" y="-15" width="10" height="22" fill="#dc2626"/>
    </g>

    <!-- Base 3 (candidate, bottom-right area) -->
    <g transform="translate(1180,660)">
      <path d="M0,-40 C22,-40 36,-23 36,-4 C36,17 0,40 0,40 C0,40 -36,17 -36,-4 C-36,-23 -22,-40 0,-40 Z" fill="#dc2626" fill-opacity="0.85"/>
      <circle cx="0" cy="-4" r="17" fill="#ffffff"/>
      <rect x="-11" y="-9" width="22" height="10" fill="#dc2626"/>
      <rect x="-5" y="-15" width="10" height="22" fill="#dc2626"/>
    </g>
  </g>

  <!-- Incident points -->
  <g>
    <g transform="translate(1080,330)">
      <circle cx="0" cy="0" r="16" fill="#1e293b"/>
      <text x="0" y="6" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">!</text>
    </g>
    <text x="1080" y="380" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="28" fill="#111827" text-anchor="middle">محل حادثه</text>

    <g transform="translate(560,690)">
      <circle cx="0" cy="0" r="16" fill="#1e293b"/>
      <text x="0" y="6" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">!</text>
    </g>
  </g>

  <!-- Dispatch route line from base to incident -->
  <line x1="775" y1="410" x2="1075" y2="345" stroke="#dc2626" stroke-width="4" stroke-dasharray="6,6"/>

  <!-- Ambulance icon (flat style), positioned along the route -->
  <g transform="translate(300,780)">
    <rect x="-90" y="-40" width="180" height="60" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <rect x="30" y="-55" width="60" height="45" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <rect x="40" y="-46" width="18" height="18" fill="#93c5fd"/>
    <rect x="-15" y="-15" width="30" height="8" fill="#dc2626"/>
    <rect x="-5" y="-25" width="10" height="28" fill="#dc2626"/>
    <circle cx="-55" cy="25" r="18" fill="#1e293b"/>
    <circle cx="-55" cy="25" r="7" fill="#e5e7eb"/>
    <circle cx="55" cy="25" r="18" fill="#1e293b"/>
    <circle cx="55" cy="25" r="7" fill="#e5e7eb"/>
  </g>
  <text x="300" y="850" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="28" fill="#111827" text-anchor="middle">اعزام آمبولانس</text>

  <text x="800" y="70" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="38" fill="#111827" text-anchor="middle" font-weight="bold">مکان‌یابی پایگاه و اعزام آمبولانس</text>
</svg>
