<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- city street grid -->
  <g stroke="#e2e8f0" stroke-width="6">
    <line x1="60" y1="90" x2="740" y2="90"/>
    <line x1="60" y1="200" x2="740" y2="200"/>
    <line x1="60" y1="310" x2="740" y2="310"/>
    <line x1="60" y1="420" x2="740" y2="420"/>
    <line x1="150" y1="50" x2="150" y2="460"/>
    <line x1="320" y1="50" x2="320" y2="460"/>
    <line x1="490" y1="50" x2="490" y2="460"/>
    <line x1="650" y1="50" x2="650" y2="460"/>
  </g>

  <!-- coverage zones -->
  <circle cx="150" cy="200" r="95" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,5"/>
  <circle cx="490" cy="90" r="95" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,5"/>
  <circle cx="650" cy="350" r="95" fill="#ea580c" fill-opacity="0.08" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Station 1 -->
  <g transform="translate(150,200)">
    <rect x="-22" y="-20" width="44" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="-4" y="-12" width="8" height="20" fill="#2563eb"/>
    <rect x="-12" y="-4" width="24" height="8" fill="#2563eb"/>
    <text x="0" y="34" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">پایگاه ۱</text>
  </g>

  <!-- Station 2 -->
  <g transform="translate(490,90)">
    <rect x="-22" y="-20" width="44" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <rect x="-4" y="-12" width="8" height="20" fill="#16a34a"/>
    <rect x="-12" y="-4" width="24" height="8" fill="#16a34a"/>
    <text x="0" y="34" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">پایگاه ۲</text>
  </g>

  <!-- Station 3 -->
  <g transform="translate(650,350)">
    <rect x="-22" y="-20" width="44" height="36" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
    <rect x="-4" y="-12" width="8" height="20" fill="#ea580c"/>
    <rect x="-12" y="-4" width="24" height="8" fill="#ea580c"/>
    <text x="0" y="34" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">پایگاه ۳</text>
  </g>

  <!-- incident marker -->
  <g transform="translate(320,310)">
    <circle cx="0" cy="0" r="16" fill="#dc2626"/>
    <rect x="-3" y="-9" width="6" height="18" fill="#ffffff"/>
    <rect x="-9" y="-3" width="18" height="6" fill="#ffffff"/>
    <text x="0" y="36" text-anchor="middle" font-size="15" fill="#7f1d1d" font-weight="bold">حادثه</text>
  </g>

  <!-- dispatched ambulance route from station1 to incident -->
  <line x1="150" y1="200" x2="320" y2="310" stroke="#2563eb" stroke-width="4" stroke-dasharray="10,6"/>

  <!-- ambulance icon along the path -->
  <g transform="translate(235,255)">
    <rect x="-26" y="-14" width="52" height="26" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="4" y="-14" width="22" height="26" rx="3" fill="#2563eb"/>
    <circle cx="-14" cy="14" r="6" fill="#1e293b"/>
    <circle cx="12" cy="14" r="6" fill="#1e293b"/>
    <rect x="-10" y="-8" width="14" height="6" fill="#dc2626"/>
    <rect x="-6" y="-11" width="6" height="12" fill="#dc2626"/>
  </g>

  <!-- dispatch center -->
  <g transform="translate(70,60)">
    <rect x="-30" y="-25" width="60" height="45" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
    <text x="0" y="-32" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">مرکز اعزام</text>
  </g>

  <text x="400" y="480" text-anchor="middle" font-size="17" fill="#334155" font-weight="bold">مکان‌یابی پایگاه و اعزام بهینه‌ی آمبولانس در شهر</text>
</svg>
