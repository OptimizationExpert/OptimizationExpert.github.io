<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <text x="450" y="42" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">فیدر توزیع، کلیدهای سکشنالایزر و بخش خطادار</text>

  <!-- substation -->
  <g>
    <rect x="40" y="180" width="60" height="80" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <line x1="55" y1="180" x2="70" y2="150" stroke="#374151" stroke-width="3"/>
    <line x1="85" y1="180" x2="70" y2="150" stroke="#374151" stroke-width="3"/>
    <text x="70" y="280" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">پست</text>
  </g>

  <!-- feeder line -->
  <line x1="100" y1="220" x2="850" y2="220" stroke="#374151" stroke-width="4"/>

  <!-- poles along the way -->
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="180" y1="220" x2="180" y2="260"/>
    <line x1="330" y1="220" x2="330" y2="260"/>
    <line x1="480" y1="220" x2="480" y2="260"/>
    <line x1="630" y1="220" x2="630" y2="260"/>
    <line x1="780" y1="220" x2="780" y2="260"/>
  </g>

  <!-- switches (closed - green diamond) -->
  <g>
    <rect x="170" y="205" width="20" height="30" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="180" y="255" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#047857">کلید ۱</text>

    <!-- open switch near fault, shown as red/open -->
    <rect x="320" y="205" width="20" height="30" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <line x1="322" y1="220" x2="338" y2="205" stroke="#991b1b" stroke-width="3"/>
    <text x="330" y="255" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#991b1b">کلید ۲ (باز)</text>

    <rect x="620" y="205" width="20" height="30" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="630" y="255" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#047857">کلید ۳</text>
  </g>

  <!-- fault icon -->
  <g>
    <polygon points="400,150 415,190 385,190" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <text x="400" y="180" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">!</text>
    <line x1="400" y1="190" x2="400" y2="215" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="400" y="140" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309">خطا</text>
  </g>

  <!-- isolated (de-energized) segment shaded red -->
  <rect x="340" y="205" width="280" height="30" fill="#fecaca" opacity="0.6"/>
  <text x="480" y="200" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">بخش ایزوله‌شده و بی‌برق</text>

  <!-- healthy segments shaded green -->
  <rect x="100" y="205" width="70" height="30" fill="#bbf7d0" opacity="0.6"/>
  <rect x="190" y="205" width="130" height="30" fill="#bbf7d0" opacity="0.6"/>
  <rect x="640" y="205" width="210" height="30" fill="#bbf7d0" opacity="0.6"/>
  <text x="750" y="200" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">مشترکین با برق سالم</text>

  <!-- customer icons -->
  <g fill="#374151">
    <circle cx="140" cy="330" r="10"/>
    <rect x="130" y="340" width="20" height="20"/>
    <circle cx="750" cy="330" r="10"/>
    <rect x="740" y="340" width="20" height="20"/>
    <circle cx="800" cy="330" r="10"/>
    <rect x="790" y="340" width="20" height="20"/>
  </g>
  <g fill="#fca5a5">
    <circle cx="450" cy="330" r="10"/>
    <rect x="440" y="340" width="20" height="20"/>
    <circle cx="500" cy="330" r="10"/>
    <rect x="490" y="340" width="20" height="20"/>
  </g>

  <text x="450" y="400" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="15" fill="#1f2937">مکان بهینه کلید ۲ و ۳، تعداد مشترکین بی‌برق را به کمترین مقدار می‌رساند</text>
</svg>
