<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a5f">جریان بیمار از اورژانس به بخش‌های بیمارستان</text>

  <!-- Emergency Department box -->
  <rect x="30" y="90" width="180" height="300" rx="14" fill="#fff4e6" stroke="#e07b00" stroke-width="3"/>
  <text x="120" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45500">اورژانس</text>

  <!-- Ambulance icon -->
  <g transform="translate(55,140)">
    <rect x="0" y="10" width="60" height="26" rx="4" fill="#e07b00"/>
    <rect x="42" y="0" width="18" height="18" rx="2" fill="#e07b00"/>
    <circle cx="14" cy="38" r="6" fill="#4a4a4a"/>
    <circle cx="50" cy="38" r="6" fill="#4a4a4a"/>
    <rect x="20" y="16" width="12" height="4" fill="#ffffff"/>
    <rect x="24" y="12" width="4" height="12" fill="#ffffff"/>
  </g>

  <!-- Waiting patients (circles = people) -->
  <g fill="#c9761a">
    <circle cx="60" cy="220" r="10"/>
    <circle cx="95" cy="220" r="10"/>
    <circle cx="130" cy="220" r="10"/>
    <circle cx="165" cy="220" r="10"/>
    <circle cx="60" cy="250" r="10"/>
    <circle cx="95" cy="250" r="10"/>
    <circle cx="130" cy="250" r="10"/>
  </g>
  <text x="120" y="290" text-anchor="middle" font-size="14" fill="#7a4400">بیماران در صف پذیرش</text>
  <text x="120" y="340" text-anchor="middle" font-size="14" fill="#7a4400">تصمیم: کدام بیمار،</text>
  <text x="120" y="360" text-anchor="middle" font-size="14" fill="#7a4400">به کدام بخش، کِی؟</text>

  <!-- Arrows from ER to wards -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <line x1="212" y1="160" x2="330" y2="120" stroke="#5a5a5a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="212" y1="240" x2="330" y2="240" stroke="#5a5a5a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="212" y1="320" x2="330" y2="360" stroke="#5a5a5a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ICU ward -->
  <rect x="340" y="60" width="230" height="130" rx="14" fill="#e8f0fb" stroke="#2456a6" stroke-width="3"/>
  <text x="455" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#173c73">ICU</text>
  <text x="455" y="105" text-anchor="middle" font-size="13" fill="#173c73">ظرفیت: ۸ تخت</text>
  <g fill="#2456a6">
    <rect x="360" y="120" width="34" height="18" rx="3"/>
    <rect x="400" y="120" width="34" height="18" rx="3"/>
    <rect x="440" y="120" width="34" height="18" rx="3"/>
    <rect x="480" y="120" width="34" height="18" rx="3"/>
    <rect x="360" y="150" width="34" height="18" rx="3"/>
    <rect x="400" y="150" width="34" height="18" rx="3"/>
    <rect x="440" y="150" width="34" height="18" rx="3" fill="#9fb8dd"/>
    <rect x="480" y="150" width="34" height="18" rx="3" fill="#9fb8dd"/>
  </g>

  <!-- General ward -->
  <rect x="340" y="200" width="230" height="130" rx="14" fill="#e9f7ee" stroke="#1f8a4c" stroke-width="3"/>
  <text x="455" y="225" text-anchor="middle" font-size="17" font-weight="bold" fill="#155c33">بخش عمومی</text>
  <text x="455" y="245" text-anchor="middle" font-size="13" fill="#155c33">ظرفیت: ۲۰ تخت</text>
  <g fill="#1f8a4c">
    <rect x="360" y="260" width="34" height="18" rx="3"/>
    <rect x="400" y="260" width="34" height="18" rx="3"/>
    <rect x="440" y="260" width="34" height="18" rx="3"/>
    <rect x="480" y="260" width="34" height="18" rx="3" fill="#a9dcbc"/>
    <rect x="360" y="290" width="34" height="18" rx="3" fill="#a9dcbc"/>
    <rect x="400" y="290" width="34" height="18" rx="3" fill="#a9dcbc"/>
    <rect x="440" y="290" width="34" height="18" rx="3" fill="#a9dcbc"/>
    <rect x="480" y="290" width="34" height="18" rx="3" fill="#a9dcbc"/>
  </g>

  <!-- Overflow ward -->
  <rect x="340" y="340" width="230" height="110" rx="14" fill="#fdeaea" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="455" y="365" text-anchor="middle" font-size="17" font-weight="bold" fill="#8f271b">بخش سرریز</text>
  <text x="455" y="385" text-anchor="middle" font-size="13" fill="#8f271b">وقتی ظرفیت اصلی پر است</text>
  <g fill="#c0392b">
    <rect x="380" y="400" width="34" height="18" rx="3"/>
    <rect x="420" y="400" width="34" height="18" rx="3"/>
    <rect x="460" y="400" width="34" height="18" rx="3" fill="#f0b3ac"/>
  </g>

  <!-- Right side: optimization brain / dashboard -->
  <rect x="620" y="140" width="240" height="200" rx="16" fill="#f4f2fb" stroke="#5b3fa0" stroke-width="3"/>
  <text x="740" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#402c72">مدل بهینه‌سازی</text>
  <text x="740" y="192" text-anchor="middle" font-size="13" fill="#402c72">تخصیص تخت + کنترل پذیرش</text>

  <!-- simple bar chart inside dashboard -->
  <g>
    <rect x="650" y="290" width="20" height="30" fill="#7a5fc4"/>
    <rect x="680" y="270" width="20" height="50" fill="#7a5fc4"/>
    <rect x="710" y="250" width="20" height="70" fill="#7a5fc4"/>
    <rect x="740" y="260" width="20" height="60" fill="#c0392b"/>
    <rect x="770" y="280" width="20" height="40" fill="#7a5fc4"/>
    <line x1="640" y1="320" x2="800" y2="320" stroke="#402c72" stroke-width="2"/>
  </g>
  <text x="740" y="215" text-anchor="middle" font-size="12" fill="#402c72">پیش‌بینی تقاضا + محدودیت ظرفیت</text>

  <!-- arrows from wards area to dashboard (feedback) -->
  <line x1="580" y1="180" x2="618" y2="200" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="580" y1="330" x2="618" y2="280" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
</svg>
