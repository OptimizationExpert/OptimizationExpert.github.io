<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>

  <!-- Title labels -->
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a5f">مسیریابی-موجودی (Inventory Routing)</text>

  <!-- ===== Top: route map ===== -->
  <g>
    <!-- Depot -->
    <rect x="365" y="70" width="70" height="50" rx="6" fill="#1e88e5"/>
    <text x="400" y="100" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">انبار</text>

    <!-- Customer A -->
    <circle cx="140" cy="230" r="30" fill="#ffffff" stroke="#f57c00" stroke-width="3"/>
    <text x="140" y="235" text-anchor="middle" font-size="12" fill="#f57c00" font-weight="bold">A</text>

    <!-- Customer B -->
    <circle cx="400" cy="270" r="30" fill="#ffffff" stroke="#f57c00" stroke-width="3"/>
    <text x="400" y="275" text-anchor="middle" font-size="12" fill="#f57c00" font-weight="bold">B</text>

    <!-- Customer C -->
    <circle cx="660" cy="230" r="30" fill="#ffffff" stroke="#f57c00" stroke-width="3"/>
    <text x="660" y="235" text-anchor="middle" font-size="12" fill="#f57c00" font-weight="bold">C</text>

    <!-- Route lines -->
    <path d="M 400 120 L 155 205" stroke="#1e88e5" stroke-width="3" fill="none" stroke-dasharray="8,5"/>
    <path d="M 140 260 L 380 268" stroke="#1e88e5" stroke-width="3" fill="none" stroke-dasharray="8,5"/>
    <path d="M 425 260 L 645 210" stroke="#1e88e5" stroke-width="3" fill="none" stroke-dasharray="8,5"/>
    <path d="M 660 200 L 420 120" stroke="#1e88e5" stroke-width="3" fill="none" stroke-dasharray="8,5"/>

    <!-- Truck icon on a route segment -->
    <g transform="translate(255,225)">
      <rect x="0" y="0" width="34" height="18" rx="2" fill="#455a64"/>
      <rect x="30" y="4" width="14" height="14" rx="2" fill="#455a64"/>
      <circle cx="8" cy="20" r="4" fill="#263238"/>
      <circle cx="34" cy="20" r="4" fill="#263238"/>
    </g>
  </g>

  <!-- ===== Bottom: inventory sawtooth chart ===== -->
  <g transform="translate(60,340)">
    <text x="0" y="-15" font-size="14" fill="#1e3a5f" font-weight="bold">سطح موجودی مشتری در طول زمان</text>
    <line x1="0" y1="140" x2="680" y2="140" stroke="#455a64" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#455a64" stroke-width="2"/>

    <!-- capacity dashed line -->
    <line x1="0" y1="15" x2="680" y2="15" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="685" y="19" font-size="11" fill="#9e9e9e">ظرفیت مخزن</text>

    <!-- sawtooth pattern: depletion then delivery -->
    <polyline points="10,25 160,110 160,25 340,120 340,20 520,130 520,15 660,105"
      fill="none" stroke="#f57c00" stroke-width="3"/>

    <!-- delivery markers -->
    <circle cx="160" cy="25" r="5" fill="#1e88e5"/>
    <circle cx="340" cy="20" r="5" fill="#1e88e5"/>
    <circle cx="520" cy="15" r="5" fill="#1e88e5"/>
    <text x="160" y="-2" text-anchor="middle" font-size="10" fill="#1e88e5">تحویل</text>
    <text x="340" y="-2" text-anchor="middle" font-size="10" fill="#1e88e5">تحویل</text>
    <text x="520" y="-2" text-anchor="middle" font-size="10" fill="#1e88e5">تحویل</text>

    <text x="0" y="158" font-size="11" fill="#455a64">روز ۱</text>
    <text x="330" y="158" font-size="11" fill="#455a64">روز ۲</text>
    <text x="650" y="158" font-size="11" fill="#455a64">روز ۳</text>
  </g>
</svg>
