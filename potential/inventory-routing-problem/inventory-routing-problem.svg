<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Depot -->
  <g>
    <rect x="40" y="360" width="120" height="90" rx="6" fill="#1e3a5f"/>
    <polygon points="30,360 100,320 170,360" fill="#16304d"/>
    <rect x="75" y="400" width="30" height="50" fill="#ffffff"/>
    <rect x="60" y="375" width="20" height="20" fill="#dbe7f4"/>
    <rect x="120" y="375" width="20" height="20" fill="#dbe7f4"/>
    <text x="100" y="480" text-anchor="middle" font-size="18" fill="#1e3a5f" font-weight="bold">انبار مرکزی</text>
  </g>

  <!-- Route dashed lines -->
  <path d="M170,400 C260,300 320,340 380,300" fill="none" stroke="#e07a1f" stroke-width="4" stroke-dasharray="10,8"/>
  <path d="M380,300 C460,260 500,320 560,280" fill="none" stroke="#e07a1f" stroke-width="4" stroke-dasharray="10,8"/>
  <path d="M560,280 C630,240 660,330 730,320" fill="none" stroke="#e07a1f" stroke-width="4" stroke-dasharray="10,8"/>

  <!-- Truck on route -->
  <g transform="translate(300,255)">
    <rect x="0" y="20" width="70" height="35" rx="4" fill="#e07a1f"/>
    <rect x="70" y="30" width="30" height="25" rx="3" fill="#f2a44c"/>
    <rect x="76" y="34" width="16" height="10" fill="#dbe7f4"/>
    <circle cx="18" cy="60" r="9" fill="#333"/>
    <circle cx="80" cy="60" r="9" fill="#333"/>
    <circle cx="18" cy="60" r="4" fill="#ccc"/>
    <circle cx="80" cy="60" r="4" fill="#ccc"/>
  </g>

  <!-- Customer tank 1 : nearly full -->
  <g transform="translate(370,150)">
    <rect x="0" y="0" width="60" height="140" rx="10" fill="none" stroke="#1e3a5f" stroke-width="4"/>
    <rect x="4" y="20" width="52" height="116" fill="#3fa66b"/>
    <text x="30" y="-10" text-anchor="middle" font-size="16" fill="#1e3a5f" font-weight="bold">مشتری A</text>
    <text x="30" y="165" text-anchor="middle" font-size="14" fill="#3fa66b">۸۵٪ پر</text>
  </g>

  <!-- Customer tank 2 : medium -->
  <g transform="translate(550,130)">
    <rect x="0" y="0" width="60" height="140" rx="10" fill="none" stroke="#1e3a5f" stroke-width="4"/>
    <rect x="4" y="70" width="52" height="66" fill="#e8b93f"/>
    <text x="30" y="-10" text-anchor="middle" font-size="16" fill="#1e3a5f" font-weight="bold">مشتری B</text>
    <text x="30" y="165" text-anchor="middle" font-size="14" fill="#e8b93f">۴۵٪ پر</text>
  </g>

  <!-- Customer tank 3 : low, needs urgent visit -->
  <g transform="translate(720,170)">
    <rect x="0" y="0" width="60" height="140" rx="10" fill="none" stroke="#c0392b" stroke-width="4"/>
    <rect x="4" y="118" width="52" height="18" fill="#c0392b"/>
    <text x="30" y="-10" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">مشتری C</text>
    <text x="30" y="165" text-anchor="middle" font-size="14" fill="#c0392b">۱۲٪ پر - فوری</text>
  </g>

  <!-- title -->
  <text x="450" y="40" text-anchor="middle" font-size="26" fill="#1e3a5f" font-weight="bold">مسئله مسیریابی-موجودی (IRP)</text>
  <text x="450" y="70" text-anchor="middle" font-size="16" fill="#5a6b7a">کِی سر بزنیم، چقدر پر کنیم، با کدام مسیر؟</text>
</svg>
