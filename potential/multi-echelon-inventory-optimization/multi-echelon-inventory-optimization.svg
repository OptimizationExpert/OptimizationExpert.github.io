<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">شبکه چندسطحی موجودی و توزیع موجودی ایمنی</text>

  <!-- Echelon labels -->
  <text x="90" y="80" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">تأمین‌کننده</text>
  <text x="290" y="80" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">کارخانه</text>
  <text x="530" y="80" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">مراکز توزیع</text>
  <text x="790" y="80" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">فروشگاه‌ها</text>

  <!-- Supplier node -->
  <rect x="50" y="210" width="80" height="60" rx="8" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="2"/>
  <text x="90" y="245" font-family="Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">S</text>
  <!-- small safety stock bar under supplier -->
  <rect x="75" y="280" width="30" height="14" fill="#0ea5e9"/>

  <!-- Factory node -->
  <rect x="250" y="210" width="80" height="60" rx="8" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9" stroke-width="2"/>
  <text x="290" y="245" font-family="Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">F</text>
  <rect x="265" y="280" width="50" height="24" fill="#0ea5e9"/>

  <!-- DC nodes (two) -->
  <rect x="490" y="150" width="80" height="60" rx="8" fill="#f97316" opacity="0.15" stroke="#f97316" stroke-width="2"/>
  <text x="530" y="185" font-family="Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle">DC1</text>
  <rect x="505" y="220" width="50" height="40" fill="#f97316"/>

  <rect x="490" y="270" width="80" height="60" rx="8" fill="#f97316" opacity="0.15" stroke="#f97316" stroke-width="2"/>
  <text x="530" y="305" font-family="Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle">DC2</text>
  <rect x="505" y="340" width="50" height="40" fill="#f97316"/>

  <!-- Retail nodes (four) -->
  <rect x="740" y="100" width="60" height="50" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="130" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">R1</text>
  <rect x="752" y="155" width="36" height="10" fill="#16a34a"/>

  <rect x="740" y="200" width="60" height="50" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="230" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">R2</text>
  <rect x="752" y="255" width="36" height="10" fill="#16a34a"/>

  <rect x="740" y="300" width="60" height="50" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="330" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">R3</text>
  <rect x="752" y="355" width="36" height="10" fill="#16a34a"/>

  <rect x="740" y="400" width="60" height="50" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="430" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">R4</text>
  <rect x="752" y="360" width="0" height="0" fill="#16a34a"/>
  <rect x="752" y="365" width="0" height="0" fill="#16a34a"/>

  <!-- Arrows -->
  <line x1="130" y1="240" x2="248" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="235" x2="488" y2="185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="245" x2="488" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="570" y1="170" x2="738" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="190" x2="738" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="290" x2="738" y2="325" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="310" x2="738" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="450" y="465" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">ارتفاع میله = میزان موجودی ایمنی تخصیص‌یافته به هر گره پس از بهینه‌سازی مشترک</text>
</svg>
