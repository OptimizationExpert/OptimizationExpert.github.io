<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#ffffff"/>

  <!-- Title band -->
  <text x="400" y="34" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="20" font-weight="bold" fill="#7f1d1d">مدیریت موجودی فرآورده‌های خونی</text>

  <!-- Blood bags row, aged by color intensity -->
  <g font-family="Tahoma, Arial, sans-serif">
    <g transform="translate(70,70)">
      <rect x="0" y="0" width="46" height="60" rx="10" fill="#dc2626"/>
      <rect x="16" y="-14" width="14" height="16" rx="3" fill="#991b1b"/>
      <text x="23" y="80" text-anchor="middle" font-size="12" fill="#7f1d1d">روز ۱</text>
    </g>
    <g transform="translate(150,70)">
      <rect x="0" y="0" width="46" height="60" rx="10" fill="#ef4444"/>
      <rect x="16" y="-14" width="14" height="16" rx="3" fill="#b91c1c"/>
      <text x="23" y="80" text-anchor="middle" font-size="12" fill="#7f1d1d">روز ۷</text>
    </g>
    <g transform="translate(230,70)">
      <rect x="0" y="0" width="46" height="60" rx="10" fill="#f87171"/>
      <rect x="16" y="-14" width="14" height="16" rx="3" fill="#dc2626"/>
      <text x="23" y="80" text-anchor="middle" font-size="12" fill="#7f1d1d">روز ۲۰</text>
    </g>
    <g transform="translate(310,70)">
      <rect x="0" y="0" width="46" height="60" rx="10" fill="#fca5a5"/>
      <rect x="16" y="-14" width="14" height="16" rx="3" fill="#f87171"/>
      <text x="23" y="80" text-anchor="middle" font-size="12" fill="#7f1d1d">روز ۳۵</text>
    </g>
    <g transform="translate(390,70)">
      <rect x="0" y="0" width="46" height="60" rx="10" fill="#fecaca"/>
      <rect x="16" y="-14" width="14" height="16" rx="3" fill="#fca5a5"/>
      <text x="23" y="80" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">روز ۴۲ (انقضا)</text>
    </g>

    <!-- FIFO arrow -->
    <line x1="60" y1="30" x2="440" y2="30" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="250" y="20" text-anchor="middle" font-size="13" fill="#7f1d1d">ترتیب مصرف FIFO: قدیمی‌ترین کیسه اول</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <!-- Inventory level chart -->
  <g font-family="Tahoma, Arial, sans-serif">
    <text x="400" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">سطح موجودی روزانه در طول افق برنامه‌ریزی</text>

    <!-- axes -->
    <line x1="80" y1="410" x2="720" y2="410" stroke="#374151" stroke-width="2"/>
    <line x1="80" y1="230" x2="80" y2="410" stroke="#374151" stroke-width="2"/>
    <text x="60" y="235" text-anchor="end" font-size="12" fill="#374151">موجودی</text>
    <text x="720" y="430" text-anchor="end" font-size="12" fill="#374151">زمان (روز)</text>

    <!-- inventory sawtooth pattern (replenish then deplete) -->
    <polyline points="80,320 130,260 180,300 230,340 280,270 330,310 380,350 430,280 480,320 530,360 580,290 630,330 680,370"
              fill="none" stroke="#2563eb" stroke-width="3"/>

    <!-- reorder threshold line -->
    <line x1="80" y1="370" x2="680" y2="370" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="690" y="374" font-size="12" fill="#b45309">حداقل موجودی ایمنی</text>

    <!-- expiry waste markers -->
    <circle cx="230" cy="340" r="6" fill="#7f1d1d"/>
    <circle cx="430" cy="280" r="6" fill="#7f1d1d"/>
    <circle cx="630" cy="330" r="6" fill="#7f1d1d"/>
    <text x="230" y="360" text-anchor="middle" font-size="11" fill="#7f1d1d">دورریز</text>

    <!-- demand spike / shortage marker -->
    <circle cx="380" cy="350" r="6" fill="#16a34a"/>
    <text x="380" y="405" text-anchor="middle" font-size="11" fill="#166534">اورژانس</text>
  </g>

  <!-- legend -->
  <g font-family="Tahoma, Arial, sans-serif" font-size="12">
    <rect x="80" y="450" width="14" height="14" fill="#2563eb"/>
    <text x="100" y="461" fill="#374151">موجودی روزانه</text>
    <circle cx="230" cy="457" r="6" fill="#7f1d1d"/>
    <text x="245" y="461" fill="#374151">کیسه دورریخته‌شده</text>
    <circle cx="410" cy="457" r="6" fill="#16a34a"/>
    <text x="425" y="461" fill="#374151">مصرف اورژانسی</text>
  </g>
</svg>
