<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- Simple price curve -->
  <polyline points="30,220 70,200 110,150 150,100 190,150 230,200 270,220"
    fill="none" stroke="#f97316" stroke-width="4"/>

  <!-- Peak load bar (red) under the curve peak -->
  <rect x="135" y="150" width="30" height="90" fill="#fca5a5"/>

  <!-- Shifted load bar (green) to the left, off-peak -->
  <rect x="55" y="200" width="30" height="40" fill="#86efac"/>

  <!-- Arrow from peak to off-peak -->
  <path d="M 140 140 C 110 100, 90 100, 75 190" fill="none" stroke="#1e3a5f" stroke-width="4" marker-end="url(#arrowmini)"/>
  <defs>
    <marker id="arrowmini" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e3a5f"/>
    </marker>
  </defs>

  <line x1="20" y1="245" x2="280" y2="245" stroke="#333333" stroke-width="2"/>
</svg>
