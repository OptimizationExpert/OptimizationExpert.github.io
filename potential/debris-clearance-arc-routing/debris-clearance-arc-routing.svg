<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- sky/ground line -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#cbd5e1" stroke-width="2"/>

  <!-- damaged building left -->
  <rect x="30" y="230" width="150" height="190" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="30,230 90,150 180,230" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
  <rect x="60" y="270" width="30" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="120" y="270" width="30" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- crack on building -->
  <polyline points="90,150 100,200 80,240 100,280" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- collapsed section of building (rubble source) -->
  <polygon points="150,420 210,340 260,420" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <polygon points="190,420 240,360 300,420" fill="#b0bcc9" stroke="#64748b" stroke-width="2"/>
  <polygon points="230,420 270,370 330,420" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>

  <!-- small rubble pieces scattered on street -->
  <rect x="340" y="400" width="24" height="20" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" transform="rotate(12 352 410)"/>
  <rect x="380" y="405" width="20" height="18" fill="#b0bcc9" stroke="#64748b" stroke-width="1.5" transform="rotate(-8 390 414)"/>
  <rect x="410" y="398" width="26" height="22" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" transform="rotate(20 423 409)"/>

  <!-- road closed sign -->
  <line x1="470" y1="330" x2="470" y2="420" stroke="#475569" stroke-width="5"/>
  <rect x="440" y="290" width="60" height="42" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="470" y="317" font-family="Vazirmatn" font-size="14" fill="#dc2626" text-anchor="middle">مسدود</text>

  <!-- excavator / debris clearing truck -->
  <g>
    <rect x="530" y="360" width="130" height="55" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
    <rect x="545" y="330" width="60" height="35" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="3"/>
    <rect x="552" y="338" width="22" height="18" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="555" cy="418" r="16" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <circle cx="635" cy="418" r="16" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <!-- articulated arm -->
    <polyline points="605,355 660,320 700,345" fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
    <polygon points="695,335 730,340 725,360 690,358" fill="#fcd34d" stroke="#b45309" stroke-width="3"/>
  </g>

  <!-- clear street to hospital on right -->
  <rect x="700" y="380" width="70" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <rect x="720" y="365" width="14" height="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <line x1="726" y1="360" x2="726" y2="375" stroke="#dc2626" stroke-width="3"/>
  <line x1="718" y1="367" x2="734" y2="367" stroke="#dc2626" stroke-width="3"/>

  <!-- dashed road centerline -->
  <line x1="0" y1="440" x2="800" y2="440" stroke="#94a3b8" stroke-width="3" stroke-dasharray="14,10"/>

  <!-- route arrow from truck toward hospital -->
  <path d="M 660 300 C 700 270, 740 270, 770 300" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- labels -->
  <text x="240" y="120" font-family="Vazirmatn" font-size="20" fill="#1e293b" text-anchor="middle">خیابان مسدود با آوار</text>
  <text x="595" y="300" font-family="Vazirmatn" font-size="18" fill="#92400e" text-anchor="middle">کامیون پاکسازی</text>
  <text x="735" y="345" font-family="Vazirmatn" font-size="16" fill="#166534" text-anchor="middle">بیمارستان</text>
  <text x="715" y="255" font-family="Vazirmatn" font-size="16" fill="#1d4ed8" text-anchor="middle">مسیر پس از پاکسازی</text>
  <text x="230" y="460" font-family="Vazirmatn" font-size="16" fill="#475569" text-anchor="middle">مشتری = خود خیابان، نه یک نقطه</text>
</svg>
