<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- simple street grid graph -->
  <g stroke="#94a3b8" stroke-width="6">
    <line x1="300" y1="200" x2="300" y2="700"/>
    <line x1="650" y1="200" x2="650" y2="700"/>
    <line x1="1000" y1="200" x2="1000" y2="700"/>
    <line x1="1300" y1="200" x2="1300" y2="700"/>
    <line x1="200" y1="300" x2="1400" y2="300"/>
    <line x1="200" y1="500" x2="1400" y2="500"/>
    <line x1="200" y1="650" x2="1400" y2="650"/>
  </g>

  <!-- blocked edges highlighted in red (debris) -->
  <line x1="300" y1="300" x2="650" y2="300" stroke="#dc2626" stroke-width="10"/>
  <line x1="650" y1="500" x2="1000" y2="500" stroke="#dc2626" stroke-width="10"/>
  <line x1="1000" y1="300" x2="1000" y2="500" stroke="#dc2626" stroke-width="10"/>

  <!-- cleared route highlighted in blue -->
  <line x1="300" y1="500" x2="650" y2="500" stroke="#2563eb" stroke-width="8" stroke-dasharray="16,12"/>
  <line x1="650" y1="500" x2="650" y2="650" stroke="#2563eb" stroke-width="8" stroke-dasharray="16,12"/>
  <line x1="650" y1="650" x2="1300" y2="650" stroke="#2563eb" stroke-width="8" stroke-dasharray="16,12"/>
  <line x1="1300" y1="650" x2="1300" y2="500" stroke="#2563eb" stroke-width="8" stroke-dasharray="16,12"/>

  <!-- intersections -->
  <g fill="#1e293b">
    <circle cx="300" cy="300" r="9"/>
    <circle cx="650" cy="300" r="9"/>
    <circle cx="1000" cy="300" r="9"/>
    <circle cx="1300" cy="300" r="9"/>
    <circle cx="300" cy="500" r="9"/>
    <circle cx="650" cy="500" r="9"/>
    <circle cx="1000" cy="500" r="9"/>
    <circle cx="1300" cy="500" r="9"/>
    <circle cx="300" cy="650" r="9"/>
    <circle cx="650" cy="650" r="9"/>
    <circle cx="1000" cy="650" r="9"/>
    <circle cx="1300" cy="650" r="9"/>
  </g>

  <!-- depot marker -->
  <rect x="270" y="620" width="60" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <text x="300" y="660" font-family="Vazirmatn" font-size="18" fill="#92400e" text-anchor="middle">پایگاه</text>

  <!-- hospital marker -->
  <rect x="1270" y="470" width="60" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="1300" y="510" font-family="Vazirmatn" font-size="18" fill="#166534" text-anchor="middle">مقصد</text>

  <!-- legend -->
  <line x1="200" y1="150" x2="260" y2="150" stroke="#dc2626" stroke-width="10"/>
  <text x="270" y="157" font-family="Vazirmatn" font-size="24" fill="#1e293b" text-anchor="start">یال مسدود (نیازمند پاکسازی)</text>

  <line x1="720" y1="150" x2="780" y2="150" stroke="#2563eb" stroke-width="8" stroke-dasharray="16,12"/>
  <text x="790" y="157" font-family="Vazirmatn" font-size="24" fill="#1e293b" text-anchor="start">مسیر انتخابی ماشین پاکسازی</text>
</svg>
