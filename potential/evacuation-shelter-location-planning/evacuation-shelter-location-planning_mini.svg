<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="320" height="180" fill="#ffffff"/>

  <!-- danger house, small -->
  <g transform="translate(70,58)">
    <polygon points="0,20 16,8 32,20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="4" y="20" width="24" height="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- arrow -->
  <line x1="118" y1="76" x2="178" y2="76" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  <polygon points="178,67 196,76 178,85" fill="#f97316"/>

  <!-- shelter, small -->
  <g transform="translate(210,48)">
    <rect x="0" y="24" width="46" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="0,24 23,8 46,24" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="16" y="38" width="14" height="20" fill="#4ade80" stroke="#166534" stroke-width="1.2"/>
    <line x1="23" y1="8" x2="23" y2="-6" stroke="#166534" stroke-width="1.8"/>
    <polygon points="23,-6 36,-2 23,2" fill="#22c55e"/>
  </g>

  <text x="160" y="150" font-family="Vazirmatn" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">تخلیه اضطراری</text>
</svg>
