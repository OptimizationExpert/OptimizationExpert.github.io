<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="90" font-family="Vazirmatn" font-size="32" font-weight="bold" fill="#0f172a" text-anchor="middle">تخصیص جمعیت به پناهگاه: بدون بهینه‌سازی و با آن</text>

  <line x1="800" y1="150" x2="800" y2="800" stroke="#e2e8f0" stroke-width="3"/>

  <!-- LEFT: unoptimized -->
  <text x="400" y="190" font-family="Vazirmatn" font-size="24" font-weight="bold" fill="#334155" text-anchor="middle">بدون بهینه‌سازی</text>
  <text x="400" y="222" font-family="Vazirmatn" font-size="18" fill="#64748b" text-anchor="middle">همه به‌سمت نزدیک‌ترین پناهگاه</text>

  <!-- three zones on left -->
  <g transform="translate(190,280)">
    <polygon points="0,20 16,8 32,20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="4" y="20" width="24" height="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <g transform="translate(190,380)">
    <polygon points="0,20 16,8 32,20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="4" y="20" width="24" height="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <g transform="translate(190,480)">
    <polygon points="0,20 16,8 32,20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="4" y="20" width="24" height="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- arrows all converging to shelter A -->
  <line x1="240" y1="296" x2="470" y2="420" stroke="#f97316" stroke-width="5"/>
  <line x1="240" y1="396" x2="470" y2="424" stroke="#f97316" stroke-width="5"/>
  <line x1="240" y1="496" x2="470" y2="428" stroke="#f97316" stroke-width="5"/>
  <polygon points="470,410 500,424 470,438" fill="#f97316"/>

  <!-- overloaded shelter A -->
  <g transform="translate(520,370)">
    <rect x="0" y="34" width="110" height="80" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <polygon points="0,34 55,4 110,34" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
    <text x="55" y="86" font-family="Vazirmatn" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">پناهگاه پر</text>
  </g>
  <text x="575" y="480" font-family="Vazirmatn" font-size="16" fill="#b91c1c" text-anchor="middle">ظرفیت رد شد، صف طولانی</text>

  <!-- empty shelter B far away -->
  <g transform="translate(680,560)">
    <rect x="0" y="24" width="70" height="50" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="0,24 35,4 70,24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4,4"/>
    <text x="35" y="105" font-family="Vazirmatn" font-size="14" fill="#64748b" text-anchor="middle">پناهگاه خالی مانده</text>
  </g>

  <!-- congested road -->
  <rect x="200" y="660" width="420" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="220" y="648" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <rect x="252" y="648" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <rect x="284" y="648" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <rect x="316" y="648" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <rect x="348" y="648" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <text x="410" y="720" font-family="Vazirmatn" font-size="17" fill="#b91c1c" text-anchor="middle">ترافیک سنگین روی یک مسیر</text>

  <!-- RIGHT: optimized -->
  <text x="1200" y="190" font-family="Vazirmatn" font-size="24" font-weight="bold" fill="#334155" text-anchor="middle">با بهینه‌سازی</text>
  <text x="1200" y="222" font-family="Vazirmatn" font-size="18" fill="#64748b" text-anchor="middle">تخصیص متوازن بر اساس ظرفیت و زمان</text>

  <g transform="translate(990,280)">
    <polygon points="0,20 16,8 32,20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="4" y="20" width="24" height="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <g transform="translate(990,380)">
    <polygon points="0,20 16,8 32,20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="4" y="20" width="24" height="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <g transform="translate(990,480)">
    <polygon points="0,20 16,8 32,20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="4" y="20" width="24" height="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <!-- balanced arrows: split to two shelters -->
  <line x1="1040" y1="296" x2="1230" y2="370" stroke="#16a34a" stroke-width="5"/>
  <line x1="1040" y1="396" x2="1230" y2="390" stroke="#16a34a" stroke-width="5"/>
  <line x1="1040" y1="496" x2="1310" y2="560" stroke="#16a34a" stroke-width="5"/>
  <polygon points="1222,360 1252,378 1224,392" fill="#16a34a"/>
  <polygon points="1300,548 1332,562 1302,578" fill="#16a34a"/>

  <!-- shelter A balanced -->
  <g transform="translate(1250,340)">
    <rect x="0" y="30" width="95" height="65" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <polygon points="0,30 47,4 95,30" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <text x="47" y="72" font-family="Vazirmatn" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">پناهگاه ۱</text>
  </g>

  <!-- shelter B used too -->
  <g transform="translate(1330,540)">
    <rect x="0" y="26" width="85" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <polygon points="0,26 42,2 85,26" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <text x="42" y="64" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">پناهگاه ۲</text>
  </g>

  <!-- smooth road -->
  <rect x="1000" y="700" width="420" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="1030" y="688" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <rect x="1120" y="688" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <rect x="1210" y="688" width="24" height="16" rx="3" fill="#fbbf24" stroke="#b45309"/>
  <text x="1210" y="758" font-family="Vazirmatn" font-size="17" fill="#166534" text-anchor="middle">خودروها زیر ظرفیت جاده</text>

  <rect x="380" y="810" width="840" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="800" y="847" font-family="Vazirmatn" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">همان جمعیت، همان پناهگاه‌ها، تخصیص متفاوت</text>
</svg>
