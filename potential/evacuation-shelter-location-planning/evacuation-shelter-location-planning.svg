<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="34" font-family="Vazirmatn" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">تخلیه اضطراری: کدام پناهگاه، برای کدام محله؟</text>

  <!-- danger zone cloud + waves -->
  <g transform="translate(60,70)">
    <ellipse cx="45" cy="20" rx="46" ry="20" fill="#cbd5e1"/>
    <ellipse cx="20" cy="26" rx="30" ry="16" fill="#cbd5e1"/>
    <ellipse cx="75" cy="26" rx="30" ry="16" fill="#cbd5e1"/>
    <path d="M -10 70 q 15 -14 30 0 q 15 14 30 0 q 15 -14 30 0 q 15 14 30 0" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
    <path d="M -10 92 q 15 -14 30 0 q 15 14 30 0 q 15 -14 30 0 q 15 14 30 0" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- warning triangle -->
  <g transform="translate(95,150)">
    <polygon points="30,0 60,54 0,54" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="30" y="42" font-family="Vazirmatn" font-size="26" font-weight="bold" fill="#dc2626" text-anchor="middle">!</text>
  </g>

  <!-- houses in danger zone -->
  <g transform="translate(35,215)">
    <polygon points="0,30 25,8 50,30" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="6" y="30" width="38" height="34" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <g transform="translate(95,225)">
    <polygon points="0,26 22,6 44,26" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="5" y="26" width="34" height="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <text x="90" y="285" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">محله در معرض خطر</text>

  <!-- evacuation arrow -->
  <g>
    <line x1="185" y1="250" x2="330" y2="250" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
    <polygon points="330,235 360,250 330,265" fill="#f97316"/>
  </g>
  <text x="255" y="228" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">مسیر تخلیه</text>

  <!-- clock icon above arrow -->
  <g transform="translate(255,175)">
    <circle cx="0" cy="0" r="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-13" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="9" y2="4" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="255" y="140" font-family="Vazirmatn" font-size="12" fill="#9a3412" text-anchor="middle">زمان محدود</text>

  <!-- road with capacity limit -->
  <rect x="370" y="310" width="230" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="370" y1="323" x2="600" y2="323" stroke="#ffffff" stroke-width="3" stroke-dasharray="10,8"/>
  <rect x="395" y="300" width="26" height="18" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <rect x="440" y="300" width="26" height="18" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <rect x="485" y="300" width="26" height="18" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <text x="485" y="352" font-family="Vazirmatn" font-size="12" fill="#475569" text-anchor="middle">ظرفیت جاده محدود</text>

  <!-- shelter building -->
  <g transform="translate(650,190)">
    <rect x="0" y="40" width="110" height="90" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <polygon points="0,40 55,8 110,40" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <rect x="16" y="60" width="20" height="20" fill="#86efac" stroke="#166534" stroke-width="1.5"/>
    <rect x="46" y="60" width="20" height="20" fill="#86efac" stroke="#166534" stroke-width="1.5"/>
    <rect x="76" y="60" width="20" height="20" fill="#86efac" stroke="#166534" stroke-width="1.5"/>
    <rect x="40" y="95" width="30" height="35" fill="#4ade80" stroke="#166534" stroke-width="1.5"/>
    <!-- flag -->
    <line x1="55" y1="8" x2="55" y2="-18" stroke="#166534" stroke-width="2.5"/>
    <polygon points="55,-18 80,-11 55,-4" fill="#22c55e"/>
  </g>
  <text x="705" y="345" font-family="Vazirmatn" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">پناهگاه امن</text>

  <!-- capacity gauge for shelter -->
  <g transform="translate(705,150)">
    <rect x="-45" y="-9" width="90" height="18" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="-42" y="-6" width="60" height="12" rx="6" fill="#4ade80"/>
    <text x="0" y="26" font-family="Vazirmatn" font-size="11" fill="#166534" text-anchor="middle">ظرفیت پناهگاه</text>
  </g>

  <rect x="140" y="390" width="520" height="42" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="416" font-family="Vazirmatn" font-size="14" font-weight="bold" fill="#9a3412" text-anchor="middle">کدام پناهگاه باز شود، چه کسی کجا برود؟</text>
</svg>
