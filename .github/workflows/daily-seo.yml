name: Daily SEO Opportunity Report

on:
  schedule:
    - cron: "10 9 * * *"
      timezone: "Europe/Dublin"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-seo-opportunity-report
  cancel-in-progress: false

jobs:
  run-seo-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Resend configuration
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          EMAIL_TO: optimizationteamonline@gmail.com
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "ERROR: GitHub secret RESEND_API_KEY is missing or unavailable."
            exit 1
          fi
          if [[ "$RESEND_API_KEY" != re_* ]]; then
            echo "ERROR: RESEND_API_KEY does not start with re_."
            exit 1
          fi
          echo "Resend API key is available."
          echo "Recipient: $EMAIL_TO"
          if [ -z "${RESEND_FROM:-}" ]; then
            echo "Sender: Optimization Expert <onboarding@resend.dev> (test sender)"
            echo "IMPORTANT: this sender can deliver only to the email address used for the Resend account."
          else
            echo "Sender variable RESEND_FROM is configured."
          fi

      - name: Run SEO bot and require successful email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          EMAIL_TO: optimizationteamonline@gmail.com
          REQUIRE_EMAIL_SUCCESS: "1"
        run: |
          python seo_opportunity_bot_v5_1.py --output-base "$GITHUB_WORKSPACE" --no-open

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-opportunity-report-${{ github.run_id }}
          path: seo_opportunity_output/
          if-no-files-found: warn
          retention-days: 30
