name: Daily SEO Opportunity Report

on:
  schedule:
    - cron: "10 9 * * *"
      timezone: "Europe/Dublin"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-seo-opportunity-report
  cancel-in-progress: false

jobs:
  run-seo-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SEO bot and send report with Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          EMAIL_TO: optimizationteamonline@gmail.com
        run: |
          python seo_opportunity_bot_v5.py --output-base "$GITHUB_WORKSPACE" --no-open

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-opportunity-report-${{ github.run_id }}
          path: seo_opportunity_output/
          if-no-files-found: warn
          retention-days: 30
