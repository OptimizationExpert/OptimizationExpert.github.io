name: Daily SEO Opportunity Bot

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 08:10 UTC = 09:10 Ireland during summer time.
    # GitHub cron uses UTC.
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SEO bot
        run: |
          python seo_opportunity_bot_v3.py \
            --output-base "$GITHUB_WORKSPACE" \
            --no-open

      - name: Add report to workflow summary
        if: always()
        run: |
          echo "# Daily SEO Opportunity Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated at: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          REPORT="seo_opportunity_output/opportunity_report_latest.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report file was not generated. Check the Run SEO bot log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-opportunity-report-${{ github.run_number }}
          path: seo_opportunity_output/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit updated reports
        run: |
          git config user.name "optimization-seo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seo_opportunity_output/
          git commit -m "Daily SEO opportunity update" || echo "No changes to commit"
          git push
