name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'seo_opportunity_output/**'
      - 'seo_demand_output/**'
  workflow_dispatch:
    inputs:
      indexnow_full:
        description: "IndexNow: submit every URL in the sitemap (use once after setup)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Astro website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow (Bing and partners) which pages changed, after they are live.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Notify IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FULL: ${{ inputs.indexnow_full && '1' || '0' }}
        run: node scripts/indexnow.mjs
