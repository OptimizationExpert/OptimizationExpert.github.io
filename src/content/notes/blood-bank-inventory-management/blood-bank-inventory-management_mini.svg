<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- blood bag -->
  <g transform="translate(66,20)">
    <rect x="0" y="0" width="68" height="86" rx="14" fill="#dc2626"/>
    <rect x="24" y="-14" width="20" height="18" rx="4" fill="#991b1b"/>
  </g>

  <!-- simple bar chart representing inventory level -->
  <g>
    <rect x="30" y="150" width="18" height="30" fill="#2563eb"/>
    <rect x="55" y="130" width="18" height="50" fill="#2563eb"/>
    <rect x="80" y="160" width="18" height="20" fill="#f59e0b"/>
    <rect x="105" y="120" width="18" height="60" fill="#2563eb"/>
    <rect x="130" y="140" width="18" height="40" fill="#2563eb"/>
    <rect x="155" y="165" width="18" height="15" fill="#7f1d1d"/>
  </g>

  <line x1="20" y1="180" x2="180" y2="180" stroke="#374151" stroke-width="2"/>
</svg>
