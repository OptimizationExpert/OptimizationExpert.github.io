<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- left node (a hospital / source) -->
  <circle cx="34" cy="100" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>

  <!-- right node (another hospital / destination) -->
  <circle cx="166" cy="100" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>

  <!-- transfer path between the two nodes -->
  <line x1="52" y1="100" x2="148" y2="100" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- central blood drop, the transferred unit -->
  <path d="M100,58 C114,80 124,94 124,108 A24,24 0 1 1 76,108 C76,94 86,80 100,58 Z"
        fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <path d="M91,108 a9,9 0 1 0 18,0" fill="#f87171" opacity="0.6"/>

  <!-- transfer arrows either side of the drop -->
  <path d="M60,100 L74,100" stroke="#2563eb" stroke-width="3" marker-end="url(#miniArrow)"/>
  <path d="M140,100 L126,100" stroke="#2563eb" stroke-width="3" marker-end="url(#miniArrow)"/>

  <defs>
    <marker id="miniArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
