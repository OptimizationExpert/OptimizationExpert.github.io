<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Depot building -->
  <g>
    <rect x="40" y="360" width="140" height="120" rx="6" fill="#e6f2ff" stroke="#1e6fbf" stroke-width="3"/>
    <rect x="70" y="410" width="35" height="70" fill="#1e6fbf"/>
    <rect x="130" y="400" width="30" height="30" fill="#1e6fbf"/>
    <text x="110" y="340" font-size="20" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#1e3a5f" text-anchor="middle" font-weight="bold">انبار مرکزی واکسن</text>
    <!-- snowflake on building -->
    <g stroke="#1e6fbf" stroke-width="2">
      <line x1="150" y1="380" x2="150" y2="400"/>
      <line x1="140" y1="390" x2="160" y2="390"/>
      <line x1="143" y1="383" x2="157" y2="397"/>
      <line x1="157" y1="383" x2="143" y2="397"/>
    </g>
  </g>

  <!-- Route dashed line -->
  <path d="M 180 420 C 320 320, 380 280, 470 260" fill="none" stroke="#2fa3a3" stroke-width="4" stroke-dasharray="10,8"/>
  <path d="M 470 260 C 560 240, 620 300, 700 330" fill="none" stroke="#2fa3a3" stroke-width="4" stroke-dasharray="10,8"/>
  <path d="M 700 330 C 760 350, 800 380, 830 420" fill="none" stroke="#2fa3a3" stroke-width="4" stroke-dasharray="10,8"/>

  <!-- Refrigerated truck on route -->
  <g transform="translate(380,225)">
    <rect x="0" y="0" width="90" height="45" rx="4" fill="#ffffff" stroke="#1e6fbf" stroke-width="3"/>
    <rect x="90" y="10" width="30" height="35" rx="3" fill="#1e6fbf"/>
    <circle cx="22" cy="50" r="9" fill="#1e3a5f"/>
    <circle cx="78" cy="50" r="9" fill="#1e3a5f"/>
    <circle cx="100" cy="50" r="9" fill="#1e3a5f"/>
    <!-- snowflake on truck body -->
    <g stroke="#2fa3a3" stroke-width="2" transform="translate(45,20)">
      <line x1="0" y1="-10" x2="0" y2="10"/>
      <line x1="-10" y1="0" x2="10" y2="0"/>
      <line x1="-7" y1="-7" x2="7" y2="7"/>
      <line x1="7" y1="-7" x2="-7" y2="7"/>
    </g>
    <text x="45" y="-12" font-size="15" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#1e3a5f" text-anchor="middle" font-weight="bold">کامیون زنجیره سرد</text>
  </g>

  <!-- Clinic 1 -->
  <g transform="translate(440,140)">
    <rect x="0" y="0" width="90" height="70" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="3"/>
    <rect x="35" y="15" width="20" height="40" fill="#c0392b"/>
    <rect x="20" y="30" width="50" height="10" fill="#c0392b"/>
    <text x="45" y="-10" font-size="16" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#1e3a5f" text-anchor="middle" font-weight="bold">کلینیک ۱</text>
    <!-- risk gauge -->
    <rect x="0" y="80" width="90" height="12" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1"/>
    <rect x="0" y="80" width="35" height="12" rx="4" fill="#2fa3a3"/>
    <text x="45" y="105" font-size="12" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#555" text-anchor="middle">ریسک دمایی: کم</text>
  </g>

  <!-- Clinic 2 -->
  <g transform="translate(660,270)">
    <rect x="0" y="0" width="90" height="70" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="3"/>
    <rect x="35" y="15" width="20" height="40" fill="#c0392b"/>
    <rect x="20" y="30" width="50" height="10" fill="#c0392b"/>
    <text x="45" y="-10" font-size="16" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#1e3a5f" text-anchor="middle" font-weight="bold">کلینیک ۲</text>
    <rect x="0" y="80" width="90" height="12" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1"/>
    <rect x="0" y="80" width="60" height="12" rx="4" fill="#e0a020"/>
    <text x="45" y="105" font-size="12" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#555" text-anchor="middle">ریسک دمایی: متوسط</text>
  </g>

  <!-- Clinic 3 -->
  <g transform="translate(790,420)">
    <rect x="0" y="0" width="90" height="70" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="3"/>
    <rect x="35" y="15" width="20" height="40" fill="#c0392b"/>
    <rect x="20" y="30" width="50" height="10" fill="#c0392b"/>
    <text x="45" y="-10" font-size="16" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#1e3a5f" text-anchor="middle" font-weight="bold">کلینیک ۳</text>
    <rect x="0" y="80" width="90" height="12" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1"/>
    <rect x="0" y="80" width="85" height="12" rx="4" fill="#c0392b"/>
    <text x="45" y="105" font-size="12" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#555" text-anchor="middle">ریسک دمایی: نزدیک سقف</text>
  </g>

  <!-- vaccine box icon near depot -->
  <g transform="translate(190,470)">
    <rect x="0" y="0" width="50" height="40" rx="4" fill="#ffffff" stroke="#2fa3a3" stroke-width="3"/>
    <line x1="0" y1="20" x2="50" y2="20" stroke="#2fa3a3" stroke-width="2"/>
    <line x1="25" y1="0" x2="25" y2="40" stroke="#2fa3a3" stroke-width="2"/>
    <rect x="18" y="8" width="14" height="4" fill="#c0392b"/>
    <rect x="23" y="3" width="4" height="14" fill="#c0392b"/>
    <text x="25" y="-8" font-size="13" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#1e3a5f" text-anchor="middle">جعبه واکسن</text>
  </g>

  <text x="450" y="40" font-size="24" font-family="Vazirmatn, Tahoma, Arial, sans-serif" fill="#1e3a5f" text-anchor="middle" font-weight="bold">مسیریابی زنجیره سرد و تجمع ریسک دمایی</text>
</svg>
