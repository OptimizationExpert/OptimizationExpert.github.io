<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- route: ground - rise - flight - descend - ground -->
  <g fill="none" stroke-linecap="round">
    <path d="M 128 330 L 255 330" stroke="#2563eb" stroke-width="4" stroke-dasharray="9,6"/>
    <path d="M 255 330 L 335 205" stroke="#2563eb" stroke-width="4" stroke-dasharray="9,6"/>
    <path d="M 335 205 L 465 205" stroke="#ea580c" stroke-width="4" stroke-dasharray="9,6"/>
    <path d="M 465 205 L 545 330" stroke="#16a34a" stroke-width="4" stroke-dasharray="9,6"/>
    <path d="M 545 330 L 672 330" stroke="#16a34a" stroke-width="4" stroke-dasharray="9,6"/>
  </g>

  <!-- helipad markers -->
  <g>
    <circle cx="300" cy="268" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="273" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold" font-family="Vazirmatn">H</text>
    <circle cx="500" cy="268" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="273" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="bold" font-family="Vazirmatn">H</text>
  </g>

  <!-- donor hospital -->
  <g transform="translate(100,330)">
    <rect x="-52" y="-78" width="104" height="78" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="-40" y="-64" width="18" height="18" fill="#dbeafe"/>
    <rect x="-9" y="-64" width="18" height="18" fill="#dbeafe"/>
    <rect x="22" y="-64" width="18" height="18" fill="#dbeafe"/>
    <rect x="-40" y="-36" width="18" height="18" fill="#dbeafe"/>
    <rect x="22" y="-36" width="18" height="18" fill="#dbeafe"/>
    <rect x="-16" y="-30" width="32" height="30" fill="#2563eb"/>
    <rect x="-24" y="-56" width="48" height="16" fill="#dc2626"/>
    <rect x="-5" y="-62" width="10" height="28" fill="#ffffff"/>
    <rect x="-18" y="-49" width="36" height="10" fill="#ffffff"/>
    <text x="0" y="30" text-anchor="middle" font-size="17" fill="#1e293b" font-weight="bold" font-family="Vazirmatn">بیمارستان اهداکننده</text>
  </g>

  <!-- ambulance 1 -->
  <g transform="translate(192,325)">
    <rect x="-26" y="-16" width="52" height="27" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="4" y="-16" width="22" height="27" rx="3" fill="#2563eb"/>
    <circle cx="-14" cy="12" r="6" fill="#1e293b"/>
    <circle cx="12" cy="12" r="6" fill="#1e293b"/>
    <rect x="-10" y="-9" width="14" height="6" fill="#dc2626"/>
    <rect x="-6" y="-12" width="6" height="13" fill="#dc2626"/>
  </g>

  <!-- helicopter mid-flight -->
  <g transform="translate(400,185)">
    <line x1="-46" y1="-22" x2="46" y2="-22" stroke="#334155" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="34" ry="14" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
    <rect x="30" y="-5" width="30" height="8" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
    <line x1="58" y1="-14" x2="58" y2="2" stroke="#334155" stroke-width="2.5"/>
    <line x1="-16" y1="13" x2="-24" y2="26" stroke="#334155" stroke-width="3"/>
    <line x1="16" y1="13" x2="24" y2="26" stroke="#334155" stroke-width="3"/>
    <line x1="-24" y1="26" x2="24" y2="26" stroke="#334155" stroke-width="3"/>
    <rect x="-9" y="-6" width="20" height="8" fill="#fed7aa"/>
  </g>

  <!-- ambulance 2 -->
  <g transform="translate(608,325)">
    <rect x="-26" y="-16" width="52" height="27" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="4" y="-16" width="22" height="27" rx="3" fill="#16a34a"/>
    <circle cx="-14" cy="12" r="6" fill="#1e293b"/>
    <circle cx="12" cy="12" r="6" fill="#1e293b"/>
    <rect x="-10" y="-9" width="14" height="6" fill="#dc2626"/>
    <rect x="-6" y="-12" width="6" height="13" fill="#dc2626"/>
  </g>

  <!-- recipient hospital -->
  <g transform="translate(700,330)">
    <rect x="-52" y="-78" width="104" height="78" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <rect x="-40" y="-64" width="18" height="18" fill="#dcfce7"/>
    <rect x="-9" y="-64" width="18" height="18" fill="#dcfce7"/>
    <rect x="22" y="-64" width="18" height="18" fill="#dcfce7"/>
    <rect x="-40" y="-36" width="18" height="18" fill="#dcfce7"/>
    <rect x="22" y="-36" width="18" height="18" fill="#dcfce7"/>
    <rect x="-16" y="-30" width="32" height="30" fill="#16a34a"/>
    <rect x="-24" y="-56" width="48" height="16" fill="#dc2626"/>
    <rect x="-5" y="-62" width="10" height="28" fill="#ffffff"/>
    <rect x="-18" y="-49" width="36" height="10" fill="#ffffff"/>
    <text x="0" y="30" text-anchor="middle" font-size="17" fill="#1e293b" font-weight="bold" font-family="Vazirmatn">بیمارستان گیرنده</text>
  </g>

  <!-- organ cooler box with viability clock -->
  <g transform="translate(400,78)">
    <rect x="-62" y="-34" width="124" height="60" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="-62" y1="-10" x2="62" y2="-10" stroke="#1e293b" stroke-width="2"/>
    <g stroke="#60a5fa" stroke-width="2.5" transform="translate(-44,14)">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6" y1="-5" x2="6" y2="5"/>
      <line x1="6" y1="-5" x2="-6" y2="5"/>
    </g>
    <text x="10" y="18" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="bold" font-family="Vazirmatn">محموله عضو</text>
    <circle cx="48" cy="-10" r="20" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="48" y1="-10" x2="48" y2="-21" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="-10" x2="56" y2="-5" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="-48" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="bold" font-family="Vazirmatn">پنجره زمانی حیات عضو</text>
  </g>

  <text x="400" y="480" text-anchor="middle" font-size="18" fill="#334155" font-weight="bold" font-family="Vazirmatn">مسیریابی چندوجهی انتقال عضو پیوندی در رقابت با زمان</text>
</svg>
