<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round">
    <path d="M 290 560 L 520 560" stroke="#2563eb" stroke-width="7" stroke-dasharray="14,10"/>
    <path d="M 520 560 L 660 400" stroke="#2563eb" stroke-width="7" stroke-dasharray="14,10"/>
    <path d="M 660 400 L 940 400" stroke="#ea580c" stroke-width="7" stroke-dasharray="14,10"/>
    <path d="M 940 400 L 1080 560" stroke="#16a34a" stroke-width="7" stroke-dasharray="14,10"/>
    <path d="M 1080 560 L 1310 560" stroke="#16a34a" stroke-width="7" stroke-dasharray="14,10"/>
  </g>

  <!-- donor hospital -->
  <g transform="translate(230,560)">
    <rect x="-76" y="-112" width="152" height="112" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
    <rect x="-24" y="-46" width="48" height="46" fill="#2563eb"/>
    <rect x="-36" y="-84" width="72" height="24" fill="#dc2626"/>
    <rect x="-8" y="-94" width="16" height="44" fill="#ffffff"/>
    <rect x="-28" y="-74" width="56" height="16" fill="#ffffff"/>
    <text x="0" y="46" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="bold" font-family="Vazirmatn">اهداکننده</text>
  </g>

  <!-- ambulance 1 -->
  <g transform="translate(400,553)">
    <rect x="-38" y="-24" width="76" height="40" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <rect x="6" y="-24" width="32" height="40" rx="4" fill="#2563eb"/>
    <circle cx="-20" cy="18" r="9" fill="#1e293b"/>
    <circle cx="18" cy="18" r="9" fill="#1e293b"/>
    <rect x="-15" y="-13" width="20" height="9" fill="#dc2626"/>
    <rect x="-9" y="-18" width="9" height="19" fill="#dc2626"/>
  </g>

  <!-- helicopter with viability clock -->
  <g transform="translate(800,390)">
    <line x1="-66" y1="-32" x2="66" y2="-32" stroke="#334155" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="50" ry="21" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
    <rect x="44" y="-7" width="42" height="12" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
    <line x1="84" y1="-20" x2="84" y2="3" stroke="#334155" stroke-width="3.5"/>
    <line x1="-24" y1="19" x2="-36" y2="38" stroke="#334155" stroke-width="4"/>
    <line x1="24" y1="19" x2="36" y2="38" stroke="#334155" stroke-width="4"/>
    <line x1="-36" y1="38" x2="36" y2="38" stroke="#334155" stroke-width="4"/>
    <circle cx="0" cy="-80" r="26" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
    <line x1="0" y1="-80" x2="0" y2="-94" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-80" x2="10" y2="-73" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ambulance 2 -->
  <g transform="translate(1200,553)">
    <rect x="-38" y="-24" width="76" height="40" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <rect x="6" y="-24" width="32" height="40" rx="4" fill="#16a34a"/>
    <circle cx="-20" cy="18" r="9" fill="#1e293b"/>
    <circle cx="18" cy="18" r="9" fill="#1e293b"/>
    <rect x="-15" y="-13" width="20" height="9" fill="#dc2626"/>
    <rect x="-9" y="-18" width="9" height="19" fill="#dc2626"/>
  </g>

  <!-- recipient hospital -->
  <g transform="translate(1370,560)">
    <rect x="-76" y="-112" width="152" height="112" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="5"/>
    <rect x="-24" y="-46" width="48" height="46" fill="#16a34a"/>
    <rect x="-36" y="-84" width="72" height="24" fill="#dc2626"/>
    <rect x="-8" y="-94" width="16" height="44" fill="#ffffff"/>
    <rect x="-28" y="-74" width="56" height="16" fill="#ffffff"/>
    <text x="0" y="46" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="bold" font-family="Vazirmatn">گیرنده</text>
  </g>

  <text x="800" y="760" text-anchor="middle" font-size="30" fill="#334155" font-weight="bold" font-family="Vazirmatn">تغییر مد حمل‌ونقل در مسیر، در رقابت با پنجره زمانی حیات عضو</text>
</svg>
