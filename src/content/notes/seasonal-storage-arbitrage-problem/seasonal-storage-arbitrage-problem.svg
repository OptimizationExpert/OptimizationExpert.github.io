<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="36" font-family="Vazirmatn" font-size="21" font-weight="bold" fill="#0f172a" text-anchor="middle">انبارداری فصلی: کِی بخریم، کِی بفروشیم؟</text>

  <!-- silo (central storage) -->
  <g transform="translate(355,120)">
    <polygon points="0,30 45,0 90,30" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
    <circle cx="45" cy="0" r="5" fill="#475569"/>
    <rect x="0" y="30" width="90" height="170" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <line x1="0" y1="65" x2="90" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="100" x2="90" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="135" x2="90" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="170" x2="90" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="35" y="200" width="20" height="16" fill="#64748b"/>
    <text x="45" y="240" font-family="Vazirmatn" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">سیلوی ذخیره</text>
  </g>

  <!-- left truck: delivering grain (harvest season, low price) -->
  <g transform="translate(70,225)">
    <rect x="0" y="0" width="86" height="42" rx="4" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="16" cy="10" r="3" fill="#ca8a04"/>
    <circle cx="28" cy="14" r="3" fill="#ca8a04"/>
    <circle cx="42" cy="9" r="3" fill="#ca8a04"/>
    <circle cx="55" cy="13" r="3" fill="#ca8a04"/>
    <circle cx="68" cy="9" r="3" fill="#ca8a04"/>
    <rect x="86" y="14" width="30" height="28" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <circle cx="22" cy="46" r="9" fill="#334155"/>
    <circle cx="70" cy="46" r="9" fill="#334155"/>
    <circle cx="100" cy="46" r="9" fill="#334155"/>
  </g>
  <path d="M 190 260 L 250 240" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="195" y="195" font-family="Vazirmatn" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">فصل برداشت</text>
  <text x="195" y="216" font-family="Vazirmatn" font-size="14" fill="#15803d" text-anchor="middle">قیمت پایین</text>

  <!-- right truck: selling grain (shortage season, high price) -->
  <g transform="translate(640,225)">
    <rect x="0" y="0" width="86" height="42" rx="4" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
    <circle cx="16" cy="10" r="3" fill="#c2410c"/>
    <circle cx="28" cy="14" r="3" fill="#c2410c"/>
    <circle cx="42" cy="9" r="3" fill="#c2410c"/>
    <rect x="-30" y="14" width="30" height="28" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <circle cx="-14" cy="46" r="9" fill="#334155"/>
    <circle cx="22" cy="46" r="9" fill="#334155"/>
    <circle cx="70" cy="46" r="9" fill="#334155"/>
  </g>
  <path d="M 465 248 L 600 248" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="640" y="195" font-family="Vazirmatn" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">فصل کمبود</text>
  <text x="640" y="216" font-family="Vazirmatn" font-size="14" fill="#b91c1c" text-anchor="middle">قیمت بالا</text>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- small price curve across bottom -->
  <polyline points="110,355 250,375 400,330 550,300 690,355" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="110" cy="355" r="4" fill="#2563eb"/>
  <circle cx="690" cy="355" r="4" fill="#2563eb"/>
  <text x="400" y="400" font-family="Vazirmatn" font-size="13" fill="#1e40af" text-anchor="middle">روند قیمت بازار در طول سال</text>

  <rect x="140" y="412" width="520" height="30" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="433" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">کِی بخریم، چقدر ذخیره کنیم، کِی بفروشیم؟</text>
</svg>
