<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="320" height="180" fill="#ffffff"/>

  <!-- small centered silo icon -->
  <g transform="translate(142,58)">
    <polygon points="0,10 18,0 36,10" fill="#94a3b8" stroke="#475569" stroke-width="1.6"/>
    <rect x="0" y="10" width="36" height="52" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
    <line x1="0" y1="26" x2="36" y2="26" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="42" x2="36" y2="42" stroke="#94a3b8" stroke-width="1"/>
    <rect x="14" y="62" width="8" height="7" fill="#64748b"/>
  </g>

  <!-- small price arrow: down then up -->
  <path d="M 108 95 L 128 105" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#am1)"/>
  <path d="M 192 105 L 212 95" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#am2)"/>

  <defs>
    <marker id="am1" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="am2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="160" y="140" font-family="Vazirmatn" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">انبارداری فصلی</text>
</svg>
