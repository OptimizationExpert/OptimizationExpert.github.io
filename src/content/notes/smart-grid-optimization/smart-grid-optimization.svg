<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <text x="400" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">شبکه هوشمند برق: از تولید تا مصرف‌کننده</text>

  <!-- Power plant -->
  <g transform="translate(90,180)">
    <rect x="-40" y="0" width="80" height="70" fill="#94a3b8"/>
    <rect x="-15" y="-40" width="14" height="40" fill="#64748b"/>
    <rect x="10" y="-55" width="14" height="55" fill="#64748b"/>
    <text x="0" y="95" font-family="Arial" font-size="14" fill="#334155" text-anchor="middle">نیروگاه</text>
  </g>

  <!-- Transmission tower -->
  <g transform="translate(280,190)">
    <path d="M -20,60 L 0,-40 L 20,60" fill="none" stroke="#64748b" stroke-width="4"/>
    <line x1="-14" y1="20" x2="14" y2="20" stroke="#64748b" stroke-width="3"/>
    <line x1="-9" y1="-5" x2="9" y2="-5" stroke="#64748b" stroke-width="3"/>
    <text x="0" y="85" font-family="Arial" font-size="14" fill="#334155" text-anchor="middle">انتقال</text>
  </g>

  <!-- Distribution substation with sensor -->
  <g transform="translate(460,190)">
    <rect x="-35" y="0" width="70" height="50" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="0" cy="-16" r="10" fill="#2563eb"/>
    <path d="M-4,-20 L-10,-12 L-4,-12 L-8,-4 L6,-16 L-2,-16 Z" fill="#ffffff"/>
    <text x="0" y="70" font-family="Arial" font-size="14" fill="#334155" text-anchor="middle">پست توزیع هوشمند</text>
  </g>

  <!-- Smart meter house -->
  <g transform="translate(650,195)">
    <path d="M -35,40 L -35,0 L 0,-30 L 35,0 L 35,40 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="-10" y="10" width="20" height="30" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="65" font-family="Arial" font-size="14" fill="#334155" text-anchor="middle">مصرف‌کننده و کنتور هوشمند</text>
  </g>

  <!-- Two-way arrows between nodes -->
  <path d="M 140,215 L 240,215" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
  <path d="M 320,215 L 420,215" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
  <path d="M 500,215 L 610,215" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L7,6 L0,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="400" y="330" font-family="Arial" font-size="13" fill="#64748b" text-anchor="middle">جریان توان و جریان داده، هر دو، در دو مسیر رفت‌وبرگشت</text>
</svg>
