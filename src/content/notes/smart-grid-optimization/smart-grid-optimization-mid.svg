<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Feeder line -->
  <line x1="120" y1="450" x2="1480" y2="450" stroke="#94a3b8" stroke-width="5"/>

  <!-- Substation -->
  <g transform="translate(160,450)">
    <rect x="-50" y="-70" width="100" height="70" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
    <text x="0" y="45" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#173b5c" text-anchor="middle">پست فوق‌توزیع</text>
  </g>

  <!-- Switchable capacitor bank -->
  <g transform="translate(520,450)">
    <rect x="-45" y="-90" width="90" height="90" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <line x1="-25" y1="-70" x2="25" y2="-70" stroke="#d97706" stroke-width="4"/>
    <line x1="-25" y1="-50" x2="25" y2="-50" stroke="#d97706" stroke-width="4"/>
    <line x1="-25" y1="-30" x2="25" y2="-30" stroke="#d97706" stroke-width="4"/>
    <text x="0" y="45" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#173b5c" text-anchor="middle">خازن سوئیچ‌شونده</text>
  </g>

  <!-- Sensor / smart meter node -->
  <g transform="translate(880,450)">
    <circle cx="0" cy="-70" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <path d="M6,-84 L-6,-64 L2,-64 L-6,-48 L14,-72 L4,-72 Z" fill="#2563eb"/>
    <text x="0" y="45" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#173b5c" text-anchor="middle">سنسور ولتاژ</text>
  </g>

  <!-- Rooftop solar (DER) -->
  <g transform="translate(1180,450)">
    <path d="M -60,-30 L 0,-90 L 60,-30 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
    <rect x="-45" y="-32" width="30" height="18" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="-10" y="-32" width="30" height="18" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="15" y="-32" width="30" height="18" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <text x="0" y="45" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#173b5c" text-anchor="middle">تولید پراکنده خورشیدی</text>
  </g>

  <!-- Consumer / battery -->
  <g transform="translate(1420,450)">
    <rect x="-45" y="-80" width="90" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <rect x="-15" y="-55" width="30" height="45" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="45" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="26" fill="#173b5c" text-anchor="middle">ذخیره‌ساز و مصرف‌کننده</text>
  </g>

  <!-- Two-way data / power flow arrows -->
  <path d="M 240,430 L 460,430" stroke="#2563eb" stroke-width="4" stroke-dasharray="10,8" marker-end="url(#midArrow)" marker-start="url(#midArrowStart)"/>
  <path d="M 610,430 L 830,430" stroke="#2563eb" stroke-width="4" stroke-dasharray="10,8" marker-end="url(#midArrow)" marker-start="url(#midArrowStart)"/>
  <path d="M 940,430 L 1100,430" stroke="#2563eb" stroke-width="4" stroke-dasharray="10,8" marker-end="url(#midArrow)" marker-start="url(#midArrowStart)"/>
  <path d="M 1260,430 L 1350,430" stroke="#2563eb" stroke-width="4" stroke-dasharray="10,8" marker-end="url(#midArrow)" marker-start="url(#midArrowStart)"/>

  <defs>
    <marker id="midArrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
    </marker>
    <marker id="midArrowStart" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L8,7 L0,3.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="800" y="700" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="28" fill="#334155" text-anchor="middle">ارتباط دیجیتال دوطرفه، همان چیزی است که یک فیدر معمولی را «هوشمند» می‌کند</text>
</svg>
