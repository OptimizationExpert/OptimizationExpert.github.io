<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ground / road base -->
  <rect x="0" y="700" width="1600" height="200" fill="#f3f4f6"/>

  <!-- storm cloud (cause of outage) -->
  <g transform="translate(760,90)">
    <ellipse cx="0" cy="20" rx="70" ry="34" fill="#cbd5e1"/>
    <ellipse cx="55" cy="10" rx="55" ry="30" fill="#cbd5e1"/>
    <ellipse cx="-55" cy="15" rx="50" ry="28" fill="#cbd5e1"/>
    <path d="M10,48 L-15,95 L8,95 L-10,135 L35,80 L10,80 Z" fill="#ea580c"/>
  </g>

  <!-- dispatch / command center -->
  <g transform="translate(130,520)">
    <rect x="0" y="40" width="150" height="130" fill="#1f2937"/>
    <rect x="20" y="65" width="28" height="28" fill="#ffffff"/>
    <rect x="62" y="65" width="28" height="28" fill="#ffffff"/>
    <rect x="104" y="65" width="28" height="28" fill="#ffffff"/>
    <rect x="20" y="110" width="28" height="28" fill="#ffffff"/>
    <rect x="62" y="110" width="28" height="28" fill="#ffffff"/>
    <rect x="104" y="110" width="28" height="28" fill="#ffffff"/>
    <polygon points="-15,40 165,40 75,-15" fill="#111827"/>
    <rect x="60" y="130" width="30" height="40" fill="#2563eb"/>
    <text x="75" y="225" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">مرکز فرماندهی</text>
    <text x="75" y="262" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">بازیابی</text>
  </g>

  <!-- hospital (priority facility) -->
  <g transform="translate(1310,380)">
    <rect x="0" y="40" width="190" height="160" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
    <rect x="20" y="70" width="34" height="34" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
    <rect x="78" y="70" width="34" height="34" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
    <rect x="136" y="70" width="34" height="34" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
    <rect x="20" y="130" width="34" height="34" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
    <rect x="136" y="130" width="34" height="34" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
    <rect x="80" y="150" width="30" height="50" fill="#1f2937"/>
    <rect x="80" y="0" width="30" height="55" fill="#dc2626"/>
    <rect x="63" y="17" width="64" height="20" fill="#dc2626"/>
    <text x="95" y="235" font-family="Vazirmatn" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">بیمارستان</text>
    <text x="95" y="268" font-family="Vazirmatn" font-size="24" fill="#dc2626" text-anchor="middle">اولویت ۱</text>
  </g>

  <!-- damaged pole 1 (near center) -->
  <g transform="translate(660,560)">
    <rect x="-6" y="0" width="12" height="160" fill="#4b5563"/>
    <rect x="-55" y="20" width="110" height="8" fill="#4b5563"/>
    <rect x="-45" y="55" width="90" height="8" fill="#4b5563"/>
    <circle cx="-40" cy="20" r="6" fill="#9ca3af"/>
    <circle cx="40" cy="20" r="6" fill="#9ca3af"/>
    <circle cx="-30" cy="55" r="6" fill="#9ca3af"/>
    <circle cx="30" cy="55" r="6" fill="#9ca3af"/>
    <path d="M-40,22 L-15,70 L-28,70 L0,120" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="0" cy="120" r="10" fill="#dc2626"/>
    <text x="0" y="200" font-family="Vazirmatn" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">تیر برق آسیب‌دیده</text>
  </g>

  <!-- damaged pole 2 (upper area, further) -->
  <g transform="translate(1040,230)">
    <rect x="-6" y="0" width="12" height="140" fill="#4b5563"/>
    <rect x="-50" y="18" width="100" height="7" fill="#4b5563"/>
    <circle cx="-36" cy="18" r="5" fill="#9ca3af"/>
    <circle cx="36" cy="18" r="5" fill="#9ca3af"/>
    <path d="M-36,20 L-10,60 L-22,60 L5,100" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="5" cy="100" r="8" fill="#dc2626"/>
    <text x="0" y="178" font-family="Vazirmatn" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">ایستگاه توزیع</text>
  </g>

  <!-- healthy pole far right-bottom for restored reference -->
  <g transform="translate(900,700)">
    <rect x="-5" y="0" width="10" height="110" fill="#4b5563"/>
    <rect x="-45" y="16" width="90" height="7" fill="#4b5563"/>
    <circle cx="-32" cy="16" r="5" fill="#9ca3af"/>
    <circle cx="32" cy="16" r="5" fill="#9ca3af"/>
    <line x1="-32" y1="18" x2="20" y2="18" stroke="#16a34a" stroke-width="3"/>
  </g>

  <!-- route dashed lines with arrows -->
  <path d="M280,610 C420,640 540,610 630,620" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <path d="M280,560 C520,420 820,320 1010,290" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <path d="M700,540 C900,470 1100,460 1300,460" fill="none" stroke="#9ca3af" stroke-width="4" stroke-dasharray="6 10"/>

  <!-- repair truck 1 (sequence 1, heading to hospital line) -->
  <g transform="translate(830,330)">
    <rect x="0" y="20" width="90" height="42" rx="4" fill="#2563eb"/>
    <rect x="70" y="0" width="34" height="42" rx="4" fill="#1d4ed8"/>
    <rect x="78" y="8" width="18" height="16" fill="#dbeafe"/>
    <circle cx="22" cy="68" r="14" fill="#1f2937"/>
    <circle cx="80" cy="68" r="14" fill="#1f2937"/>
    <circle cx="22" cy="68" r="5" fill="#9ca3af"/>
    <circle cx="80" cy="68" r="5" fill="#9ca3af"/>
    <circle cx="20" cy="2" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="20" y="10" font-family="Vazirmatn" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">۱</text>
    <text x="45" y="-18" font-family="Vazirmatn" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">گروه تعمیر ۱</text>
  </g>

  <!-- repair truck 2 (sequence 2, lower priority) -->
  <g transform="translate(440,650)">
    <rect x="0" y="20" width="90" height="42" rx="4" fill="#64748b"/>
    <rect x="70" y="0" width="34" height="42" rx="4" fill="#475569"/>
    <rect x="78" y="8" width="18" height="16" fill="#e2e8f0"/>
    <circle cx="22" cy="68" r="14" fill="#1f2937"/>
    <circle cx="80" cy="68" r="14" fill="#1f2937"/>
    <circle cx="22" cy="68" r="5" fill="#9ca3af"/>
    <circle cx="80" cy="68" r="5" fill="#9ca3af"/>
    <circle cx="20" cy="2" r="16" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <text x="20" y="10" font-family="Vazirmatn" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle">۲</text>
    <text x="45" y="-18" font-family="Vazirmatn" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">گروه تعمیر ۲</text>
  </g>

  <!-- clock icon indicating scheduling -->
  <g transform="translate(1230,650)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#111827" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="8" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#111827"/>
    <text x="0" y="90" font-family="Vazirmatn" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">زمان‌بندی تعمیرات</text>
  </g>

  <text x="800" y="845" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">مسیریابی و زمان‌بندی گروه‌های تعمیر شبکه برق پس از بلایا</text>
</svg>
