<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- route -->
  <path d="M260,430 C470,330 620,560 820,420 C980,310 1120,520 1320,430" fill="none" stroke="#2563eb" stroke-width="6" stroke-dasharray="16 12" marker-end="url(#arrow2)"/>

  <!-- priority pole 1 (hospital feeder, red, highest) -->
  <g transform="translate(240,330)">
    <rect x="-7" y="0" width="14" height="150" fill="#4b5563"/>
    <rect x="-55" y="20" width="110" height="9" fill="#4b5563"/>
    <circle cx="-42" cy="20" r="7" fill="#9ca3af"/>
    <circle cx="42" cy="20" r="7" fill="#9ca3af"/>
    <path d="M-42,23 L-15,75 L-30,75 L0,125" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="2 11" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="30" fill="#dc2626" transform="translate(0,-55)"/>
    <text x="0" y="-45" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">۱</text>
    <text x="0" y="205" font-family="Vazirmatn" font-size="27" font-weight="700" fill="#111827" text-anchor="middle">فیدر بیمارستان</text>
  </g>

  <!-- priority pole 2 (medium) -->
  <g transform="translate(800,300)">
    <rect x="-7" y="0" width="14" height="150" fill="#4b5563"/>
    <rect x="-50" y="20" width="100" height="8" fill="#4b5563"/>
    <circle cx="-38" cy="20" r="6" fill="#9ca3af"/>
    <circle cx="38" cy="20" r="6" fill="#9ca3af"/>
    <path d="M-38,23 L-12,68 L-26,68 L0,112" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="28" fill="#f59e0b" transform="translate(0,-50)"/>
    <text x="0" y="-41" font-family="Vazirmatn" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">۲</text>
    <text x="0" y="200" font-family="Vazirmatn" font-size="27" font-weight="700" fill="#111827" text-anchor="middle">مرکز محله</text>
  </g>

  <!-- priority pole 3 (lowest) -->
  <g transform="translate(1340,350)">
    <rect x="-6" y="0" width="12" height="140" fill="#4b5563"/>
    <rect x="-45" y="18" width="90" height="7" fill="#4b5563"/>
    <circle cx="-32" cy="18" r="6" fill="#9ca3af"/>
    <circle cx="32" cy="18" r="6" fill="#9ca3af"/>
    <path d="M-32,21 L-10,60 L-22,60 L2,98" fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="26" fill="#64748b" transform="translate(0,-46)"/>
    <text x="0" y="-37" font-family="Vazirmatn" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">۳</text>
    <text x="0" y="190" font-family="Vazirmatn" font-size="27" font-weight="700" fill="#111827" text-anchor="middle">منطقه مسکونی</text>
  </g>

  <!-- repair truck on the route -->
  <g transform="translate(560,470)">
    <rect x="0" y="18" width="86" height="40" rx="4" fill="#2563eb"/>
    <rect x="66" y="0" width="32" height="40" rx="4" fill="#1d4ed8"/>
    <rect x="73" y="7" width="17" height="15" fill="#dbeafe"/>
    <circle cx="20" cy="64" r="13" fill="#1f2937"/>
    <circle cx="76" cy="64" r="13" fill="#1f2937"/>
  </g>

  <!-- timeline strip at bottom -->
  <g transform="translate(220,760)">
    <line x1="0" y1="0" x2="1160" y2="0" stroke="#d1d5db" stroke-width="4"/>
    <circle cx="20" cy="0" r="10" fill="#dc2626"/>
    <circle cx="590" cy="0" r="10" fill="#f59e0b"/>
    <circle cx="1140" cy="0" r="10" fill="#64748b"/>
    <text x="20" y="48" font-family="Vazirmatn" font-size="24" fill="#111827" text-anchor="middle">ساعت ۰</text>
    <text x="590" y="48" font-family="Vazirmatn" font-size="24" fill="#111827" text-anchor="middle">ساعت ۳</text>
    <text x="1140" y="48" font-family="Vazirmatn" font-size="24" fill="#111827" text-anchor="middle">ساعت ۷</text>
  </g>

  <text x="800" y="150" font-family="Vazirmatn" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">توالی اولویت‌دار تعمیر فیدرها</text>
</svg>
