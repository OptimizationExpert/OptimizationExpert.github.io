    <rect x="-5" y="0" width="10" height="90" fill="#4b5563"/>
    <rect x="-34" y="12" width="68" height="6" fill="#4b5563"/>
    <circle cx="-25" cy="12" r="4" fill="#9ca3af"/>
    <circle cx="25" cy="12" r="4" fill="#9ca3af"/>
