    <circle cx="55" cy="46" r="9" fill="#1f2937"/>
  </g>

  <text x="800" y="680" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">بازیابی شبکه پس از بلایا</text>
