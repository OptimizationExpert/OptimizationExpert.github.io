<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <circle cx="95" cy="120" r="60" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="210" cy="200" r="55" fill="#ea580c" fill-opacity="0.08" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- station -->
  <g transform="translate(95,120)">
    <rect x="-16" y="-14" width="32" height="26" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="-3" y="-9" width="6" height="14" fill="#2563eb"/>
    <rect x="-9" y="-3" width="18" height="6" fill="#2563eb"/>
  </g>

  <!-- incident -->
  <g transform="translate(210,200)">
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
    <rect x="-2.2" y="-7" width="4.4" height="14" fill="#ffffff"/>
    <rect x="-7" y="-2.2" width="14" height="4.4" fill="#ffffff"/>
  </g>

  <line x1="95" y1="120" x2="210" y2="200" stroke="#2563eb" stroke-width="3" stroke-dasharray="7,5"/>

  <g transform="translate(150,158)">
    <rect x="-18" y="-10" width="36" height="18" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="3" y="-10" width="15" height="18" rx="2" fill="#2563eb"/>
    <circle cx="-9" cy="9" r="4" fill="#1e293b"/>
    <circle cx="8" cy="9" r="4" fill="#1e293b"/>
    <rect x="-7" y="-6" width="9" height="4" fill="#dc2626"/>
  </g>
</svg>
