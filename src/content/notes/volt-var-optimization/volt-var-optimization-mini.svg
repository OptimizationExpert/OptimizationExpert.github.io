<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="#ffffff"/>

  <!-- substation -->
  <rect x="30" y="120" width="50" height="50" rx="6" fill="#1e40af"/>

  <!-- feeder -->
  <line x1="80" y1="145" x2="250" y2="145" stroke="#1e40af" stroke-width="4"/>

  <!-- nodes -->
  <circle cx="150" cy="145" r="8" fill="#2563eb"/>
  <circle cx="230" cy="145" r="8" fill="#2563eb"/>

  <!-- capacitor bank icon -->
  <rect x="132" y="175" width="36" height="30" rx="4" fill="#16a34a"/>
  <line x1="140" y1="186" x2="160" y2="186" stroke="#ffffff" stroke-width="3"/>
  <line x1="140" y1="196" x2="160" y2="196" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="145" x2="150" y2="175" stroke="#16a34a" stroke-width="2"/>

  <!-- simple voltage curve -->
  <polyline points="80,240 150,244 230,240" fill="none" stroke="#16a34a" stroke-width="4"/>
  <line x1="80" y1="225" x2="250" y2="225" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="80" y1="260" x2="250" y2="260" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
</svg>
