<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#ffffff"/>

  <!-- Title labels -->
  <text x="40" y="40" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">فیدر توزیع و کنترل ولتاژ-توان راکتیو</text>

  <!-- Substation -->
  <rect x="40" y="90" width="70" height="70" rx="6" fill="#1e40af"/>
  <text x="75" y="130" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">پست</text>
  <text x="75" y="145" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="10" fill="#dbeafe" text-anchor="middle">OLTC</text>

  <!-- Feeder line -->
  <line x1="110" y1="125" x2="720" y2="125" stroke="#1e40af" stroke-width="4"/>

  <!-- Nodes along feeder -->
  <circle cx="230" cy="125" r="9" fill="#2563eb"/>
  <circle cx="380" cy="125" r="9" fill="#2563eb"/>
  <circle cx="530" cy="125" r="9" fill="#2563eb"/>
  <circle cx="680" cy="125" r="9" fill="#2563eb"/>

  <!-- Capacitor bank at node 2 -->
  <rect x="360" y="170" width="40" height="34" rx="4" fill="#16a34a"/>
  <line x1="380" y1="170" x2="380" y2="204" stroke="#ffffff" stroke-width="0"/>
  <line x1="368" y1="182" x2="392" y2="182" stroke="#ffffff" stroke-width="3"/>
  <line x1="368" y1="192" x2="392" y2="192" stroke="#ffffff" stroke-width="3"/>
  <line x1="380" y1="125" x2="380" y2="170" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="222" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">بانک خازنی</text>

  <!-- PV inverter at node 4 -->
  <rect x="660" y="170" width="40" height="34" rx="4" fill="#f97316"/>
  <text x="680" y="192" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">☀</text>
  <line x1="680" y1="125" x2="680" y2="170" stroke="#f97316" stroke-width="2"/>
  <text x="680" y="222" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle">اینورتر هوشمند PV</text>

  <!-- load icons at node1 and node3 -->
  <line x1="230" y1="125" x2="230" y2="165" stroke="#64748b" stroke-width="2"/>
  <polygon points="230,165 220,185 240,185" fill="#64748b"/>
  <text x="230" y="200" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">بار</text>

  <line x1="530" y1="125" x2="530" y2="165" stroke="#64748b" stroke-width="2"/>
  <polygon points="530,165 520,185 540,185" fill="#64748b"/>
  <text x="530" y="200" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">بار</text>

  <!-- Voltage profile chart -->
  <text x="40" y="280" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">پروفیل ولتاژ در طول فیدر</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="70" y2="430" stroke="#334155" stroke-width="1.5"/>
  <line x1="70" y1="430" x2="740" y2="430" stroke="#334155" stroke-width="1.5"/>

  <!-- limit lines -->
  <line x1="70" y1="320" x2="740" y2="320" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="745" y="324" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="10" fill="#dc2626">حد بالا</text>
  <line x1="70" y1="400" x2="740" y2="400" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="745" y="404" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="10" fill="#dc2626">حد پایین</text>

  <!-- without VVO: declining then rising (PV reverse flow) violating limits -->
  <polyline points="110,340 230,360 380,410 530,345 680,315" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5,4"/>
  <text x="600" y="300" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#64748b">بدون VVO</text>

  <!-- with VVO: flat and within bounds -->
  <polyline points="110,355 230,362 380,368 530,364 680,358" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="380" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#166534">با VVO</text>

  <text x="110" y="445" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">پست</text>
  <text x="680" y="445" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">انتهای فیدر</text>
</svg>
