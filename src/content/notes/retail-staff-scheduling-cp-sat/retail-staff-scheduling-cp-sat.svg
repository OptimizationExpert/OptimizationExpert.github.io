<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="750" fill="#ffffff"/>

  <text x="1150" y="50" font-family="Vazirmatn" font-size="28" font-weight="700" fill="#1e293b" text-anchor="end">Retail Shift Scheduling with CP-SAT</text>

  <!-- header row: days -->
  <g font-family="Vazirmatn" font-size="18" fill="#475569">
    <text x="175" y="110" text-anchor="middle">Sat</text>
    <text x="325" y="110" text-anchor="middle">Sun</text>
    <text x="475" y="110" text-anchor="middle">Mon</text>
    <text x="625" y="110" text-anchor="middle">Tue</text>
    <text x="775" y="110" text-anchor="middle">Wed</text>
    <text x="925" y="110" text-anchor="middle">Thu</text>
    <text x="1075" y="110" text-anchor="middle">Fri</text>
  </g>

  <!-- row labels -->
  <text x="60" y="200" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">Cashier</text>
  <text x="60" y="340" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Restocker</text>

  <!-- cashier row cells -->
  <g font-family="Vazirmatn" font-size="18" fill="#92400e">
    <rect x="115" y="160" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="175" y="202" text-anchor="middle">Rebecca</text>
    <rect x="265" y="160" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="325" y="202" text-anchor="middle">Emma</text>
    <rect x="415" y="160" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="475" y="202" text-anchor="middle">David</text>
    <rect x="565" y="160" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="625" y="202" text-anchor="middle">Rebecca</text>
    <rect x="715" y="160" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="775" y="202" text-anchor="middle">Emma</text>
    <rect x="865" y="160" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="925" y="202" text-anchor="middle">David</text>
    <rect x="1015" y="160" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1075" y="202" text-anchor="middle">Rebecca</text>
  </g>

  <!-- restocker row cells -->
  <g font-family="Vazirmatn" font-size="18" fill="#1e3a8a">
    <rect x="115" y="300" width="120" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="175" y="342" text-anchor="middle">David</text>
    <rect x="265" y="300" width="120" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="325" y="342" text-anchor="middle">Phil</text>
    <rect x="415" y="300" width="120" height="70" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="475" y="335" text-anchor="middle">Off</text>
    <text x="475" y="358" text-anchor="middle" font-size="14">(Emma's leave)</text>
    <rect x="565" y="300" width="120" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="625" y="342" text-anchor="middle">Phil</text>
    <rect x="715" y="300" width="120" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="775" y="342" text-anchor="middle">Emma</text>
    <rect x="865" y="300" width="120" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="925" y="342" text-anchor="middle">David</text>
    <rect x="1015" y="300" width="120" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1075" y="342" text-anchor="middle">Phil</text>
  </g>

  <!-- no-consecutive-shift callout -->
  <g transform="translate(600,460)">
    <rect x="-420" y="-40" width="840" height="80" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="0" y="-5" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#3730a3" text-anchor="middle">Constraint: no Evening-then-Morning back-to-back for Restocker</text>
    <text x="0" y="25" font-family="Vazirmatn" font-size="18" fill="#3730a3" text-anchor="middle">x[Evening] + x[next day Morning] &lt;= 1</text>
  </g>

  <!-- fairness bar chart at bottom -->
  <text x="600" y="535" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">Objective: minimize (max shifts − min shifts)</text>

  <rect x="300" y="620" width="60" height="70" fill="#f59e0b"/>
  <text x="330" y="708" font-family="Vazirmatn" font-size="16" fill="#334155" text-anchor="middle">Phil: 4</text>

  <rect x="450" y="600" width="60" height="90" fill="#f59e0b"/>
  <text x="480" y="708" font-family="Vazirmatn" font-size="16" fill="#334155" text-anchor="middle">Emma: 6</text>

  <rect x="600" y="560" width="60" height="130" fill="#f59e0b"/>
  <text x="630" y="708" font-family="Vazirmatn" font-size="16" fill="#334155" text-anchor="middle">David: 9</text>

  <rect x="750" y="560" width="60" height="130" fill="#f59e0b"/>
  <text x="780" y="708" font-family="Vazirmatn" font-size="16" fill="#334155" text-anchor="middle">Rebecca: 9</text>

  <line x1="280" y1="690" x2="830" y2="690" stroke="#94a3b8" stroke-width="2"/>
</svg>
