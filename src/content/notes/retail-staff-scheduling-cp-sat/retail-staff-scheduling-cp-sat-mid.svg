<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Day d -->
  <g transform="translate(480,300)">
    <text x="0" y="-80" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#1e293b" text-anchor="middle">Day d</text>

    <rect x="-140" y="-40" width="280" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="5" font-family="Vazirmatn" font-size="22" fill="#64748b" text-anchor="middle">Morning</text>

    <rect x="-140" y="55" width="280" height="85" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
    <text x="0" y="90" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">Evening</text>
    <text x="0" y="118" font-family="Vazirmatn" font-size="18" fill="#1e3a8a" text-anchor="middle">David</text>

    <rect x="-140" y="155" width="280" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="200" font-family="Vazirmatn" font-size="22" fill="#64748b" text-anchor="middle">Afternoon</text>
  </g>

  <!-- arrow -->
  <g transform="translate(800,335)">
    <line x1="-20" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="4"/>
    <polygon points="60,0 42,-10 42,10" fill="#dc2626"/>
    <text x="20" y="-18" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">X</text>
  </g>

  <!-- Day d+1 -->
  <g transform="translate(1120,300)">
    <text x="0" y="-80" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#1e293b" text-anchor="middle">Day d+1</text>

    <rect x="-140" y="-45" width="280" height="85" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="3" stroke-dasharray="7,5"/>
    <text x="0" y="-10" font-family="Vazirmatn" font-size="22" font-weight="700" fill="#7f1d1d" text-anchor="middle">Morning</text>
    <text x="0" y="18" font-family="Vazirmatn" font-size="18" fill="#7f1d1d" text-anchor="middle">David?</text>

    <rect x="-140" y="55" width="280" height="85" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="104" font-family="Vazirmatn" font-size="22" fill="#64748b" text-anchor="middle">Evening</text>

    <rect x="-140" y="155" width="280" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="200" font-family="Vazirmatn" font-size="22" fill="#64748b" text-anchor="middle">Afternoon</text>
  </g>

  <!-- constraint formula box -->
  <rect x="400" y="620" width="800" height="110" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="800" y="668" font-family="Vazirmatn" font-size="26" font-weight="700" fill="#3730a3" text-anchor="middle">x[Restocker, d, Evening] + x[Restocker, d+1, Morning] &lt;= 1</text>
  <text x="800" y="702" font-family="Vazirmatn" font-size="20" fill="#3730a3" text-anchor="middle">no_consecutive_restocking_shifts</text>
</svg>
