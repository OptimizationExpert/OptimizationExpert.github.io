<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="34" font-family="Vazirmatn" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">چیدمان انبار برای پیکینگ سریع‌تر</text>

  <!-- exit door -->
  <g transform="translate(360,60)">
    <rect x="0" y="0" width="80" height="26" rx="4" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
    <text x="40" y="18" font-family="Vazirmatn" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">درب خروجی</text>
  </g>

  <!-- shelf row 1 (close, high demand) -->
  <g transform="translate(150,110)">
    <rect x="0" y="0" width="500" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="20" y="8" width="28" height="28" fill="#16a34a"/>
    <rect x="60" y="8" width="28" height="28" fill="#16a34a"/>
    <rect x="100" y="8" width="28" height="28" fill="#16a34a"/>
    <rect x="140" y="8" width="28" height="28" fill="#16a34a"/>
    <text x="480" y="27" font-family="Vazirmatn" font-size="12" font-weight="bold" fill="#166534" text-anchor="end">کالاهای پرتقاضا</text>
  </g>

  <!-- shelf row 2 (medium) -->
  <g transform="translate(150,190)">
    <rect x="0" y="0" width="500" height="44" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <rect x="220" y="8" width="28" height="28" fill="#ca8a04"/>
    <rect x="260" y="8" width="28" height="28" fill="#ca8a04"/>
    <rect x="300" y="8" width="28" height="28" fill="#ca8a04"/>
    <text x="480" y="27" font-family="Vazirmatn" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="end">کالاهای متوسط</text>
  </g>

  <!-- shelf row 3 (far, low demand) -->
  <g transform="translate(150,270)">
    <rect x="0" y="0" width="500" height="44" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <rect x="400" y="8" width="28" height="28" fill="#b91c1c"/>
    <rect x="440" y="8" width="28" height="28" fill="#b91c1c"/>
    <text x="480" y="27" font-family="Vazirmatn" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="end">کالاهای کم‌تقاضا</text>
  </g>

  <!-- picker with cart -->
  <g transform="translate(200,340)">
    <circle cx="12" cy="0" r="10" fill="#1d4ed8"/>
    <rect x="0" y="10" width="24" height="30" rx="6" fill="#1d4ed8"/>
    <rect x="30" y="30" width="46" height="26" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <circle cx="38" cy="60" r="6" fill="#0f172a"/>
    <circle cx="68" cy="60" r="6" fill="#0f172a"/>
    <text x="53" y="80" font-family="Vazirmatn" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">پیکینگ</text>
  </g>

  <!-- path arrow from exit to near shelf -->
  <path d="M400,86 L400,110" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowW)"/>

  <rect x="150" y="380" width="500" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="408" font-family="Vazirmatn" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">کدام کالا در کدام قفسه باشد؟</text>

  <defs>
    <marker id="arrowW" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
