<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f766e">زمان‌بندی اتاق عمل</text>

  <!-- Time axis -->
  <line x1="120" y1="420" x2="740" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="445" font-size="13" fill="#64748b" text-anchor="middle">۸:۰۰</text>
  <text x="275" y="445" font-size="13" fill="#64748b" text-anchor="middle">۱۰:۰۰</text>
  <text x="430" y="445" font-size="13" fill="#64748b" text-anchor="middle">۱۲:۰۰</text>
  <text x="585" y="445" font-size="13" fill="#64748b" text-anchor="middle">۱۴:۰۰</text>
  <text x="730" y="445" font-size="13" fill="#64748b" text-anchor="middle">۱۶:۰۰</text>
  <line x1="275" y1="70" x2="275" y2="420" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="430" y1="70" x2="430" y2="420" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="585" y1="70" x2="585" y2="420" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Room labels -->
  <text x="60" y="105" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">اتاق ۱</text>
  <text x="60" y="200" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">اتاق ۲</text>
  <text x="60" y="295" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">اتاق ۳</text>
  <text x="60" y="390" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold">اتاق ۴</text>

  <!-- Room 1 lane -->
  <rect x="120" y="75" width="620" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="120" y="82" width="140" height="46" rx="6" fill="#14b8a6"/>
  <text x="190" y="110" font-size="12" fill="#ffffff" text-anchor="middle">جراحی زانو</text>
  <rect x="270" y="82" width="220" height="46" rx="6" fill="#0d9488"/>
  <text x="380" y="110" font-size="12" fill="#ffffff" text-anchor="middle">جراحی قلب باز</text>
  <rect x="500" y="82" width="130" height="46" rx="6" fill="#5eead4"/>
  <text x="565" y="110" font-size="12" fill="#0f172a" text-anchor="middle">آپاندیس</text>

  <!-- Room 2 lane -->
  <rect x="120" y="170" width="620" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="120" y="177" width="90" height="46" rx="6" fill="#f97316"/>
  <text x="165" y="205" font-size="11" fill="#ffffff" text-anchor="middle">لوزه</text>
  <rect x="220" y="177" width="80" height="46" rx="6" fill="#fb923c"/>
  <text x="260" y="205" font-size="11" fill="#ffffff" text-anchor="middle">فتق</text>
  <rect x="310" y="177" width="150" height="46" rx="6" fill="#ef4444"/>
  <text x="385" y="200" font-size="11" fill="#ffffff" text-anchor="middle">اورژانسی</text>
  <text x="385" y="214" font-size="9" fill="#ffffff" text-anchor="middle">اولویت بالا</text>
  <rect x="475" y="177" width="180" height="46" rx="6" fill="#fdba74"/>
  <text x="565" y="205" font-size="11" fill="#0f172a" text-anchor="middle">جراحی زانو ۲</text>

  <!-- Room 3 lane -->
  <rect x="120" y="265" width="620" height="60" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="120" y="272" width="260" height="46" rx="6" fill="#0369a1"/>
  <text x="250" y="300" font-size="12" fill="#ffffff" text-anchor="middle">پیوند کلیه</text>
  <rect x="400" y="272" width="120" height="46" rx="6" fill="#38bdf8"/>
  <text x="460" y="300" font-size="11" fill="#ffffff" text-anchor="middle">آب‌مروارید</text>
  <rect x="540" y="272" width="150" height="46" rx="6" fill="#7dd3fc"/>
  <text x="615" y="300" font-size="11" fill="#0f172a" text-anchor="middle">جراحی پستان</text>

  <!-- Room 4 lane -->
  <rect x="120" y="360" width="620" height="50" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="120" y="365" width="120" height="40" rx="6" fill="#a3a3a3"/>
  <text x="180" y="390" font-size="10" fill="#ffffff" text-anchor="middle">بیکار</text>
  <rect x="260" y="365" width="380" height="40" rx="6" fill="#4ade80"/>
  <text x="450" y="390" font-size="12" fill="#0f172a" text-anchor="middle">سزارین + زایمان طبیعی (چند مورد)</text>
  <rect x="660" y="365" width="80" height="40" rx="6" fill="#a3a3a3"/>
  <text x="700" y="390" font-size="10" fill="#ffffff" text-anchor="middle">بیکار</text>

  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#64748b">optexpert.org — بهینه‌سازی زمان‌بندی اتاق عمل با برنامه‌ریزی محدودیت</text>
</svg>
