<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <!-- illustration (left) -->
  <g transform="translate(150,230)">
    <rect x="0" y="0" width="560" height="380" rx="28" fill="#E8F5EC" stroke="#9CCFAE" stroke-width="4"/>
    <line x1="280" y1="0" x2="280" y2="380" stroke="#9CCFAE" stroke-width="4"/>
    <circle cx="280" cy="190" r="60" fill="none" stroke="#9CCFAE" stroke-width="4"/>
    <!-- dug holes -->
    <ellipse cx="90" cy="90" rx="34" ry="16" fill="#C9B79C"/>
    <ellipse cx="170" cy="300" rx="34" ry="16" fill="#C9B79C"/>
    <ellipse cx="420" cy="80" rx="34" ry="16" fill="#C9B79C"/>
    <!-- treasure chest -->
    <g transform="translate(400,250)">
      <rect x="0" y="20" width="100" height="60" rx="8" fill="#F4A259"/>
      <path d="M0 28 Q50 -16 100 28 Z" fill="#E07A2F"/>
      <rect x="44" y="34" width="12" height="18" rx="3" fill="#FFFFFF"/>
    </g>
    <!-- arrow toward chest -->
    <path d="M200 200 Q300 150 380 260" fill="none" stroke="#5B8DEF" stroke-width="8" stroke-linecap="round"/>
    <path d="M380 260 l-26 -6 l14 -22 z" fill="#5B8DEF"/>
    <!-- gear (tool) -->
    <g transform="translate(150,200)" fill="#8E7CC3">
      <circle r="38"/>
      <g>
        <rect x="-10" y="-56" width="20" height="24" rx="4"/>
        <rect x="-10" y="32" width="20" height="24" rx="4"/>
        <rect x="-56" y="-10" width="24" height="20" rx="4"/>
        <rect x="32" y="-10" width="24" height="20" rx="4"/>
      </g>
      <circle r="15" fill="#FFFFFF"/>
    </g>
  </g>
  <!-- text (right, RTL) -->
  <g font-family="Vazirmatn" text-anchor="end">
    <text x="1460" y="360" font-size="78" font-weight="800" fill="#2B3A55">سردرگمی در تعریف تز؟</text>
    <text x="1460" y="480" font-size="58" font-weight="600" fill="#2E8B57">مشکل از نداشتن ابزار است</text>
    <text x="1460" y="590" font-size="40" font-weight="400" fill="#6B7280">شبیه‌سازی مقاله، کوتاه‌ترین راه تا ایده</text>
  </g>
</svg>
