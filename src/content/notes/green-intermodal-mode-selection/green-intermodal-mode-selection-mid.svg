<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#ffffff"/>
  <line x1="800" y1="90" x2="800" y2="810" stroke="#e2e8f0" stroke-width="3"/>

  <!-- LEFT PANEL: cost-only choice -->
  <g>
    <text x="1200" y="110" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#b91c1c" text-anchor="middle">فقط بر اساس هزینه</text>

    <g transform="translate(1340,230)">
      <polygon points="-45,-6 0,-34 45,-6" fill="#d97706"/>
      <rect x="-45" y="-6" width="90" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="4"/>
    </g>
    <text x="1340" y="310" font-family="Vazirmatn" font-size="20" fill="#92400e" text-anchor="middle">مبدأ</text>

    <g transform="translate(1060,230)">
      <polygon points="-40,-6 0,-30 40,-6" fill="#2563eb"/>
      <rect x="-40" y="-6" width="80" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
    </g>
    <text x="1060" y="300" font-family="Vazirmatn" font-size="20" fill="#1e3a8a" text-anchor="middle">مقصد</text>

    <path d="M 1290 230 L 1110 230" fill="none" stroke="#dc2626" stroke-width="6"/>
    <g transform="translate(1200,230)">
      <rect x="-13" y="-30" width="70" height="30" fill="#f59e0b" stroke="#92400e" stroke-width="2" rx="3"/>
      <rect x="57" y="-22" width="26" height="22" fill="#fbbf24" stroke="#92400e" stroke-width="2" rx="2"/>
      <circle cx="0" cy="2" r="8" fill="#334155"/>
      <circle cx="48" cy="2" r="8" fill="#334155"/>
      <circle cx="74" cy="2" r="8" fill="#334155"/>
    </g>
    <text x="1200" y="195" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">همه محموله‌ها با کامیون</text>

    <rect x="1040" y="430" width="320" height="130" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="1200" y="478" font-family="Vazirmatn" font-size="23" font-weight="700" fill="#7f1d1d" text-anchor="middle">کربن: زیاد</text>
    <text x="1200" y="512" font-family="Vazirmatn" font-size="21" fill="#7f1d1d" text-anchor="middle">هزینه ظاهری کم</text>
    <text x="1200" y="542" font-family="Vazirmatn" font-size="21" fill="#7f1d1d" text-anchor="middle">ولی ردپای کربن بالا</text>
  </g>

  <!-- RIGHT PANEL: carbon-aware choice -->
  <g>
    <text x="400" y="110" font-family="Vazirmatn" font-size="30" font-weight="700" fill="#15803d" text-anchor="middle">با هدف‌گذاری سبز</text>

    <g transform="translate(540,230)">
      <polygon points="-45,-6 0,-34 45,-6" fill="#d97706"/>
      <rect x="-45" y="-6" width="90" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="4"/>
    </g>
    <text x="540" y="310" font-family="Vazirmatn" font-size="20" fill="#92400e" text-anchor="middle">مبدأ</text>

    <g transform="translate(260,230)">
      <polygon points="-40,-6 0,-30 40,-6" fill="#2563eb"/>
      <rect x="-40" y="-6" width="80" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
    </g>
    <text x="260" y="300" font-family="Vazirmatn" font-size="20" fill="#1e3a8a" text-anchor="middle">مقصد</text>

    <path d="M 490 230 L 310 230" fill="none" stroke="#059669" stroke-width="6"/>
    <g transform="translate(400,230)">
      <rect x="-32" y="-22" width="22" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5" rx="2"/>
      <rect x="-8" y="-22" width="22" height="22" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5" rx="2"/>
      <rect x="16" y="-26" width="18" height="26" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5" rx="2"/>
      <circle cx="-24" cy="2" r="6" fill="#1e293b"/>
      <circle cx="0" cy="2" r="6" fill="#1e293b"/>
      <circle cx="22" cy="2" r="6" fill="#1e293b"/>
    </g>
    <text x="400" y="195" font-family="Vazirmatn" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">بیشتر محموله‌ها با ریل و دریا</text>

    <rect x="240" y="430" width="320" height="130" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="400" y="478" font-family="Vazirmatn" font-size="23" font-weight="700" fill="#14532d" text-anchor="middle">کربن: کم</text>
    <text x="400" y="512" font-family="Vazirmatn" font-size="21" fill="#14532d" text-anchor="middle">هزینه کمی بالاتر</text>
    <text x="400" y="542" font-family="Vazirmatn" font-size="21" fill="#14532d" text-anchor="middle">ولی ردپای کربن پایین</text>
  </g>

  <text x="800" y="860" font-family="Vazirmatn" font-size="20" fill="#64748b" text-anchor="middle">بده-بستان هزینه و کربن در انتخاب حالت حمل‌ونقل</text>
</svg>
