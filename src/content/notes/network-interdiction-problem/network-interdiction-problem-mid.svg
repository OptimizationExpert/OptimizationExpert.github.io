<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="85" font-family="Vazirmatn" font-size="32" font-weight="bold" fill="#0f172a" text-anchor="middle">شبکه سالم در برابر شبکه بعد از اخلال</text>

  <line x1="800" y1="140" x2="800" y2="800" stroke="#e2e8f0" stroke-width="3"/>

  <!-- LEFT panel: healthy network -->
  <text x="400" y="175" font-family="Vazirmatn" font-size="24" font-weight="bold" fill="#334155" text-anchor="middle">پیش از اخلال</text>

  <!-- left nodes -->
  <circle cx="190" cy="400" r="26" fill="#1d4ed8"/>
  <text x="190" y="407" font-family="Vazirmatn" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">D</text>
  <text x="190" y="455" font-family="Vazirmatn" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="bold">انبار امداد</text>

  <circle cx="420" cy="320" r="14" fill="#64748b"/>
  <circle cx="420" cy="480" r="14" fill="#64748b"/>
  <circle cx="630" cy="400" r="14" fill="#f97316"/>

  <rect x="660" y="365" width="90" height="70" rx="6" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <rect x="692" y="380" width="16" height="16" fill="#ef4444"/>
  <rect x="696" y="374" width="8" height="28" fill="#ef4444"/>
  <text x="705" y="460" font-family="Vazirmatn" font-size="17" fill="#334155" text-anchor="middle" font-weight="bold">بیمارستان</text>

  <!-- left edges: all gray, shortest path highlighted blue -->
  <line x1="216" y1="400" x2="630" y2="400" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round"/>
  <line x1="190" y1="374" x2="420" y2="320" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="420" y1="320" x2="630" y2="400" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="190" y1="426" x2="420" y2="480" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="420" y1="480" x2="630" y2="400" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="644" y1="400" x2="660" y2="400" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round"/>

  <!-- critical bridge marker on the short blue path -->
  <rect x="355" y="388" width="110" height="24" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <text x="410" y="350" font-family="Vazirmatn" font-size="16" fill="#c2410c" text-anchor="middle" font-weight="bold">یال بحرانی</text>

  <rect x="260" y="600" width="400" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="460" y="638" font-family="Vazirmatn" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">کوتاه‌ترین مسیر: ۱ واحد زمان</text>

  <!-- RIGHT panel: interdicted network -->
  <text x="1200" y="175" font-family="Vazirmatn" font-size="24" font-weight="bold" fill="#334155" text-anchor="middle">بعد از تخریب یال بحرانی</text>

  <circle cx="990" cy="400" r="26" fill="#1d4ed8"/>
  <text x="990" y="407" font-family="Vazirmatn" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">D</text>
  <text x="990" y="455" font-family="Vazirmatn" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="bold">انبار امداد</text>

  <circle cx="1220" cy="320" r="14" fill="#64748b"/>
  <circle cx="1220" cy="480" r="14" fill="#64748b"/>
  <circle cx="1430" cy="400" r="14" fill="#f97316"/>

  <rect x="1460" y="365" width="90" height="70" rx="6" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <rect x="1492" y="380" width="16" height="16" fill="#ef4444"/>
  <rect x="1496" y="374" width="8" height="28" fill="#ef4444"/>
  <text x="1505" y="460" font-family="Vazirmatn" font-size="17" fill="#334155" text-anchor="middle" font-weight="bold">بیمارستان</text>

  <!-- broken direct edge -->
  <line x1="1016" y1="400" x2="1140" y2="400" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 10"/>
  <g transform="translate(1160,383)">
    <line x1="0" y1="0" x2="34" y2="34" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <line x1="34" y1="0" x2="0" y2="34" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- long detour highlighted orange -->
  <line x1="990" y1="374" x2="1220" y2="320" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  <line x1="1220" y1="320" x2="1430" y2="400" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  <line x1="990" y1="426" x2="1220" y2="480" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="1220" y1="480" x2="1430" y2="400" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="1444" y1="400" x2="1460" y2="400" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>

  <rect x="1060" y="600" width="400" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1260" y="638" font-family="Vazirmatn" font-size="19" font-weight="bold" fill="#c2410c" text-anchor="middle">کوتاه‌ترین مسیر باقی‌مانده: ۳ واحد زمان</text>

  <rect x="430" y="760" width="740" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="800" y="804" font-family="Vazirmatn" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">مدل اخلال شبکه همین افزایش را از پیش پیش‌بینی می‌کند</text>
</svg>
