<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- River -->
  <path d="M 0,260 C 150,220 230,300 380,260 C 530,220 610,300 800,260 L 800,330 C 610,370 530,290 380,330 C 230,370 150,290 0,330 Z" fill="#bfe3f5" opacity="0.7"/>

  <!-- Long alternate route (gray, dashed, goes around) -->
  <path d="M 150,140 L 150,70 L 650,70 L 650,170" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="3 10"/>
  <path d="M 650,170 L 650,300 L 600,355" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="3 10"/>
  <text x="400" y="55" font-family="Vazirmatn" font-size="15" fill="#64748b" text-anchor="middle">مسیر جایگزین: سه برابر طولانی‌تر</text>

  <!-- Normal intact roads -->
  <path d="M 150,140 L 150,230" stroke="#94a3b8" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Critical bridge arc crossing the river (short path) -->
  <path d="M 150,250 L 300,295" stroke="#f97316" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M 300,295 L 460,300" stroke="#f97316" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M 460,300 L 600,355" stroke="#f97316" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="2 9"/>

  <!-- Bridge structure -->
  <g>
    <rect x="330" y="282" width="100" height="22" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
    <line x1="350" y1="282" x2="350" y2="304" stroke="#c2410c" stroke-width="2.5"/>
    <line x1="380" y1="282" x2="380" y2="304" stroke="#c2410c" stroke-width="2.5"/>
    <line x1="410" y1="282" x2="410" y2="304" stroke="#c2410c" stroke-width="2.5"/>
  </g>

  <!-- Warning triangle above bridge -->
  <g transform="translate(340,165)">
    <polygon points="20,0 40,36 0,36" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
    <text x="20" y="30" font-family="Vazirmatn" font-size="22" fill="#b45309" text-anchor="middle" font-weight="bold">!</text>
  </g>
  <text x="360" y="232" font-family="Vazirmatn" font-size="16" fill="#c2410c" text-anchor="middle" font-weight="bold">یال بحرانی شبکه</text>

  <!-- Shield icon = reinforcement priority -->
  <g transform="translate(590,150)">
    <path d="M 18,0 L 36,8 L 36,24 C 36,38 18,48 18,48 C 18,48 0,38 0,24 L 0,8 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <path d="M 10,24 L 16,30 L 27,16" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="608" y="232" font-family="Vazirmatn" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">اولویت تقویت</text>

  <!-- Relief depot node -->
  <g transform="translate(100,95)">
    <circle cx="25" cy="25" r="26" fill="#1d4ed8"/>
    <text x="25" y="32" font-family="Vazirmatn" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">D</text>
  </g>
  <text x="125" y="178" font-family="Vazirmatn" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="bold">انبار امداد</text>

  <!-- Hospital -->
  <g transform="translate(590,355)">
    <rect x="0" y="0" width="90" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <rect x="35" y="18" width="20" height="20" fill="#ef4444"/>
    <rect x="40" y="10" width="10" height="36" fill="#ef4444"/>
    <rect x="15" y="26" width="10" height="20" fill="#ef4444"/>
  </g>
  <text x="635" y="435" font-family="Vazirmatn" font-size="16" fill="#334155" text-anchor="middle" font-weight="bold">بیمارستان</text>

  <!-- Bottom caption -->
  <text x="400" y="480" font-family="Vazirmatn" font-size="20" fill="#334155" text-anchor="middle" font-weight="bold">شناسایی یال‌های حیاتی شبکه در برابر اخلال</text>
</svg>
