<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="320" height="180" fill="#ffffff"/>

  <!-- small 4-node network, centered, generous white margin -->
  <circle cx="110" cy="90" r="9" fill="#1d4ed8"/>
  <circle cx="160" cy="62" r="7" fill="#94a3b8"/>
  <circle cx="160" cy="118" r="7" fill="#94a3b8"/>
  <circle cx="210" cy="90" r="9" fill="#f97316"/>

  <line x1="160" y1="62" x2="210" y2="90" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="118" x2="210" y2="90" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="90" x2="160" y2="62" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="90" x2="160" y2="118" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- the critical/removed edge, direct -->
  <line x1="119" y1="90" x2="201" y2="90" stroke="#ef4444" stroke-width="5" stroke-linecap="round" stroke-dasharray="1.5 7"/>
  <g transform="translate(145,78)">
    <line x1="0" y1="0" x2="24" y2="24" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <line x1="24" y1="0" x2="0" y2="24" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="160" y="150" font-family="Vazirmatn" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">آسیب‌پذیری شبکه</text>
</svg>
