<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

    <!-- base street grid -->
    <g stroke="#cbd5e1" stroke-width="5">
        <line x1="300" y1="200" x2="300" y2="700"/>
        <line x1="650" y1="200" x2="650" y2="700"/>
        <line x1="1000" y1="200" x2="1000" y2="700"/>
        <line x1="1300" y1="200" x2="1300" y2="700"/>
        <line x1="200" y1="300" x2="1400" y2="300"/>
        <line x1="200" y1="500" x2="1400" y2="500"/>
        <line x1="200" y1="650" x2="1400" y2="650"/>
    </g>

    <!-- required (blocked) edges needing service, drawn thick red -->
    <line x1="300" y1="300" x2="650" y2="300" stroke="#dc2626" stroke-width="12"/>
    <line x1="650" y1="500" x2="1000" y2="500" stroke="#dc2626" stroke-width="12"/>
    <line x1="1000" y1="300" x2="1000" y2="500" stroke="#dc2626" stroke-width="12"/>

    <!-- deadhead segments of the route: travelled but not serviced -->
    <g stroke="#64748b" stroke-width="6" stroke-dasharray="4,10" stroke-linecap="round">
        <line x1="300" y1="650" x2="300" y2="500"/>
        <line x1="300" y1="500" x2="300" y2="300"/>
        <line x1="650" y1="300" x2="650" y2="500"/>
        <line x1="1000" y1="300" x2="1300" y2="300"/>
        <line x1="1300" y1="300" x2="1300" y2="500"/>
    </g>

    <!-- service segments of the route: drawn as blue dashes directly over the red required edges -->
    <g stroke="#2563eb" stroke-width="7" stroke-dasharray="2,16" stroke-linecap="round">
        <line x1="300" y1="300" x2="650" y2="300"/>
        <line x1="650" y1="500" x2="1000" y2="500"/>
        <line x1="1000" y1="300" x2="1000" y2="500"/>
    </g>

    <!-- order markers along the route -->
    <g font-family="Vazirmatn" font-size="22" fill="#ffffff" text-anchor="middle">
        <circle cx="300" cy="480" r="20" fill="#1e293b"/>
        <text x="300" y="488">۱</text>
        <circle cx="475" cy="300" r="20" fill="#1e293b"/>
        <text x="475" y="308">۲</text>
        <circle cx="650" cy="400" r="20" fill="#1e293b"/>
        <text x="650" y="408">۳</text>
        <circle cx="825" cy="500" r="20" fill="#1e293b"/>
        <text x="825" y="508">۴</text>
        <circle cx="1000" cy="400" r="20" fill="#1e293b"/>
        <text x="1000" y="408">۵</text>
        <circle cx="1150" cy="300" r="20" fill="#1e293b"/>
        <text x="1150" y="308">۶</text>
    </g>

    <!-- intersections -->
    <g fill="#1e293b">
        <circle cx="300" cy="300" r="8"/>
        <circle cx="650" cy="300" r="8"/>
        <circle cx="1000" cy="300" r="8"/>
        <circle cx="1300" cy="300" r="8"/>
        <circle cx="300" cy="500" r="8"/>
        <circle cx="650" cy="500" r="8"/>
        <circle cx="1000" cy="500" r="8"/>
        <circle cx="1300" cy="500" r="8"/>
        <circle cx="300" cy="650" r="8"/>
    </g>

    <!-- depot marker -->
    <rect x="255" y="615" width="90" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
    <text x="300" y="658" font-family="Vazirmatn" font-size="20" fill="#92400e" text-anchor="middle">پایگاه</text>

    <!-- hospital marker -->
    <rect x="1255" y="465" width="90" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="1300" y="508" font-family="Vazirmatn" font-size="20" fill="#166534" text-anchor="middle">مقصد</text>

    <!-- legend -->
    <line x1="200" y1="130" x2="260" y2="130" stroke="#dc2626" stroke-width="12"/>
    <text x="270" y="138" font-family="Vazirmatn" font-size="22" fill="#1e293b" text-anchor="start">یال مسدود (نیازمند
        پاکسازی)
    </text>

    <line x1="640" y1="130" x2="700" y2="130" stroke="#2563eb" stroke-width="7" stroke-dasharray="2,16"
          stroke-linecap="round"/>
    <text x="710" y="138" font-family="Vazirmatn" font-size="22" fill="#1e293b" text-anchor="start">عبور و پاکسازی روی
        همان یال
    </text>

    <line x1="1180" y1="130" x2="1240" y2="130" stroke="#64748b" stroke-width="6" stroke-dasharray="4,10"/>
    <text x="1250" y="138" font-family="Vazirmatn" font-size="22" fill="#1e293b" text-anchor="start">عبور بدون پاکسازی
        (دِدهد)
    </text>
</svg>
