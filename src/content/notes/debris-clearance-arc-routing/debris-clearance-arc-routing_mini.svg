<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

    <!-- centered scene, enlarged, with generous white margin -->
    <g transform="translate(448,170) scale(1.5)">
        <!-- rubble pile -->
        <polygon points="0,300 60,220 120,300" fill="#94a3b8" stroke="#64748b" stroke-width="3"/>
        <polygon points="50,300 100,240 160,300" fill="#b0bcc9" stroke="#64748b" stroke-width="3"/>

        <!-- truck -->
        <g transform="translate(220,180)">
            <rect x="0" y="60" width="130" height="55" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
            <rect x="15" y="30" width="60" height="35" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="3"/>
            <circle cx="25" cy="118" r="16" fill="#334155" stroke="#1e293b" stroke-width="2"/>
            <circle cx="105" cy="118" r="16" fill="#334155" stroke="#1e293b" stroke-width="2"/>
            <polyline points="75,55 130,20 170,45" fill="none" stroke="#b45309" stroke-width="8"
                      stroke-linecap="round"/>
        </g>

        <!-- dashed route -->
        <path d="M 130 340 C 260 380, 400 380, 470 340" fill="none" stroke="#2563eb" stroke-width="4"
              stroke-dasharray="10,10" marker-end="url(#arrow2)"/>
        <defs>
            <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
                <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
            </marker>
        </defs>

        <text x="150" y="380" font-family="Vazirmatn" font-size="26" fill="#1e293b" text-anchor="middle">پاکسازی آوار
        </text>
        <text x="290" y="30" font-family="Vazirmatn" font-size="24" fill="#475569" text-anchor="middle">مسیریابی کمانی
        </text>
    </g>
</svg>
