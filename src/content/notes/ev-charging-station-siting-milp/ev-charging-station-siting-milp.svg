<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- ground line / street -->
  <line x1="40" y1="430" x2="860" y2="430" stroke="#CBD5E1" stroke-width="4"/>
  <line x1="40" y1="430" x2="860" y2="430" stroke="#94A3B8" stroke-width="1" stroke-dasharray="14 10"/>

  <!-- Substation on the left -->
  <g>
    <rect x="55" y="330" width="90" height="100" rx="6" fill="#1E3A8A"/>
    <rect x="70" y="350" width="60" height="55" rx="3" fill="#ffffff"/>
    <polygon points="108,358 85,382 98,382 92,399 118,373 104,373" fill="#F59E0B"/>
    <circle cx="70" cy="330" r="6" fill="#1E3A8A"/>
    <circle cx="130" cy="330" r="6" fill="#1E3A8A"/>
    <text x="100" y="455" font-family="Vazirmatn" font-size="20" fill="#111827" text-anchor="middle">پست برق</text>
    <text x="100" y="480" font-family="Vazirmatn" font-size="16" fill="#64748B" text-anchor="middle">فیدر F1</text>
  </g>

  <!-- feeder lines to stations -->
  <path d="M145,345 L300,345 L300,390" stroke="#1E3A8A" stroke-width="3" fill="none"/>
  <path d="M145,355 L520,355 L520,390" stroke="#1E3A8A" stroke-width="3" fill="none"/>
  <path d="M145,365 L740,365 L740,390" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 6" fill="none"/>

  <!-- Charging station 1 -->
  <g>
    <rect x="285" y="390" width="30" height="80" rx="4" fill="#2563EB"/>
    <rect x="291" y="400" width="18" height="24" rx="2" fill="#ffffff"/>
    <polygon points="305,403 295,415 300,415 297,423 307,410 302,410" fill="#2563EB"/>
    <!-- car -->
    <g transform="translate(215,418)">
      <rect x="0" y="10" width="78" height="26" rx="8" fill="#0EA5E9"/>
      <rect x="14" y="-2" width="46" height="18" rx="6" fill="#0EA5E9"/>
      <circle cx="18" cy="38" r="8" fill="#111827"/>
      <circle cx="62" cy="38" r="8" fill="#111827"/>
    </g>
    <line x1="293" y1="412" x2="275" y2="420" stroke="#111827" stroke-width="2"/>
    <text x="300" y="495" font-family="Vazirmatn" font-size="18" fill="#111827" text-anchor="middle">ایستگاه ۱</text>
  </g>

  <!-- coverage circle 1 -->
  <circle cx="300" cy="430" r="95" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 6" opacity="0.6"/>
  <circle cx="245" cy="380" r="7" fill="#F59E0B"/>
  <circle cx="355" cy="385" r="7" fill="#F59E0B"/>

  <!-- Charging station 2 -->
  <g>
    <rect x="505" y="390" width="30" height="80" rx="4" fill="#2563EB"/>
    <rect x="511" y="400" width="18" height="24" rx="2" fill="#ffffff"/>
    <polygon points="525,403 515,415 520,415 517,423 527,410 522,410" fill="#2563EB"/>
    <g transform="translate(560,418)">
      <rect x="0" y="10" width="78" height="26" rx="8" fill="#10B981"/>
      <rect x="14" y="-2" width="46" height="18" rx="6" fill="#10B981"/>
      <circle cx="18" cy="38" r="8" fill="#111827"/>
      <circle cx="62" cy="38" r="8" fill="#111827"/>
    </g>
    <line x1="527" y1="412" x2="562" y2="420" stroke="#111827" stroke-width="2"/>
    <text x="520" y="495" font-family="Vazirmatn" font-size="18" fill="#111827" text-anchor="middle">ایستگاه ۲</text>
  </g>

  <circle cx="520" cy="430" r="95" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 6" opacity="0.6"/>
  <circle cx="580" cy="390" r="7" fill="#F59E0B"/>

  <!-- uncovered candidate site 3 (not built, dashed) -->
  <g opacity="0.55">
    <rect x="725" y="390" width="30" height="80" rx="4" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="740" y="495" font-family="Vazirmatn" font-size="18" fill="#64748B" text-anchor="middle">سایت کاندید</text>
  </g>
  <circle cx="820" cy="400" r="7" fill="#DC2626"/>
  <text x="820" y="380" font-family="Vazirmatn" font-size="15" fill="#DC2626" text-anchor="middle">تقاضای پوشش‌نیافته</text>

  <!-- capacity gauge near substation -->
  <g transform="translate(55,250)">
    <text x="45" y="-10" font-family="Vazirmatn" font-size="16" fill="#111827" text-anchor="middle">ظرفیت فیدر F1</text>
    <rect x="0" y="0" width="90" height="16" rx="8" fill="#E2E8F0"/>
    <rect x="0" y="0" width="63" height="16" rx="8" fill="#F59E0B"/>
  </g>

  <text x="450" y="60" font-family="Vazirmatn" font-size="30" font-weight="bold" fill="#111827" text-anchor="middle">مکان‌یابی ایستگاه شارژ خودروی برقی</text>
  <text x="450" y="98" font-family="Vazirmatn" font-size="19" fill="#475569" text-anchor="middle">محل، ظرفیت و ارتباط با فیدر شبکه توزیع</text>
</svg>
