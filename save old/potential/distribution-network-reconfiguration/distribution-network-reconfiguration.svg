<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Substation A -->
  <g>
    <rect x="60" y="90" width="70" height="60" rx="4" fill="#1e3a5f"/>
    <rect x="70" y="100" width="20" height="40" fill="#fbbf24"/>
    <rect x="100" y="100" width="20" height="40" fill="#fbbf24"/>
    <text x="95" y="170" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">پست A</text>
  </g>

  <!-- Substation B -->
  <g>
    <rect x="770" y="90" width="70" height="60" rx="4" fill="#1e3a5f"/>
    <rect x="780" y="100" width="20" height="40" fill="#fbbf24"/>
    <rect x="810" y="100" width="20" height="40" fill="#fbbf24"/>
    <text x="805" y="170" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">پست B</text>
  </g>

  <!-- Feeder A main line -->
  <path d="M 130 120 L 250 120 L 250 260 L 400 260" stroke="#2563eb" stroke-width="5" fill="none"/>
  <!-- Feeder B main line -->
  <path d="M 770 120 L 620 120 L 620 260 L 480 260" stroke="#059669" stroke-width="5" fill="none"/>

  <!-- Houses on Feeder A -->
  <g>
    <path d="M180 90 l16 -14 l16 14 v22 h-32 z" fill="#93c5fd" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="196" y="70" font-size="12" text-anchor="middle" fill="#1e3a5f">مشتری A1</text>
  </g>
  <g>
    <path d="M235 220 l16 -14 l16 14 v40 h-32 z" fill="#93c5fd" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="251" y="200" font-size="12" text-anchor="middle" fill="#1e3a5f">مشتری A2</text>
  </g>
  <g>
    <path d="M340 240 l16 -14 l16 14 v40 h-32 z" fill="#93c5fd" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="356" y="220" font-size="12" text-anchor="middle" fill="#1e3a5f">مشتری A3</text>
  </g>

  <!-- Houses on Feeder B -->
  <g>
    <path d="M690 90 l16 -14 l16 14 v22 h-32 z" fill="#a7f3d0" stroke="#065f46" stroke-width="1.5"/>
    <text x="706" y="70" font-size="12" text-anchor="middle" fill="#065f46">مشتری B1</text>
  </g>
  <g>
    <path d="M605 220 l16 -14 l16 14 v40 h-32 z" fill="#a7f3d0" stroke="#065f46" stroke-width="1.5"/>
    <text x="621" y="200" font-size="12" text-anchor="middle" fill="#065f46">مشتری B2</text>
  </g>
  <g>
    <path d="M500 240 l16 -14 l16 14 v40 h-32 z" fill="#a7f3d0" stroke="#065f46" stroke-width="1.5"/>
    <text x="516" y="220" font-size="12" text-anchor="middle" fill="#065f46">مشتری B3</text>
  </g>

  <!-- Sectionalizing switch (normally closed) on Feeder A -->
  <g>
    <circle cx="250" cy="190" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M244 190 l6 6 l10 -12" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="215" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">کلید بسته</text>
  </g>

  <!-- Sectionalizing switch (normally closed) on Feeder B -->
  <g>
    <circle cx="620" cy="190" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M614 190 l6 6 l10 -12" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="620" y="215" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">کلید بسته</text>
  </g>

  <!-- Tie switch between feeders: currently OPEN (dashed, red X) -->
  <path d="M400 260 L480 260" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6" fill="none"/>
  <circle cx="440" cy="260" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <path d="M433 253 l14 14 M447 253 l-14 14" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="440" y="295" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">کلید پیوندی (باز)</text>

  <!-- Fault marker on Feeder A -->
  <g>
    <circle cx="356" cy="260" r="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="356" y="264" font-size="14" text-anchor="middle" fill="#b91c1c" font-weight="bold">×</text>
    <text x="356" y="330" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">خرابی خط</text>
  </g>

  <!-- Arrow showing reconfiguration action -->
  <g>
    <path d="M 300 400 C 400 460, 480 460, 580 400" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="440" y="440" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">بازآرایی: باز و بسته‌کردن کلیدها</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Legend: after reconfiguration -->
  <g>
    <rect x="120" y="470" width="660" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="450" y="495" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">بعد از بازآرایی: کلید پیوندی بسته می‌شود، کلید نزدیک خرابی باز می‌شود،</text>
    <text x="450" y="518" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">و مشتریان A3/B3 از فیدر B دوباره برق‌دار می‌شوند.</text>
  </g>

  <text x="450" y="35" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="bold">بازآرایی شبکه توزیع با کلیدزنی</text>
</svg>
