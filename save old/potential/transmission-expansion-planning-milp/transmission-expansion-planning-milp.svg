<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title area left blank, image is purely conceptual -->

  <!-- Existing lines (solid, blue) -->
  <line x1="120" y1="120" x2="300" y2="90"  stroke="#1d4ed8" stroke-width="4"/>
  <line x1="300" y1="90"  x2="480" y2="130" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="120" y1="120" x2="150" y2="320" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="150" y1="320" x2="330" y2="380" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="480" y1="130" x2="640" y2="180" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="480" y1="130" x2="500" y2="330" stroke="#1d4ed8" stroke-width="4"/>

  <!-- Overloaded existing line highlighted -->
  <line x1="330" y1="380" x2="500" y2="330" stroke="#dc2626" stroke-width="6"/>
  <text x="390" y="390" font-size="15" fill="#dc2626" font-weight="bold">گلوگاه پرباری</text>

  <!-- Candidate new lines (dashed, orange) -->
  <line x1="150" y1="320" x2="640" y2="180" stroke="#f97316" stroke-width="5" stroke-dasharray="12,8"/>
  <line x1="300" y1="90" x2="500" y2="330" stroke="#f97316" stroke-width="5" stroke-dasharray="12,8"/>

  <!-- Buses (nodes) -->
  <circle cx="120" cy="120" r="16" fill="#1e3a8a"/>
  <circle cx="300" cy="90"  r="16" fill="#1e3a8a"/>
  <circle cx="480" cy="130" r="16" fill="#1e3a8a"/>
  <circle cx="640" cy="180" r="16" fill="#1e3a8a"/>
  <circle cx="150" cy="320" r="16" fill="#1e3a8a"/>
  <circle cx="330" cy="380" r="16" fill="#1e3a8a"/>
  <circle cx="500" cy="330" r="16" fill="#1e3a8a"/>

  <!-- Generator icon at bus 1 -->
  <circle cx="90" cy="90" r="20" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <path d="M 78 90 Q 84 78, 90 90 Q 96 102, 102 90" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="60" y="65" font-size="14" fill="#16a34a" font-weight="bold">نیروگاه</text>

  <!-- Wind farm icon at bus 4 (far, needs new transmission) -->
  <circle cx="690" cy="150" r="20" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
  <line x1="690" y1="150" x2="690" y2="130" stroke="#0891b2" stroke-width="3"/>
  <line x1="690" y1="150" x2="704" y2="140" stroke="#0891b2" stroke-width="3"/>
  <line x1="690" y1="150" x2="678" y2="140" stroke="#0891b2" stroke-width="3"/>
  <text x="660" y="120" font-size="14" fill="#0891b2" font-weight="bold">مزرعه بادی</text>

  <!-- Load icon at bus 6 -->
  <rect x="315" y="415" width="30" height="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="290" y="465" font-size="14" fill="#7c3aed" font-weight="bold">مرکز مصرف</text>

  <!-- Power flow arrow -->
  <path d="M 210 205 L 250 190" stroke="#1d4ed8" stroke-width="0" fill="none"/>
  <polygon points="395,335 385,325 385,345" fill="#dc2626"/>

  <!-- Legend -->
  <rect x="560" y="380" width="220" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <line x1="575" y1="400" x2="610" y2="400" stroke="#1d4ed8" stroke-width="4"/>
  <text x="618" y="405" font-size="14" fill="#111827">خط موجود</text>
  <line x1="575" y1="425" x2="610" y2="425" stroke="#f97316" stroke-width="5" stroke-dasharray="8,6"/>
  <text x="618" y="430" font-size="14" fill="#111827">خط کاندید جدید</text>
  <line x1="575" y1="450" x2="610" y2="450" stroke="#dc2626" stroke-width="5"/>
  <text x="618" y="455" font-size="14" fill="#111827">خط پرمصرف/گلوگاه</text>
  <circle cx="583" cy="470" r="8" fill="#1e3a8a"/>
  <text x="618" y="475" font-size="14" fill="#111827">پست (شینه)</text>
</svg>
