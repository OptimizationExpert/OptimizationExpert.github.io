<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Title area icons -->
  <text x="40" y="40" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">برنامه‌ریزی شارژ/دشارژ باتری</text>

  <!-- Battery icon -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="60" height="30" rx="4" fill="none" stroke="#0f766e" stroke-width="3"/>
    <rect x="60" y="8" width="8" height="14" fill="#0f766e"/>
    <rect x="4" y="4" width="30" height="22" fill="#0f766e" opacity="0.7"/>
  </g>

  <!-- Price curve chart -->
  <g transform="translate(60,120)">
    <text x="0" y="-10" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" fill="#334155">قیمت برق در طول شبانه‌روز (تومان/کیلووات‌ساعت)</text>
    <line x1="0" y1="140" x2="680" y2="140" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#94a3b8" stroke-width="2"/>
    <polyline points="0,110 60,115 120,120 180,100 240,60 300,30 360,20 420,35 480,70 540,100 600,110 660,90"
      fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="660" y="160" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#64748b">ساعت</text>
  </g>

  <!-- SoC chart -->
  <g transform="translate(60,300)">
    <text x="0" y="-10" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" fill="#334155">سطح شارژ باتری (State of Charge)</text>
    <line x1="0" y1="140" x2="680" y2="140" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#94a3b8" stroke-width="2"/>

    <!-- SoC area fill -->
    <polygon points="0,110 60,90 120,60 180,40 240,20 300,20 360,30 420,60 480,90 540,120 600,130 660,120 660,140 0,140"
      fill="#0f766e" opacity="0.15"/>
    <polyline points="0,110 60,90 120,60 180,40 240,20 300,20 360,30 420,60 480,90 540,120 600,130 660,120"
      fill="none" stroke="#0f766e" stroke-width="3"/>

    <!-- charge/discharge arrows -->
    <g font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#0369a1">
      <line x1="60" y1="180" x2="60" y2="150" stroke="#0369a1" stroke-width="2" marker-end="url(#arrowUp)"/>
      <text x="30" y="200" fill="#0369a1">شارژ</text>

      <line x1="420" y1="150" x2="420" y2="180" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowDown)"/>
      <text x="400" y="200" fill="#b91c1c">دشارژ</text>

      <line x1="600" y1="180" x2="600" y2="150" stroke="#0369a1" stroke-width="2" marker-end="url(#arrowUp)"/>
      <text x="570" y="200" fill="#0369a1">شارژ</text>
    </g>
  </g>

  <defs>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#0369a1"/>
    </marker>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g transform="translate(560,60)" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12">
    <rect x="0" y="0" width="14" height="14" fill="#f59e0b"/>
    <text x="20" y="12" fill="#334155">قیمت برق</text>
    <rect x="0" y="22" width="14" height="14" fill="#0f766e"/>
    <text x="20" y="34" fill="#334155">سطح شارژ</text>
  </g>
</svg>
