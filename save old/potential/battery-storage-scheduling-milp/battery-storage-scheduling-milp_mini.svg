<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="#ffffff"/>

  <!-- Simple battery icon -->
  <g transform="translate(100,60)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="none" stroke="#0f766e" stroke-width="4"/>
    <rect x="80" y="12" width="10" height="16" fill="#0f766e"/>
    <rect x="6" y="6" width="45" height="28" fill="#0f766e" opacity="0.7"/>
  </g>

  <!-- Minimal SoC wave -->
  <g transform="translate(40,150)">
    <polyline points="0,60 40,40 80,20 120,20 160,40 200,60 220,50"
      fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="90" x2="220" y2="90" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- small arrows -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="70" y1="260" x2="70" y2="235" stroke="#0369a1" marker-end="url(#u2)"/>
    <line x1="220" y1="235" x2="220" y2="260" stroke="#b91c1c" marker-end="url(#d2)"/>
  </g>

  <defs>
    <marker id="u2" markerWidth="10" markerHeight="10" refX="5" refY="0" orient="auto">
      <path d="M0,10 L5,0 L10,10 Z" fill="#0369a1"/>
    </marker>
    <marker id="d2" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
      <path d="M0,0 L10,0 L5,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
