<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="300" height="220" fill="#ffffff"/>

  <!-- terminal block -->
  <rect x="100" y="60" width="100" height="100" fill="#eef2f7" stroke="#334155" stroke-width="3"/>

  <!-- doors -->
  <rect x="100" y="75" width="10" height="20" fill="#0ea5e9"/>
  <rect x="100" y="105" width="10" height="20" fill="#0ea5e9"/>
  <rect x="100" y="135" width="10" height="20" fill="#0ea5e9"/>
  <rect x="190" y="75" width="10" height="20" fill="#f59e0b"/>
  <rect x="190" y="105" width="10" height="20" fill="#f59e0b"/>
  <rect x="190" y="135" width="10" height="20" fill="#f59e0b"/>

  <!-- inbound truck -->
  <g transform="translate(20,78)">
    <rect x="0" y="0" width="45" height="20" rx="3" fill="#0ea5e9"/>
    <circle cx="10" cy="21" r="4" fill="#1e293b"/>
    <circle cx="35" cy="21" r="4" fill="#1e293b"/>
  </g>
  <g transform="translate(20,128)">
    <rect x="0" y="0" width="45" height="20" rx="3" fill="#0ea5e9"/>
    <circle cx="10" cy="21" r="4" fill="#1e293b"/>
    <circle cx="35" cy="21" r="4" fill="#1e293b"/>
  </g>

  <!-- outbound truck -->
  <g transform="translate(235,78)">
    <rect x="0" y="0" width="45" height="20" rx="3" fill="#f59e0b"/>
    <circle cx="10" cy="21" r="4" fill="#1e293b"/>
    <circle cx="35" cy="21" r="4" fill="#1e293b"/>
  </g>
  <g transform="translate(235,128)">
    <rect x="0" y="0" width="45" height="20" rx="3" fill="#f59e0b"/>
    <circle cx="10" cy="21" r="4" fill="#1e293b"/>
    <circle cx="35" cy="21" r="4" fill="#1e293b"/>
  </g>

  <!-- connecting lines -->
  <line x1="65" y1="88" x2="100" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="138" x2="100" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="85" x2="235" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="145" x2="235" y2="138" stroke="#94a3b8" stroke-width="2"/>

  <!-- pallet flow -->
  <rect x="130" y="95" width="14" height="14" fill="#22c55e"/>
  <rect x="155" y="120" width="14" height="14" fill="#22c55e"/>

  <text x="150" y="195" text-anchor="middle" font-size="13" fill="#334155">کراس‌داکینگ</text>
</svg>
