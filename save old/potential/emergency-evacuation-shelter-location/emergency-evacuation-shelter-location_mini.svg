<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- danger zone -->
  <rect x="25" y="90" width="90" height="90" rx="8" fill="#fff1ee" stroke="#e04b34" stroke-width="2" stroke-dasharray="5,4"/>
  <g fill="#f2a08e" stroke="#c23a26" stroke-width="1.2">
    <rect x="45" y="115" width="22" height="18"/>
    <polygon points="43,115 56,104 69,115"/>
    <rect x="78" y="140" width="22" height="18"/>
    <polygon points="76,140 89,129 102,140"/>
  </g>
  <text x="70" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#c23a26">منطقه خطر</text>

  <!-- road -->
  <path d="M 115 130 C 160 130, 180 150, 205 150" stroke="#8d8d8d" stroke-width="7" fill="none"/>
  <path d="M 115 130 C 160 130, 180 150, 205 150" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,6" fill="none"/>
  <polygon points="198,143 212,150 198,157" fill="#2f7d4f"/>

  <!-- shelter -->
  <rect x="205" y="115" width="70" height="70" rx="8" fill="#eaf6ef" stroke="#2f7d4f" stroke-width="2"/>
  <rect x="222" y="145" width="36" height="30" fill="#bfe3cd" stroke="#2f7d4f" stroke-width="1.5"/>
  <polygon points="217,145 240,125 263,145" fill="#2f7d4f"/>
  <text x="240" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c38">پناهگاه</text>
  <text x="240" y="197" text-anchor="middle" font-size="11" fill="#1f5c38">ظرفیت محدود</text>

  <text x="150" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a2a2a">تخلیه اضطراری</text>
  <text x="150" y="250" text-anchor="middle" font-size="12" fill="#6b6b6b">مکان‌یابی پناهگاه</text>
</svg>
