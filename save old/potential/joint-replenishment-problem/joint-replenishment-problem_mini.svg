<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" fill="#ffffff"/>

  <!-- Joint order highlight bands -->
  <rect x="55" y="20" width="14" height="150" fill="#f97316" opacity="0.15"/>
  <rect x="140" y="20" width="14" height="150" fill="#f97316" opacity="0.15"/>

  <!-- three item rows -->
  <line x1="30" y1="50" x2="180" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="30" y1="100" x2="180" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="30" y1="150" x2="180" y2="150" stroke="#e2e8f0" stroke-width="1"/>

  <circle cx="62" cy="50" r="8" fill="#1d4ed8"/>
  <circle cx="147" cy="50" r="8" fill="#1d4ed8"/>

  <circle cx="62" cy="100" r="8" fill="#0d9488"/>
  <circle cx="147" cy="100" r="8" fill="#0d9488"/>

  <circle cx="62" cy="150" r="8" fill="#b45309"/>
  <circle cx="147" cy="150" r="8" fill="#b45309"/>

  <line x1="20" y1="175" x2="185" y2="175" stroke="#94a3b8" stroke-width="2"/>
</svg>
