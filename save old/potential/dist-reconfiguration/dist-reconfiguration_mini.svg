<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="240" height="240" fill="#ffffff"/>

  <!-- Substation -->
  <rect x="20" y="100" width="34" height="40" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2.5"/>

  <!-- Feeder A -->
  <line x1="54" y1="112" x2="130" y2="70" stroke="#2563eb" stroke-width="3.5"/>
  <line x1="130" y1="70" x2="200" y2="60" stroke="#2563eb" stroke-width="3.5"/>
  <rect x="122" y="63" width="10" height="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>

  <!-- Feeder B -->
  <line x1="54" y1="128" x2="130" y2="170" stroke="#16a34a" stroke-width="3.5"/>
  <line x1="130" y1="170" x2="200" y2="180" stroke="#16a34a" stroke-width="3.5"/>
  <rect x="122" y="165" width="10" height="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>

  <!-- Tie switch (open) -->
  <line x1="200" y1="60" x2="200" y2="180" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7,6"/>
  <rect x="188" y="112" width="24" height="16" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>

  <circle cx="200" cy="60" r="7" fill="#ef4444"/>
  <circle cx="200" cy="180" r="7" fill="#94a3b8"/>

  <text x="120" y="220" text-anchor="middle" font-size="15" fill="#1e3a5f" font-weight="bold">بازآرایی شبکه توزیع</text>
</svg>
