<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <text x="400" y="35" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-weight="bold">تخصیص اسکله: کدام کشتی کجا پهلو بگیرد؟</text>

  <!-- water -->
  <rect x="40" y="60" width="720" height="330" fill="#E0F2FE"/>
  <path d="M40 90 q20 8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#BAE6FD" stroke-width="2" fill="none"/>
  <path d="M40 140 q20 8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#BAE6FD" stroke-width="2" fill="none"/>

  <!-- quay wall -->
  <rect x="0" y="60" width="40" height="330" fill="#94A3B8"/>
  <rect x="0" y="60" width="40" height="330" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="20" y="250" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" transform="rotate(-90 20 250)">اسکله (Quay)</text>

  <!-- berth divider lines and numbers -->
  <line x1="40" y1="140" x2="760" y2="140" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="40" y1="230" x2="760" y2="230" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="40" y1="320" x2="760" y2="320" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="55" y="95" font-size="13" fill="#475569" font-family="Vazirmatn, Tahoma, Arial, sans-serif">بخش ۱ اسکله</text>
  <text x="55" y="185" font-size="13" fill="#475569" font-family="Vazirmatn, Tahoma, Arial, sans-serif">بخش ۲ اسکله</text>
  <text x="55" y="275" font-size="13" fill="#475569" font-family="Vazirmatn, Tahoma, Arial, sans-serif">بخش ۳ اسکله</text>
  <text x="55" y="365" font-size="13" fill="#475569" font-family="Vazirmatn, Tahoma, Arial, sans-serif">بخش ۴ اسکله</text>

  <!-- cranes on the quay -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <line x1="15" y1="60" x2="15" y2="20"/>
    <line x1="15" y1="20" x2="60" y2="20"/>
    <line x1="45" y1="20" x2="45" y2="35"/>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none">
    <line x1="15" y1="230" x2="15" y2="190"/>
    <line x1="15" y1="190" x2="60" y2="190"/>
    <line x1="45" y1="190" x2="45" y2="205"/>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none">
    <line x1="15" y1="330" x2="15" y2="290"/>
    <line x1="15" y1="290" x2="60" y2="290"/>
    <line x1="45" y1="290" x2="45" y2="305"/>
  </g>

  <!-- Ship shapes docked at berth (hull + containers) -->
  <!-- Ship A - berth 1, early -->
  <g>
    <path d="M60 75 L260 75 L250 125 L70 125 Z" fill="#2563EB"/>
    <rect x="80" y="60" width="20" height="15" fill="#1D4ED8"/>
    <rect x="110" y="60" width="20" height="15" fill="#1D4ED8"/>
    <rect x="140" y="60" width="20" height="15" fill="#1D4ED8"/>
    <rect x="170" y="60" width="20" height="15" fill="#1D4ED8"/>
    <text x="160" y="105" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">کشتی A</text>
  </g>

  <!-- Ship B - berth 1, later -->
  <g>
    <path d="M300 75 L520 75 L508 125 L312 125 Z" fill="#0891B2"/>
    <rect x="330" y="60" width="20" height="15" fill="#0E7490"/>
    <rect x="360" y="60" width="20" height="15" fill="#0E7490"/>
    <rect x="390" y="60" width="20" height="15" fill="#0E7490"/>
    <text x="410" y="105" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">کشتی B</text>
  </g>

  <!-- Ship C - berth 2 -->
  <g>
    <path d="M80 165 L340 165 L328 215 L92 215 Z" fill="#F97316"/>
    <rect x="110" y="150" width="20" height="15" fill="#EA580C"/>
    <rect x="150" y="150" width="20" height="15" fill="#EA580C"/>
    <rect x="190" y="150" width="20" height="15" fill="#EA580C"/>
    <rect x="230" y="150" width="20" height="15" fill="#EA580C"/>
    <text x="210" y="195" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">کشتی C</text>
  </g>

  <!-- Ship D - berth 3 -->
  <g>
    <path d="M60 255 L380 255 L368 305 L72 305 Z" fill="#059669"/>
    <rect x="100" y="240" width="20" height="15" fill="#047857"/>
    <rect x="140" y="240" width="20" height="15" fill="#047857"/>
    <rect x="180" y="240" width="20" height="15" fill="#047857"/>
    <rect x="220" y="240" width="20" height="15" fill="#047857"/>
    <rect x="260" y="240" width="20" height="15" fill="#047857"/>
    <text x="220" y="285" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">کشتی D</text>
  </g>

  <!-- Ship E - berth 4 -->
  <g>
    <path d="M90 345 L420 345 L408 385 L102 385 Z" fill="#7C3AED"/>
    <rect x="130" y="332" width="18" height="13" fill="#6D28D9"/>
    <rect x="165" y="332" width="18" height="13" fill="#6D28D9"/>
    <rect x="200" y="332" width="18" height="13" fill="#6D28D9"/>
    <rect x="235" y="332" width="18" height="13" fill="#6D28D9"/>
    <text x="250" y="370" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">کشتی E</text>
  </g>

  <!-- waiting ship far from quay, small, out on the water -->
  <g>
    <path d="M600 250 L680 250 L674 270 L606 270 Z" fill="#94A3B8"/>
    <rect x="615" y="242" width="12" height="8" fill="#64748B"/>
    <rect x="635" y="242" width="12" height="8" fill="#64748B"/>
    <text x="640" y="290" font-size="13" fill="#475569" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">در صف انتظار</text>
  </g>

  <!-- anchor icon -->
  <text x="700" y="70" font-size="16" fill="#0EA5E9" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">⚓</text>

  <text x="400" y="475" font-size="16" fill="#475569" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif">هر کشتی باید در فضای درست اسکله و زمان درست پهلو بگیرد</text>
</svg>
