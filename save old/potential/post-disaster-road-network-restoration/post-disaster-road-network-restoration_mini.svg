<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- River -->
  <path d="M 0,190 C 60,170 120,210 180,185 C 220,168 260,195 300,180 L 300,225 C 260,240 220,215 180,232 C 120,257 60,220 0,235 Z" fill="#bfe3f5" opacity="0.7"/>

  <!-- Intact roads -->
  <path d="M 30,70 L 110,85" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 110,85 L 110,170" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 210,85 L 270,70" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 210,85 L 210,170" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 110,85 L 210,85" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Damaged segments -->
  <path d="M 110,170 L 145,190" stroke="#ef4444" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="3 7"/>
  <path d="M 175,190 L 210,170" stroke="#ef4444" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="3 7"/>

  <!-- Broken bridge -->
  <rect x="132" y="178" width="30" height="14" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2" transform="rotate(-8 147 185)"/>
  <rect x="168" y="178" width="30" height="14" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2" transform="rotate(8 183 185)"/>

  <!-- Repair truck -->
  <g transform="translate(120,205)">
    <rect x="0" y="6" width="26" height="15" rx="2" fill="#f97316"/>
    <rect x="22" y="0" width="13" height="19" rx="2" fill="#fb923c"/>
    <circle cx="7" cy="22" r="4" fill="#334155"/>
    <circle cx="26" cy="22" r="4" fill="#334155"/>
  </g>

  <!-- Hospital -->
  <g transform="translate(15,25)">
    <rect x="0" y="0" width="40" height="28" rx="3" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="15" y="8" width="10" height="10" fill="#ef4444"/>
  </g>

  <!-- Relief camp -->
  <g transform="translate(240,25)">
    <polygon points="0,26 12,5 24,26" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
    <polygon points="17,26 29,5 41,26" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
  </g>

  <!-- Depot node -->
  <g transform="translate(140,25)">
    <circle cx="10" cy="10" r="12" fill="#1d4ed8"/>
    <text x="10" y="15" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">D</text>
  </g>

  <text x="150" y="285" font-size="13" fill="#334155" text-anchor="middle" font-weight="bold">بازسازی شبکه پس از بلایا</text>
</svg>
