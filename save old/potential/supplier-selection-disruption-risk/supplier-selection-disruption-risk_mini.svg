<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="200" height="200" fill="#ffffff"/>

  <!-- Factory -->
  <g transform="translate(130,80)">
    <rect x="0" y="0" width="55" height="45" fill="#e5e7eb" stroke="#374151" stroke-width="2" rx="4"/>
    <polygon points="6,0 16,-14 16,0" fill="#9ca3af" stroke="#374151"/>
    <polygon points="24,0 34,-16 34,0" fill="#9ca3af" stroke="#374151"/>
    <text x="27" y="60" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="bold">کارخانه</text>
  </g>

  <!-- Disrupted supplier -->
  <rect x="15" y="20" width="55" height="35" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <line x1="70" y1="37" x2="128" y2="90" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,5"/>
  <g transform="translate(95,60)">
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#b91c1c" stroke-width="2.5"/>
    <line x1="-6" y1="6" x2="6" y2="-6" stroke="#b91c1c" stroke-width="2.5"/>
  </g>

  <!-- Backup suppliers -->
  <rect x="15" y="75" width="55" height="35" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <line x1="70" y1="92" x2="128" y2="100" stroke="#16a34a" stroke-width="3"/>

  <rect x="15" y="130" width="55" height="35" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <line x1="70" y1="147" x2="128" y2="115" stroke="#16a34a" stroke-width="3"/>
</svg>
