<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">طراحی شبکه توزیع سبز</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#6b7280">مبادله بین هزینه حمل و انتشار کربن</text>

  <!-- Warehouse A (far, cheap route but high emission) -->
  <rect x="90" y="150" width="70" height="60" rx="8" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>
  <text x="125" y="185" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">B</text>
  <text x="125" y="228" text-anchor="middle" font-size="12" fill="#7c2d12">انبار دور / ارزان</text>

  <!-- Warehouse B (near, greener route) -->
  <rect x="90" y="290" width="70" height="60" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <text x="125" y="325" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">A</text>
  <text x="125" y="368" text-anchor="middle" font-size="12" fill="#14532d">انبار نزدیک / سبز</text>

  <!-- Customers -->
  <circle cx="620" cy="130" r="26" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="620" y="135" text-anchor="middle" font-size="12" fill="#1f2937">شهر ۱</text>

  <circle cx="680" cy="250" r="26" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="680" y="255" text-anchor="middle" font-size="12" fill="#1f2937">شهر ۲</text>

  <circle cx="620" cy="370" r="26" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="620" y="375" text-anchor="middle" font-size="12" fill="#1f2937">شهر ۳</text>

  <!-- Routes from Warehouse B (orange, high emission, dashed smoke) -->
  <line x1="160" y1="175" x2="594" y2="135" stroke="#f97316" stroke-width="3"/>
  <line x1="160" y1="185" x2="654" y2="252" stroke="#f97316" stroke-width="3"/>

  <!-- Routes from Warehouse A (green, low emission) -->
  <line x1="160" y1="310" x2="654" y2="255" stroke="#16a34a" stroke-width="3"/>
  <line x1="160" y1="320" x2="594" y2="368" stroke="#16a34a" stroke-width="3"/>

  <!-- Emission cloud icon near orange routes -->
  <g transform="translate(340,105)">
    <circle cx="0" cy="0" r="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="14" cy="-4" r="13" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="28" cy="0" r="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="14" y="28" text-anchor="middle" font-size="11" fill="#92400e">CO2 بیشتر</text>
  </g>

  <!-- Leaf icon near green routes -->
  <g transform="translate(340,300)">
    <path d="M0,10 C10,-15 35,-15 40,5 C25,20 5,20 0,10 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="18" y="34" text-anchor="middle" font-size="11" fill="#14532d">CO2 کمتر</text>
  </g>

  <!-- Legend -->
  <rect x="60" y="410" width="18" height="6" fill="#f97316"/>
  <text x="85" y="418" font-size="12" fill="#374151">مسیر ارزان‌تر / پرکربن‌تر</text>
  <rect x="330" y="410" width="18" height="6" fill="#16a34a"/>
  <text x="355" y="418" font-size="12" fill="#374151">مسیر سبز / کم‌کربن‌تر</text>
</svg>
