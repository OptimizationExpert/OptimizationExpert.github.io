<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">یک خط تولید، سه محصول، یک چرخه مشترک</text>

  <!-- Machine body -->
  <g>
    <rect x="60" y="90" width="150" height="120" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <rect x="80" y="110" width="110" height="30" rx="4" fill="#9ca3af"/>
    <circle cx="95" cy="165" r="10" fill="#6b7280"/>
    <circle cx="125" cy="165" r="10" fill="#6b7280"/>
    <circle cx="155" cy="165" r="10" fill="#6b7280"/>
    <rect x="80" y="185" width="110" height="14" rx="4" fill="#6b7280"/>
    <text x="135" y="235" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">خط پرکنی مشترک</text>
    <!-- conveyor arrow -->
    <path d="M 210 150 L 250 150" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Timeline base -->
  <line x1="260" y1="270" x2="860" y2="270" stroke="#9ca3af" stroke-width="2"/>
  <text x="860" y="290" text-anchor="end" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" fill="#6b7280">زمان</text>

  <!-- Product A block -->
  <rect x="270" y="220" width="35" height="30" fill="#f59e0b"/>
  <text x="287" y="215" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#92400e">تعویض</text>
  <rect x="305" y="215" width="130" height="40" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="370" y="240" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">محصول A</text>

  <!-- Product B block -->
  <rect x="435" y="220" width="30" height="30" fill="#3b82f6"/>
  <text x="450" y="215" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#1e3a8a">تعویض</text>
  <rect x="465" y="215" width="95" height="40" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="512" y="240" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">محصول B</text>

  <!-- Product C block -->
  <rect x="560" y="220" width="25" height="30" fill="#10b981"/>
  <text x="572" y="215" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#065f46">تعویض</text>
  <rect x="585" y="215" width="110" height="40" rx="4" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="640" y="240" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">محصول C</text>

  <!-- Cycle bracket -->
  <path d="M 270 300 L 270 310 L 695 310 L 695 300" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="482" y="328" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="15" font-weight="bold" fill="#374151">طول چرخه مشترک T</text>

  <!-- second cycle faded, indicates repetition -->
  <g opacity="0.35">
    <rect x="710" y="220" width="30" height="30" fill="#f59e0b"/>
    <rect x="740" y="215" width="60" height="40" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <text x="770" y="240" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">A</text>
    <text x="770" y="205" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#6b7280">چرخه بعدی...</text>
  </g>

  <!-- Inventory curves -->
  <text x="150" y="360" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">سطح موجودی هر محصول در طول چرخه</text>

  <!-- axis -->
  <line x1="150" y1="380" x2="820" y2="380" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="150" y1="380" x2="150" y2="460" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- sawtooth A -->
  <polyline points="150,460 200,395 305,460" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- sawtooth B -->
  <polyline points="305,460 400,415 465,460" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <!-- sawtooth C -->
  <polyline points="465,460 520,430 585,460" fill="none" stroke="#10b981" stroke-width="3"/>
  <polyline points="585,460 640,440 695,460" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="200" y="475" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#92400e">A</text>
  <text x="400" y="475" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#1e3a8a">B</text>
  <text x="520" y="475" text-anchor="middle" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#065f46">C</text>
</svg>
