<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Title label -->
  <text x="400" y="40" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f766e" text-anchor="middle">گراف تبادل زوجی کلیه</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 2-cycle: A <-> B -->
  <g>
    <circle cx="150" cy="150" r="42" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="150" y="145" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">زوج A</text>
    <text x="150" y="163" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle">اهدا‌کننده/گیرنده</text>

    <circle cx="330" cy="150" r="42" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>
    <text x="330" y="145" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="middle">زوج B</text>
    <text x="330" y="163" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle">اهدا‌کننده/گیرنده</text>

    <path d="M 195 138 Q 240 110 288 138" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 288 165 Q 240 195 195 165" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="240" y="100" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle">کلیه سازگار</text>
  </g>

  <!-- 3-cycle: C -> D -> E -> C -->
  <g>
    <circle cx="580" cy="120" r="42" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="580" y="115" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">زوج C</text>
    <text x="580" y="133" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle">اهدا‌کننده/گیرنده</text>

    <circle cx="700" cy="230" r="42" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="700" y="225" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">زوج D</text>
    <text x="700" y="243" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle">اهدا‌کننده/گیرنده</text>

    <circle cx="500" cy="260" r="42" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="500" y="255" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">زوج E</text>
    <text x="500" y="273" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle">اهدا‌کننده/گیرنده</text>

    <path d="M 615 140 L 665 200" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 665 250 L 540 258" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 500 218 L 560 150" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- Unselected / infeasible edges (grayed) -->
  <path d="M 372 165 Q 440 210 460 245" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="420" y="220" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">ناسازگار</text>

  <!-- Legend -->
  <rect x="40" y="380" width="20" height="20" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
  <text x="70" y="396" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" fill="#334155">چرخه دوتایی انتخاب‌شده</text>

  <rect x="40" y="410" width="20" height="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="70" y="426" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" fill="#334155">چرخه سه‌تایی انتخاب‌شده</text>

  <line x1="40" y1="450" x2="60" y2="450" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="70" y="454" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" fill="#334155">یال ناسازگار / انتخاب‌نشده</text>

  <text x="400" y="480" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">هر یال جهت‌دار: «کلیه اهداکننده این زوج برای بیمار زوج بعدی سازگار است»</text>
</svg>
