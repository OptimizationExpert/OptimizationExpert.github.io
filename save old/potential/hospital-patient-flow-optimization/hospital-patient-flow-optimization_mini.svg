<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <!-- ER box -->
  <rect x="20" y="110" width="70" height="80" rx="10" fill="#fff4e6" stroke="#e07b00" stroke-width="2.5"/>
  <circle cx="40" cy="140" r="7" fill="#c9761a"/>
  <circle cx="62" cy="140" r="7" fill="#c9761a"/>
  <circle cx="40" cy="162" r="7" fill="#c9761a"/>
  <text x="55" y="200" text-anchor="middle" font-size="11" fill="#7a4400">اورژانس</text>

  <defs>
    <marker id="arrowm" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <line x1="94" y1="130" x2="150" y2="80" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrowm)"/>
  <line x1="94" y1="150" x2="150" y2="150" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrowm)"/>
  <line x1="94" y1="170" x2="150" y2="220" stroke="#5a5a5a" stroke-width="2.5" marker-end="url(#arrowm)"/>

  <!-- ICU -->
  <rect x="155" y="50" width="110" height="55" rx="10" fill="#e8f0fb" stroke="#2456a6" stroke-width="2.5"/>
  <text x="210" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#173c73">ICU</text>
  <rect x="170" y="80" width="22" height="12" fill="#2456a6"/>
  <rect x="200" y="80" width="22" height="12" fill="#2456a6"/>
  <rect x="230" y="80" width="22" height="12" fill="#9fb8dd"/>

  <!-- General ward -->
  <rect x="155" y="120" width="110" height="55" rx="10" fill="#e9f7ee" stroke="#1f8a4c" stroke-width="2.5"/>
  <text x="210" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#155c33">بخش عمومی</text>
  <rect x="170" y="150" width="22" height="12" fill="#1f8a4c"/>
  <rect x="200" y="150" width="22" height="12" fill="#a9dcbc"/>
  <rect x="230" y="150" width="22" height="12" fill="#a9dcbc"/>

  <!-- Overflow -->
  <rect x="155" y="195" width="110" height="50" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="210" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f271b">بخش سرریز</text>
  <rect x="175" y="222" width="22" height="12" fill="#c0392b"/>
  <rect x="205" y="222" width="22" height="12" fill="#f0b3ac"/>
</svg>
