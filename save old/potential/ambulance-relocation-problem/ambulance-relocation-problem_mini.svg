<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>

  <circle cx="100" cy="110" r="60" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="205" cy="170" r="60" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Station with ambulance -->
  <g transform="translate(100,110)">
    <rect x="-20" y="-16" width="40" height="32" rx="5" fill="#1e3a8a"/>
    <rect x="-14" y="-4" width="28" height="12" rx="2" fill="#ffffff"/>
    <rect x="-3" y="-10" width="6" height="6" fill="#ffffff"/>
  </g>

  <!-- Empty station -->
  <g transform="translate(205,170)">
    <rect x="-20" y="-16" width="40" height="32" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,3"/>
  </g>

  <!-- relocation arrow -->
  <path d="M 118 96 Q 160 60 190 155" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,5" marker-end="url(#arrow2)"/>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="150" y="250" text-anchor="middle" font-size="16" fill="#111827" font-weight="bold">جابه‌جایی آمبولانس</text>
</svg>
