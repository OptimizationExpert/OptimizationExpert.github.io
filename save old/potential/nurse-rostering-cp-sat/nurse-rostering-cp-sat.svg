<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f766e">برنامه هفتگی شیفت پرستاران</text>

  <!-- Legend -->
  <rect x="540" y="52" width="14" height="14" fill="#38bdf8"/>
  <text x="560" y="63" font-size="13" fill="#334155">صبح</text>
  <rect x="610" y="52" width="14" height="14" fill="#f59e0b"/>
  <text x="630" y="63" font-size="13" fill="#334155">عصر</text>
  <rect x="680" y="52" width="14" height="14" fill="#4338ca"/>
  <text x="700" y="63" font-size="13" fill="#334155">شب</text>

  <!-- Grid: 5 nurses (rows) x 7 days (cols) -->
  <!-- Column headers (days) -->
  <g font-size="13" fill="#475569">
    <text x="185" y="100" text-anchor="middle">شنبه</text>
    <text x="255" y="100" text-anchor="middle">یکشنبه</text>
    <text x="325" y="100" text-anchor="middle">دوشنبه</text>
    <text x="395" y="100" text-anchor="middle">سه‌شنبه</text>
    <text x="465" y="100" text-anchor="middle">چهارشنبه</text>
    <text x="535" y="100" text-anchor="middle">پنجشنبه</text>
    <text x="605" y="100" text-anchor="middle">جمعه</text>
  </g>

  <!-- Row labels (nurses) -->
  <g font-size="14" fill="#0f172a" font-weight="bold">
    <text x="70" y="140">پرستار ۱</text>
    <text x="70" y="192">پرستار ۲</text>
    <text x="70" y="244">پرستار ۳</text>
    <text x="70" y="296">پرستار ۴</text>
    <text x="70" y="348">پرستار ۵</text>
  </g>

  <!-- grid lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="150" y1="112" x2="150" y2="368"/>
    <line x1="220" y1="112" x2="220" y2="368"/>
    <line x1="290" y1="112" x2="290" y2="368"/>
    <line x1="360" y1="112" x2="360" y2="368"/>
    <line x1="430" y1="112" x2="430" y2="368"/>
    <line x1="500" y1="112" x2="500" y2="368"/>
    <line x1="570" y1="112" x2="570" y2="368"/>
    <line x1="640" y1="112" x2="640" y2="368"/>
    <line x1="150" y1="112" x2="640" y2="112"/>
    <line x1="150" y1="164" x2="640" y2="164"/>
    <line x1="150" y1="216" x2="640" y2="216"/>
    <line x1="150" y1="268" x2="640" y2="268"/>
    <line x1="150" y1="320" x2="640" y2="320"/>
    <line x1="150" y1="368" x2="640" y2="368"/>
  </g>

  <!-- shift blocks: colors morning=#38bdf8, evening=#f59e0b, night=#4338ca, off=none -->
  <!-- Nurse 1 -->
  <rect x="152" y="114" width="66" height="48" fill="#38bdf8"/>
  <rect x="222" y="114" width="66" height="48" fill="#38bdf8"/>
  <rect x="362" y="114" width="66" height="48" fill="#f59e0b"/>
  <rect x="432" y="114" width="66" height="48" fill="#f59e0b"/>
  <rect x="572" y="114" width="66" height="48" fill="#4338ca"/>

  <!-- Nurse 2 -->
  <rect x="222" y="166" width="66" height="48" fill="#4338ca"/>
  <rect x="362" y="166" width="66" height="48" fill="#38bdf8"/>
  <rect x="432" y="166" width="66" height="48" fill="#38bdf8"/>
  <rect x="502" y="166" width="66" height="48" fill="#f59e0b"/>

  <!-- Nurse 3 -->
  <rect x="152" y="218" width="66" height="48" fill="#f59e0b"/>
  <rect x="292" y="218" width="66" height="48" fill="#4338ca"/>
  <rect x="502" y="218" width="66" height="48" fill="#38bdf8"/>
  <rect x="572" y="218" width="66" height="48" fill="#38bdf8"/>

  <!-- Nurse 4 -->
  <rect x="222" y="270" width="66" height="48" fill="#f59e0b"/>
  <rect x="292" y="270" width="66" height="48" fill="#f59e0b"/>
  <rect x="432" y="270" width="66" height="48" fill="#4338ca"/>
  <rect x="572" y="270" width="66" height="48" fill="#38bdf8"/>

  <!-- Nurse 5 -->
  <rect x="152" y="322" width="66" height="48" fill="#4338ca"/>
  <rect x="362" y="322" width="66" height="48" fill="#4338ca"/>
  <rect x="502" y="322" width="66" height="48" fill="#f59e0b"/>
  <rect x="572" y="322" width="66" height="48" fill="#f59e0b"/>

  <!-- warning marker: forbidden night->morning highlighted -->
  <rect x="640" y="112" width="0" height="0" fill="none"/>

  <!-- bottom annotation box: constraint callout -->
  <rect x="60" y="396" width="680" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="420" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">قید ایمنی: پس از شیفت شب، شیفت صبح روز بعد ممنوع</text>
  <text x="400" y="442" text-anchor="middle" font-size="13" fill="#166534">پوشش کافی هر شیفت + توازن بار کاری بین پرستاران با CP-SAT</text>
</svg>
