<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- Facility -->
  <circle cx="100" cy="100" r="26" fill="#16a34a"/>

  <!-- Customer -->
  <rect x="150" y="55" width="34" height="34" rx="6" fill="#2563eb"/>

  <!-- Recycling node -->
  <rect x="16" y="55" width="34" height="34" rx="6" fill="#ea580c"/>

  <!-- Forward arrow: facility -> customer -->
  <defs>
    <marker id="mArrowFwd" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
    <marker id="mArrowRev" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <line x1="118" y1="86" x2="152" y2="72" stroke="#16a34a" stroke-width="3" marker-end="url(#mArrowFwd)"/>

  <!-- Reverse arrow: customer -> recycling (via facility path) -->
  <path d="M150 92 Q100 145 55 92" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#mArrowRev)"/>

  <!-- small forward arrow into facility from recycling side to hint closed loop -->
  <line x1="50" y1="86" x2="80" y2="90" stroke="#16a34a" stroke-width="3" marker-end="url(#mArrowFwd)"/>
</svg>
