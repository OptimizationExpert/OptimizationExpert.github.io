<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <!-- Title area left blank; purely conceptual diagram -->

  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="380" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="380" x2="740" y2="380" stroke="#334155" stroke-width="2"/>
  <text x="30" y="70" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" fill="#334155">موجودی</text>
  <text x="690" y="405" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" fill="#334155">زمان</text>

  <!-- Safety stock band -->
  <rect x="80" y="320" width="660" height="40" fill="#FDBA74" opacity="0.35"/>
  <text x="90" y="345" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" fill="#C2410C" font-weight="bold">موجودی اطمینان</text>

  <!-- Reorder point line -->
  <line x1="80" y1="255" x2="740" y2="255" stroke="#EA580C" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="248" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="14" fill="#EA580C" font-weight="bold">نقطه سفارش مجدد</text>

  <!-- Sawtooth inventory level (deterministic-ish depletion with uncertainty shading) -->
  <polyline points="80,120 200,340 200,120 320,300 320,120 440,330 440,120 560,290 560,120 680,320 680,120 740,240"
            fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Uncertainty band around demand slopes -->
  <polygon points="80,110 200,300 200,380 80,140" fill="#93C5FD" opacity="0.35"/>
  <polygon points="320,110 440,290 440,370 320,140" fill="#93C5FD" opacity="0.35"/>
  <polygon points="560,110 680,280 680,360 560,140" fill="#93C5FD" opacity="0.35"/>

  <!-- Order arrival markers -->
  <circle cx="200" cy="120" r="6" fill="#16A34A"/>
  <circle cx="320" cy="120" r="6" fill="#16A34A"/>
  <circle cx="440" cy="120" r="6" fill="#16A34A"/>
  <circle cx="560" cy="120" r="6" fill="#16A34A"/>
  <circle cx="680" cy="120" r="6" fill="#16A34A"/>
  <text x="150" y="95" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="13" fill="#16A34A" font-weight="bold">سفارش می‌رسد</text>

  <!-- Small normal distribution curve illustrating demand uncertainty, top right -->
  <g transform="translate(560,60)">
    <path d="M0,40 C20,40 20,0 45,0 C70,0 70,40 90,40" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
    <line x1="45" y1="0" x2="45" y2="45" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="10" y="60" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#7C3AED">توزیع احتمالی تقاضا</text>
  </g>

  <!-- Legend -->
  <rect x="80" y="30" width="16" height="10" fill="#93C5FD" opacity="0.6"/>
  <text x="100" y="40" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="12" fill="#334155">نوسان تقاضا</text>
</svg>
