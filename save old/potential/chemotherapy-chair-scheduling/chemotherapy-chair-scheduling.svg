<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Vazirmatn, Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Title bar -->
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f766e">بخش شیمی‌درمانی سرپایی</text>
  <line x1="60" y1="52" x2="840" y2="52" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Pharmacy prep box -->
  <rect x="60" y="80" width="150" height="90" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="135" y="110" text-anchor="middle" font-size="14" fill="#0e7490" font-weight="bold">داروخانه</text>
  <rect x="85" y="122" width="26" height="34" rx="3" fill="#a5f3fc" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="120" y="122" width="26" height="34" rx="3" fill="#a5f3fc" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="155" y="122" width="26" height="34" rx="3" fill="#a5f3fc" stroke="#0891b2" stroke-width="1.5"/>
  <text x="135" y="162" text-anchor="middle" font-size="11" fill="#155e63">آماده‌سازی دارو</text>

  <!-- Arrow to chairs -->
  <line x1="215" y1="125" x2="255" y2="125" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Infusion chairs row -->
  <g id="chairs">
    <!-- Chair template repeated -->
    <!-- Chair 1 -->
    <g transform="translate(260,80)">
      <rect x="0" y="30" width="60" height="55" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <circle cx="30" cy="20" r="12" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
      <line x1="65" y1="10" x2="65" y2="60" stroke="#64748b" stroke-width="3"/>
      <circle cx="65" cy="8" r="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <text x="30" y="102" text-anchor="middle" font-size="11" fill="#92400e">صندلی ۱</text>
      <text x="30" y="116" text-anchor="middle" font-size="10" fill="#78350f">بیمار A</text>
    </g>
    <!-- Chair 2 -->
    <g transform="translate(360,80)">
      <rect x="0" y="30" width="60" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <circle cx="30" cy="20" r="12" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
      <line x1="65" y1="10" x2="65" y2="60" stroke="#64748b" stroke-width="3"/>
      <circle cx="65" cy="8" r="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <text x="30" y="102" text-anchor="middle" font-size="11" fill="#166534">صندلی ۲</text>
      <text x="30" y="116" text-anchor="middle" font-size="10" fill="#14532d">بیمار B</text>
    </g>
    <!-- Chair 3 -->
    <g transform="translate(460,80)">
      <rect x="0" y="30" width="60" height="55" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <circle cx="30" cy="20" r="12" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
      <line x1="65" y1="10" x2="65" y2="60" stroke="#64748b" stroke-width="3"/>
      <circle cx="65" cy="8" r="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <text x="30" y="102" text-anchor="middle" font-size="11" fill="#991b1b">صندلی ۳</text>
      <text x="30" y="116" text-anchor="middle" font-size="10" fill="#7f1d1d">بیمار C</text>
    </g>
    <!-- Chair 4 (empty / idle) -->
    <g transform="translate(560,80)">
      <rect x="0" y="30" width="60" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
      <line x1="65" y1="10" x2="65" y2="60" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="65" cy="8" r="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="30" y="102" text-anchor="middle" font-size="11" fill="#64748b">صندلی ۴</text>
      <text x="30" y="116" text-anchor="middle" font-size="10" fill="#94a3b8">خالی</text>
    </g>
  </g>

  <!-- Nurse station -->
  <g transform="translate(670,85)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="75" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">ایستگاه پرستاری</text>
    <circle cx="35" cy="55" r="13" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <rect x="20" y="70" width="30" height="26" rx="6" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <circle cx="95" cy="55" r="13" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <rect x="80" y="70" width="30" height="26" rx="6" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <text x="75" y="105" text-anchor="middle" font-size="10" fill="#3730a3">۲ پرستار مجاز شیمی‌درمانی</text>
  </g>

  <!-- Timeline / Gantt schedule board -->
  <rect x="60" y="220" width="760" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f766e">تابلوی زمان‌بندی صندلی‌ها</text>

  <!-- time axis -->
  <line x1="160" y1="260" x2="800" y2="260" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="255" font-size="10" fill="#64748b">۸:۰۰</text>
  <text x="290" y="255" font-size="10" fill="#64748b">۱۰:۰۰</text>
  <text x="420" y="255" font-size="10" fill="#64748b">۱۲:۰۰</text>
  <text x="550" y="255" font-size="10" fill="#64748b">۱۴:۰۰</text>
  <text x="680" y="255" font-size="10" fill="#64748b">۱۶:۰۰</text>
  <text x="790" y="255" font-size="10" fill="#64748b">۱۸:۰۰</text>

  <!-- rows for chairs -->
  <text x="130" y="292" text-anchor="end" font-size="11" fill="#374151">صندلی ۱</text>
  <rect x="160" y="278" width="60" height="24" rx="4" fill="#fde68a" stroke="#d97706"/>
  <text x="190" y="294" text-anchor="middle" font-size="9" fill="#78350f">دارو</text>
  <rect x="220" y="278" width="140" height="24" rx="4" fill="#fbbf24" stroke="#d97706"/>
  <text x="290" y="294" text-anchor="middle" font-size="9" fill="#78350f">بیمار A - انفوزیون</text>

  <text x="130" y="332" text-anchor="end" font-size="11" fill="#374151">صندلی ۲</text>
  <rect x="230" y="318" width="45" height="24" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="252" y="334" text-anchor="middle" font-size="9" fill="#14532d">دارو</text>
  <rect x="275" y="318" width="260" height="24" rx="4" fill="#4ade80" stroke="#16a34a"/>
  <text x="405" y="334" text-anchor="middle" font-size="9" fill="#14532d">بیمار B - انفوزیون طولانی</text>

  <text x="130" y="372" text-anchor="end" font-size="11" fill="#374151">صندلی ۳</text>
  <rect x="350" y="358" width="45" height="24" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="372" y="374" text-anchor="middle" font-size="9" fill="#7f1d1d">دارو</text>
  <rect x="395" y="358" width="100" height="24" rx="4" fill="#f87171" stroke="#dc2626"/>
  <text x="445" y="374" text-anchor="middle" font-size="9" fill="#7f1d1d">بیمار C</text>
  <rect x="560" y="358" width="120" height="24" rx="4" fill="#f87171" stroke="#dc2626"/>
  <text x="620" y="374" text-anchor="middle" font-size="9" fill="#7f1d1d">بیمار D</text>

  <text x="130" y="412" text-anchor="end" font-size="11" fill="#374151">صندلی ۴</text>
  <rect x="450" y="398" width="90" height="24" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="495" y="414" text-anchor="middle" font-size="9" fill="#475569">بلاتکلیف</text>
  <rect x="560" y="398" width="180" height="24" rx="4" fill="#93c5fd" stroke="#2563eb"/>
  <text x="650" y="414" text-anchor="middle" font-size="9" fill="#1e3a8a">بیمار E - انفوزیون</text>

  <text x="440" y="500" text-anchor="middle" font-size="13" fill="#475569">هماهنگی زنجیره‌ای داروخانه → صندلی → پرستار برای کاهش زمان انتظار بیمار</text>
</svg>
