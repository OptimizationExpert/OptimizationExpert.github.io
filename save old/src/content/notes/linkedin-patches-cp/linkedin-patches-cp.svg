<svg viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="560" height="620" fill="#ffffff"/>

  <text x="280" y="35" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">پازل Patches: تقسیم شبکه به مستطیل‌ها</text>

  <!-- grid 8x8, each cell 60px, starting at (40,60) -->
  <g>
    <!-- colored rectangles matching the rectangles.py grid concept -->
    <rect x="40" y="60" width="180" height="120" fill="#93C5FD" stroke="#1e293b" stroke-width="2"/>
    <text x="130" y="125" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">4</text>

    <rect x="220" y="60" width="120" height="180" fill="#FCA5A5" stroke="#1e293b" stroke-width="2"/>
    <text x="280" y="155" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">3</text>

    <rect x="340" y="60" width="60" height="60" fill="#FDE68A" stroke="#1e293b" stroke-width="2"/>
    <text x="370" y="95" font-size="16" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif">■</text>

    <rect x="400" y="60" width="120" height="60" fill="#86EFAC" stroke="#1e293b" stroke-width="2"/>
    <text x="460" y="95" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">3</text>

    <rect x="40" y="180" width="60" height="240" fill="#FCD34D" stroke="#1e293b" stroke-width="2"/>
    <text x="70" y="305" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">2</text>

    <rect x="100" y="240" width="120" height="60" fill="#C4B5FD" stroke="#1e293b" stroke-width="2"/>
    <text x="160" y="275" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">6</text>

    <rect x="220" y="240" width="180" height="60" fill="#67E8F9" stroke="#1e293b" stroke-width="2"/>
    <text x="310" y="275" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">12</text>

    <rect x="400" y="120" width="120" height="240" fill="#FDBA74" stroke="#1e293b" stroke-width="2"/>
    <text x="460" y="245" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">2</text>

    <rect x="100" y="300" width="60" height="120" fill="#F9A8D4" stroke="#1e293b" stroke-width="2"/>
    <text x="130" y="365" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">5</text>

    <rect x="160" y="300" width="60" height="60" fill="#A7F3D0" stroke="#1e293b" stroke-width="2"/>

    <rect x="220" y="300" width="180" height="120" fill="#DDD6FE" stroke="#1e293b" stroke-width="2"/>
    <text x="310" y="365" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">3</text>

    <rect x="40" y="420" width="60" height="60" fill="#BBF7D0" stroke="#1e293b" stroke-width="2"/>

    <rect x="100" y="420" width="120" height="60" fill="#FEF08A" stroke="#1e293b" stroke-width="2"/>

    <rect x="220" y="420" width="180" height="60" fill="#FECACA" stroke="#1e293b" stroke-width="2"/>
    <text x="310" y="455" font-size="20" fill="#1e293b" text-anchor="middle" font-family="Tahoma, sans-serif" font-weight="bold">4</text>

    <rect x="400" y="360" width="120" height="120" fill="#BFDBFE" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- grid lines overlay -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.35">
    <line x1="40" y1="60" x2="520" y2="60"/>
    <line x1="40" y1="120" x2="520" y2="120"/>
    <line x1="40" y1="180" x2="520" y2="180"/>
    <line x1="40" y1="240" x2="520" y2="240"/>
    <line x1="40" y1="300" x2="520" y2="300"/>
    <line x1="40" y1="360" x2="520" y2="360"/>
    <line x1="40" y1="420" x2="520" y2="420"/>
    <line x1="40" y1="480" x2="520" y2="480"/>
    <line x1="40" y1="60" x2="40" y2="480"/>
    <line x1="100" y1="60" x2="100" y2="480"/>
    <line x1="160" y1="60" x2="160" y2="480"/>
    <line x1="220" y1="60" x2="220" y2="480"/>
    <line x1="280" y1="60" x2="280" y2="480"/>
    <line x1="340" y1="60" x2="340" y2="480"/>
    <line x1="400" y1="60" x2="400" y2="480"/>
    <line x1="460" y1="60" x2="460" y2="480"/>
    <line x1="520" y1="60" x2="520" y2="480"/>
  </g>
  <rect x="40" y="60" width="480" height="420" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <text x="280" y="530" font-size="15" fill="#475569" text-anchor="middle" font-family="Tahoma, sans-serif">هر عدد = مساحت مستطیلی که باید همان خانه را در بر بگیرد</text>
  <text x="280" y="555" font-size="15" fill="#475569" text-anchor="middle" font-family="Tahoma, sans-serif">مربع زرد = خانه‌ای که شکل مستطیلش از قبل مشخص شده (مربع)</text>
  <text x="280" y="590" font-size="13" fill="#94A3B8" text-anchor="middle" font-family="Tahoma, sans-serif">حل با Constraint Programming (OR-Tools CP-SAT)</text>
</svg>
